  el.querySelectorAll('.lv-btn').forEach(function(b){
    b.onclick = function(){ state.lv = parseInt(b.dataset.i,10); resetLevel(); saveProgress(); render(); };
  });
}

function renderMain(){
  _rubyMode = (state.subj === 'jp') ? 'jp' : 'std';
  var main = document.getElementById('main');
  var level = SUBJECTS[state.subj].levels[state.lv];
  var qs = level.questions;

  if(state.qi >= qs.length){
    renderResult(level);
    return;
  }

  var q = qs[state.qi];

  var progressHtml = '';
  for(var i=0;i<qs.length;i++){
    var cls = '';
    if(i < state.qi) cls = state.results[i] === 'ok' ? 'ok' : 'ng';
    else if(i === state.qi) cls = 'cur';
    progressHtml += '<span class="'+cls+'"></span>';
  }

  // 選択肢の表示順をシャッフル（未解答で順序未生成なら作る）
  if(!state.shuffle || state.shuffle.length !== q.choices.length){
    state.shuffle = makeShuffle(q.choices.length);
  }
  var order = state.shuffle;

  var choicesHtml = '';
  var labels = ['A','B','C','D','E','F'];
  for(var disp=0; disp<order.length; disp++){
    var origC = order[disp];           // 元の選択肢index
    var cls = 'choice';
    if(state.answered){
      cls += ' disabled';
      if(origC === q.a) cls += ' correct';
      else if(origC === state.selectedChoice) cls += ' wrong';
    }
    choicesHtml += '<button class="'+cls+'" data-c="'+origC+'"><span class="lbl">'+labels[disp]+'</span><span>'+fracText(q.choices[origC])+'</span></button>';
  }

  var fbHtml = '';
  if(state.answered){
    var isOk = state.correct;
    var expl = q.expl ? '<div class="expl">'+escapeHtml(q.expl)+'</div>' : '';
    var searchKey = q.search || q.q.replace(/[？?。、]/g, '').trim();
    var tools = '<div class="fb-tools">' +
      '<button class="fb-tool" data-act="img"><span class="ico">🖼</span>画像で調べる</button>' +
      '<button class="fb-tool" data-act="web"><span class="ico">🔎</span>もっと詳しく</button>' +
      '<button class="fb-tool" data-act="lens"><span class="ico">💬</span>LENS に聞く</button>' +
    '</div>';
    var head = isOk ? '正解！' : '不正解 — 答えを覚えてもう一度！';
    fbHtml = '<div class="feedback show '+(isOk?'ok':'ng')+'" data-key="'+escapeHtml(searchKey)+'">' +
      '<b>'+head+'</b> 正答: '+escapeHtml(q.choices[q.a]) +
      expl + tools +
    '</div>';
  }

  var introHtml = state.qi === 0 ? '<div class="intro"><b>'+escapeHtml(level.name)+'</b><br>'+escapeHtml(level.intro)+'</div>' : '';

  var actionBtn = '';
  if(state.answered){
    if(state.correct){
      actionBtn = '<button class="btn primary" id="nextBtn">'+(state.qi+1 < qs.length ? '次の問題 →' : '結果を見る →')+'</button>';
    } else {
      actionBtn = '<button class="btn primary" id="retryBtn">もう一度挑戦 ↺</button>';
    }
  }

  main.innerHTML = introHtml + '<div class="card">' +
    '<div class="q-meta"><span>問題 '+(state.qi+1)+' / '+qs.length+'</span><span class="progress">'+progressHtml+'</span></div>' +
    '<div class="q-text">'+fracText(q.q)+'</div>' +
    '<div class="choices">'+choicesHtml+'</div>' +
    fbHtml +
    '<div class="actions">' + actionBtn + '</div>' +
  '</div>';

  if(!state.answered){
    main.querySelectorAll('.choice').forEach(function(b){
      b.onclick = function(){
        if(state.answered) return;
        var c = parseInt(b.dataset.c, 10);
        answerQuestion(c, q);
      };
    });
  } else {
    if(state.correct){
      document.getElementById('nextBtn').onclick = function(){
        state.qi += 1;
        state.answered = false;
        state.selectedChoice = -1;
        state.shuffle = null;      // 次の問題は新しい配置
        state.wrongThisQ = false;
        render();
      };
    } else {
      document.getElementById('retryBtn').onclick = function(){
        state.answered = false;
        state.selectedChoice = -1;
        state.shuffle = null;      // 再挑戦は位置を再シャッフル（位置で覚えさせない）
        render();
      };
    }
    // feedback ツールボタン
    var fb = main.querySelector('.feedback');
    if(fb){
      var key = fb.dataset.key || '';
      fb.querySelectorAll('.fb-tool').forEach(function(b){
        b.onclick = function(){
          var act = b.dataset.act;
          if(act === 'img') openSearch(key, true);
          else if(act === 'web') openSearch(key, false);
          else if(act === 'lens') askLens(key);
        };
      });
    }
  }
}

function answerQuestion(c, q){
  state.answered = true;
  state.selectedChoice = c;
  if(c === q.a){
    state.correct = true;
    if(state.wrongThisQ){
      // 一度間違えてから正解 → 進めるが記録は不正解扱い・報酬なし
      state.results.push('ng');
      state.streak = 0;
    } else {
      // 一発正解 → 記録・スコア・ゲーム時間
      state.results.push('ok');
      state.totalScore += 10;
      state.streak += 1;
      if(state.streak > state.bestStreak) state.bestStreak = state.streak;
      var gained = Math.min(1 + Math.floor((state.streak - 1) / 3), 5);
      state.lvEarned += gained;
      earnYen(gained);
    }
  } else {
    // 不正解 → 進まない。答えを見せて「もう一度挑戦」
    state.correct = false;
    state.wrongThisQ = true;
    state.streak = 0;
  }
  saveProgress();
  render();
}

function renderResult(level){
  var ok = state.results.filter(function(r){ return r === 'ok'; }).length;
  var total = level.questions.length;
  var pct = Math.round(ok / total * 100);
  var msg, head;
  if(pct === 100){ head='パーフェクト！'; msg='全問正解！素晴らしい。<b>次のレベル</b>に進もう。'; }
  else if(pct >= 80){ head='よくできました'; msg='かなり理解できているね。間違えた問題は<b>もう一度</b>復習しよう。'; }
  else if(pct >= 60){ head='合格ライン'; msg='半分以上正解。<b>もう一度</b>挑戦して定着させよう。'; }
  else if(pct >= 40){ head='あと少し'; msg='間違いから学ぶチャンス。<b>解説</b>を読んで再挑戦。'; }
  else { head='ファイト'; msg='最初は誰でもこんなもの。<b>あきらめずに</b>もう一回。'; }

  if(pct >= 60){
    var firstClear = !state.doneLevels[state.subj+'-'+state.lv];
    state.doneLevels[state.subj+'-'+state.lv] = true;
    saveProgress();
    // レベル初クリアの大きな達成ボーナス（満点+5分 / 合格+3分）
    if(firstClear){ var bonus = pct === 100 ? 5 : 3; state.lvEarned += bonus; earnYen(bonus); }
  }

  var canNext = (state.lv + 1 < SUBJECTS[state.subj].levels.length);
  var nextBtn = canNext ? '<button class="btn primary" id="resNext">次のレベルへ →</button>' : '';

  var main = document.getElementById('main');
  main.innerHTML = '<div class="result">' +
    '<h2>'+escapeHtml(head)+'</h2>' +
    '<div class="score">'+ok+' / '+total+'</div>' +
    '<div class="msg">'+msg+'<br><br>レベル: <b>'+escapeHtml(level.name)+'</b> ('+pct+'%)</div>' +
    '<div class="actions"><button class="btn" id="resRetry">もう一度</button>'+nextBtn+'</div>' +
  '</div>';

  document.getElementById('resRetry').onclick = function(){
    if(state.lvEarned > 0) loseGameTime(state.lvEarned); // 初めからやり直す → 得た時間を返納
    resetLevel(); render();
  };
  if(canNext) document.getElementById('resNext').onclick = function(){ state.lv += 1; resetLevel(); saveProgress(); render(); };

  // 勉強順ナビ中: レベル完了 → 少し見せてから自動で次（要点）へ
  if(guide.active && currentMode === 'learn'){
    var gi = guideCurrentIndex();
    if(gi > -1 && gi < GUIDE_ORDER.length - 1){
      setTimeout(function(){
        if(guide.active && currentMode === 'learn') switchMode(GUIDE_ORDER[gi+1].mode);
      }, 1600);
    }
  }
}

function resetLevel(){
  state.qi = 0;
  state.answered = false;
  state.results = [];
  state.selectedChoice = -1;
  state.shuffle = null;
  state.wrongThisQ = false;
  state.correct = false;
  state.lvEarned = 0;
}

function updateStats(){
  document.getElementById('statScore').textContent = state.totalScore;
  document.getElementById('statStreak').textContent = state.streak;
  var done = Object.keys(state.doneLevels).filter(function(k){ return state.doneLevels[k]; }).length;
  document.getElementById('statDone').textContent = done;
}

function render(){
  renderSubjTabs();
  renderLvBar();
  renderMain();
  updateStats();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}

var COMPOUND_MAXLEN = (function(){ var mx=1; for(var k in FURIGANA){ if(k.length>mx) mx=k.length; } return mx; })();
function isKanjiChar(ch){ var c=ch.charCodeAt(0); return (c>=0x4E00 && c<=0x9FFF) || (c>=0x3400 && c<=0x4DBF); }
// std用：複合語辞書（正しい読み）→ 単漢字フォールバック の順でルビを振る
function furiganaStd(s){
  var out='', i=0, n=s.length;
  while(i<n){
    var ch=s[i];
    if(ch==='<'){ var gt=s.indexOf('>',i); if(gt===-1){ out+=s.slice(i); break; } out+=s.slice(i,gt+1); i=gt+1; continue; } // タグはそのまま
    if(ch==='&'){ var sc=s.indexOf(';',i); if(sc!==-1 && sc-i<=8){ out+=s.slice(i,sc+1); i=sc+1; continue; } } // HTMLエンティティはそのまま
    if(isKanjiChar(ch)){
      // 1) 複合語辞書（長い順）＝必ず正しい読み
      var matched=false;
      for(var L=Math.min(COMPOUND_MAXLEN, n-i); L>=2; L--){ var sub=s.substr(i,L); if(FURIGANA[sub]){ out+='<ruby>'+sub+'<rt>'+FURIGANA[sub]+'</rt></ruby>'; i+=L; matched=true; break; } }
      if(matched) continue;
      // 2) 単漢字フォールバックは「前後がかな等で孤立した漢字」だけに適用（未知の熟語を誤読しない）
      var yomi = FURIGANA[ch] || KANJI_YOMI[ch];
      if(yomi){
        var prevK = (i>0) && isKanjiChar(s[i-1]);
        var nextK = (i+1<n) && isKanjiChar(s[i+1]);
        if(!prevK && !nextK){ out+='<ruby>'+ch+'<rt>'+yomi+'</rt></ruby>'; i++; continue; }
      }
    }
    out+=ch; i++;
  }
  return out;
}
function furigana(s){
  if(_rubyMode === 'off') return s;
  if(_rubyMode === 'jp'){
    return s.replace(FURIGANA_JP_RE, function(m){ return '<ruby>' + m + '<rt>' + FURIGANA_JP[m] + '</rt></ruby>'; });
  }
  return furiganaStd(s);
}

// 文中の「分子/分母」を縦並びの分数に＋用語にふりがな（先にHTMLエスケープ）
function fracText(s){
  var out = escapeHtml(s).replace(/(\d+)\s*\/\s*(\d+)/g,
    '<span class="ifrac"><span class="ifn">$1</span><span class="ifd">$2</span></span>');
  return furigana(out);
}

    ]
  }
};

// ===== TEST HINTS (auto-generated from question data) =====
function getTestHint(subj, setIdx, qi){
  var q = TEST_DATA[subj].sets[setIdx].questions[qi];
  if(q.type === 'fraction'){
    return '分子（上）と分母（下）に分けて入力。約分した形で答えよう。';
  }
  if(q.type === 'listening'){
    return 'もう一度 🔊 を押して聞いてみよう。語数: ' + q.audio.split(' ').length + '語';
  }
  if(q.type === 'writing'){
    var kw0 = q.keywords[0];
    var first = kw0.charAt(0);
    if(q.keywords.length === 1){
      if(kw0.length <= 2) return '答えは' + kw0.length + '文字';
      return '最初の文字: 「' + first + '」';
    }
    return 'キーワード' + q.keywords.length + '個 — 最初は「' + first + '」';
  }
  if(q.type === 'choice'){
    for(var i = q.choices.length - 1; i >= 0; i--){
      if(i !== q.correct) return '「' + q.choices[i] + '」は違います';
    }
  }
  return '';
}

  document.querySelectorAll('.mode-btn').forEach(function(b){

  setBar.style.display = 'none';
  var subjTabsEl = document.getElementById('subjTabs');
  if(subjTabsEl) subjTabsEl.style.display = (mode === 'daily') ? 'none' : '';

    trainState.picked=null; trainState.revealed=false; trainState.elim=[]; trainState.hintShown=false;
    renderTrain();
  }
  // 勉強順ナビが有効なら現在ステップを同期
  if(guide.active) renderGuide();
}

  var btn=document.getElementById('focusToggle'); if(btn) btn.textContent = on ? '↩ もどす' : '🎯 中間集中';

function loadFocus(){
  try{

      document.getElementById('root').classList.add('focus-mode');
      var btn=document.getElementById('focusToggle'); if(btn) btn.textContent='↩ もどす';
      if(['train','finisher','release','matome'].indexOf(currentMode)<0) switchMode('train');
    }
  }catch(e){}
}

// ============ 今日の勉強順ナビ ============
var GUIDE_ORDER = [
  {mode:'learn',   label:'学ぶ'},
  {mode:'summary', label:'要点'},
  {mode:'cards',   label:'暗記'},
  {mode:'test',    label:'テスト'}
];
var guide = { active:false };

document.getElementById('guideStart').onclick = function(){
  if(guide.active){ guideStop(); return; }
  guide.active = true;
  document.getElementById('guideStart').classList.add('active');
  switchMode('learn'); // ①学ぶ から開始（switchMode内で renderGuide される）
};

function guideStop(){
  guide.active = false;
  document.getElementById('guideStart').classList.remove('active');
  renderGuide();
}

function guideCurrentIndex(){
  for(var i=0;i<GUIDE_ORDER.length;i++) if(GUIDE_ORDER[i].mode === currentMode) return i;
  return -1;
}

function renderGuide(){
  var el = document.getElementById('studyGuide');
  if(!guide.active){ el.className = 'study-guide'; el.innerHTML = ''; return; }
  el.className = 'study-guide show';
  var cur = guideCurrentIndex();
  var subjName = (SUBJECTS[currentSubj] ? SUBJECTS[currentSubj].name : '');
  var html = '<span class="guide-title">📋 '+escapeHtml(subjName)+'の勉強順</span><div class="guide-steps">';
  for(var i=0;i<GUIDE_ORDER.length;i++){
    var cls = 'guide-step';
    if(i === cur) cls += ' current';
    else if(cur > -1 && i < cur) cls += ' done';
    var no = (cur > -1 && i < cur) ? '✓' : (i+1);
    html += '<button class="'+cls+'" data-gi="'+i+'"><span class="gstep-no">'+no+'</span>'+escapeHtml(GUIDE_ORDER[i].label)+'</button>';
    if(i < GUIDE_ORDER.length-1) html += '<span class="guide-arrow">→</span>';
  }
  html += '</div>';
  if(cur === GUIDE_ORDER.length-1){
    html += '<span class="guide-done-msg">🎉 ひととおり完了！おつかれさま</span>';
  }
  html += '<button class="guide-close" id="guideClose" title="ナビを閉じる">×</button>';
  el.innerHTML = html;

  el.querySelectorAll('.guide-step').forEach(function(b){
    b.onclick = function(){ switchMode(GUIDE_ORDER[parseInt(b.dataset.gi,10)].mode); };
  });
  document.getElementById('guideClose').onclick = guideStop;
}

// ===== TEST RENDERING =====
function testRender(){
  testRenderSubjTabs();
  testRenderSetBar();
  testRenderMain();
}

function testRenderSubjTabs(){
  var el = document.getElementById('subjTabs');
  var html = '';
  Object.keys(TEST_DATA).forEach(function(k){
    var s = TEST_DATA[k];
    var act = (k === testState.subj) ? 'active' : '';
    html += '<button class="subj-tab '+act+'" data-k="'+k+'"><span class="glyph">'+s.glyph+'</span>'+s.name+'</button>';
  });
  el.innerHTML = html;
  el.querySelectorAll('.subj-tab').forEach(function(b){
    b.onclick = function(){
      if(testState.running) return;
      currentSubj = b.dataset.k;
      testState.subj = b.dataset.k;
      testState.set = 0;
      testResetState();
      testRender();
    };
  });
}

function testRenderSetBar(){
  var el = document.getElementById('testSetBar');
  var sets = TEST_DATA[testState.subj].sets;
  var html = '<span class="lv-label">Set</span>';
  for(var i=0;i<sets.length;i++){
    var act = (i === testState.set) ? 'active' : '';
    html += '<button class="test-set-btn '+act+'" data-i="'+i+'">Set '+(i+1)+'<br><small>'+sets[i].questions.length+'問</small></button>';
  }
  el.innerHTML = html;
  el.querySelectorAll('.test-set-btn').forEach(function(b){
    b.onclick = function(){
      if(testState.running) return;
      testState.set = parseInt(b.dataset.i, 10);
      testResetState();
      testRender();
    };
  });
}

function testRenderMain(){
  _rubyMode = (testState.subj === 'jp') ? 'jp' : 'std';
  var main = document.getElementById('main');
  var setData = TEST_DATA[testState.subj].sets[testState.set];
  var qs = setData.questions;

  // === Phase: Intro ===
  if(testState.phase === 'intro'){
    main.innerHTML = '<div class="card" style="text-align:center">' +
      '<div class="q-meta"><span>'+TEST_DATA[testState.subj].name+' — '+setData.name+'</span></div>' +
      '<div class="q-text" style="margin:20px 0">'+qs.length+'問 / 制限時間10分<br><br>記述式はキーワード照合で自動採点。<br>選択式はボタンで回答。<br>🎧 聞き取りは 🔊 で再生。<br>💡ヒントで手がかりも見れます。</div>' +
      '<div class="actions" style="justify-content:center"><button class="btn primary" id="testStartBtn">テスト開始 →</button></div>' +
    '</div>';
    document.getElementById('testStartBtn').onclick = function(){
      testState.running = true;
      testState.phase = 'testing';
      testState.timeRemaining = 600;
      testStartTimer();
      testRenderMain();
    };
    return;
  }

  // === Phase: Result ===
  if(testState.phase === 'result'){
    testRenderResult();
    return;
  }

  // === Phase: Testing — test sheet (all 10 questions) ===
  var html = '';

  // Grade mode toggle bar
  html += '<div class="test-mode-bar">';
  html += '<button class="test-mode-pill '+(testState.gradeMode==='realtime'?'active':'')+'" data-gm="realtime">リアルタイム採点</button>';
  html += '<button class="test-mode-pill '+(testState.gradeMode==='batch'?'active':'')+'" data-gm="batch">一括採点</button>';
  html += '</div>';

  // Test sheet: left=questions, right=answers
  html += '<div class="test-sheet">';
  var lastPassage = null;
  for(var i=0; i<qs.length; i++){
    var q = qs[i];
    var hint = getTestHint(testState.subj, testState.set, i);

    // 文章問題: 本文を表示（連続して同じ本文なら1回だけ）
    if(q.passage && q.passage !== lastPassage){
      html += '<div class="reading-passage"><div class="rp-label">次の文章を読んで、あとの問いに答えなさい。</div>'+furigana(escapeHtml(q.passage)).replace(/\n/g,'<br>')+'</div>';
      lastPassage = q.passage;
    } else if(!q.passage){
      lastPassage = null;
    }

    html += '<div class="test-row">';

    // Left column: question number + text + hint button
    html += '<div class="test-q">';
    html += '<span class="num">'+(i+1)+'</span>';
    html += '<div style="flex:1;min-width:0">';
    html += '<div style="display:flex;align-items:flex-start;gap:6px">';
    if(q.type === 'listening'){
      html += '<span style="flex:1">🎧 '+escapeHtml(q.text)+'<button class="audio-btn" data-audio="'+escapeHtml(q.audio)+'" style="margin-left:8px">&#x1f50a; 再生</button></span>';
    } else {
      html += '<span style="flex:1">'+fracText(q.text)+'</span>';
    }
    html += '<button class="hint-btn" data-hi="'+i+'" title="ヒント">💡</button>';
    html += '</div>';
    html += '<div class="test-hint" id="hint-'+i+'">'+escapeHtml(hint)+'</div>';
    html += '</div>';
    html += '</div>';

    // Right column: answer input + score badge
    html += '<div class="test-a" id="ta-'+i+'">';
    if(q.type === 'fraction'){
      var fa = testState.answers[i] || {};
      var fsign = fa.sign === -1 ? -1 : 1;
      var fn = (fa.n !== undefined && fa.n !== null) ? fa.n : '';
      var fd = (fa.d !== undefined && fa.d !== null) ? fa.d : '';
      html += '<div class="frac-input">';
      html += '<button class="frac-sign'+(fsign===-1?' minus':'')+'" data-qi="'+i+'">'+(fsign===-1?'−':'＋')+'</button>';
      html += '<div class="frac-stack">';
      html += '<input class="frac-num" data-qi="'+i+'" inputmode="numeric" value="'+escapeHtml(String(fn))+'" placeholder="分子">';
      html += '<div class="frac-bar"></div>';
      html += '<input class="frac-den" data-qi="'+i+'" inputmode="numeric" value="'+escapeHtml(String(fd))+'" placeholder="分母">';
      html += '</div></div>';
    } else if(q.type === 'writing' || q.type === 'listening'){
      var val = testState.answers[i] !== undefined ? String(testState.answers[i]) : '';
      var ph = q.type === 'listening' ? '聞こえた英文を入力' : '回答を入力';
      html += '<div class="hw-input-wrap"><input type="text" data-qi="'+i+'" value="'+escapeHtml(val)+'" placeholder="'+ph+'"><button class="hw-ico-btn" data-hw="'+i+'" title="手書き入力">✍</button></div>';
    } else {
      html += '<div class="choice-row">';
      for(var c=0; c<q.choices.length; c++){
        var sel = (testState.answers[i] === c) ? ' sel' : '';
        html += '<button class="choice-pill'+sel+'" data-qi="'+i+'" data-c="'+c+'">'+fracText(q.choices[c])+'</button>';
      }
      html += '</div>';
    }
    // Score mark
    var showMark = (testState.gradeMode === 'realtime' && testState.scores[i] !== undefined) || testState.batchGraded;
    if(showMark && testState.scores[i] !== undefined){
      var sc = testState.scores[i];
      var markCls = sc >= 10 ? 'ok' : (sc > 0 ? 'partial' : 'ng');
      var markText = sc >= 10 ? '○ '+sc+'点' : (sc > 0 ? '△ '+sc+'点' : '× 0点');
      html += '<span class="mark '+markCls+'">'+markText+'</span>';
    }
    // 正解表示：一括採点後は自動、それ以外は「答えを見る」ボタンで表示
    var correctTxt;
    if(q.type === 'fraction'){
      var rc = fracReduce(q.num, q.den);
      correctTxt = (rc[0] < 0 ? '−' : '') + Math.abs(rc[0]) + '/' + rc[1];
    } else {
      correctTxt = q.type === 'choice' ? q.choices[q.correct] : q.keywords.join(', ');
    }
    if(testState.revealed[i] || testState.batchGraded){
      html += '<div class="correct-answer show">正解: '+escapeHtml(correctTxt)+'</div>';
    } else {
      html += '<button class="reveal-btn" data-rev="'+i+'">答えを見る</button>';
    }
    html += '</div>'; // .test-a

    html += '</div>'; // .test-row
  }
  html += '</div>'; // .test-sheet

  // Batch grade button (only in batch mode, before grading)
  if(testState.gradeMode === 'batch' && !testState.batchGraded){
    html += '<button class="test-grade-btn" id="testGradeBtn">採点する ✓</button>';
  }

  // Test end button
  html += '<div class="actions" style="justify-content:center;margin-top:12px">';
  html += '<button class="btn primary" id="testSubmit">テスト終了 → 結果を見る</button>';
  html += '</div>';

  main.innerHTML = html;

  // === Event bindings ===

  // Grade mode toggle
  main.querySelectorAll('.test-mode-pill').forEach(function(b){
    b.onclick = function(){
      testState.gradeMode = b.dataset.gm;
      testState.batchGraded = false;
      testRenderMain();
    };
  });

  // Hint buttons
  main.querySelectorAll('.hint-btn').forEach(function(b){
    b.onclick = function(){
      var hi = b.dataset.hi;
      var hintEl = document.getElementById('hint-'+hi);
      if(hintEl){
        hintEl.classList.toggle('show');
        b.classList.toggle('open');
      }
    };
  });

  // Listening audio buttons
  main.querySelectorAll('.audio-btn[data-audio]').forEach(function(b){
    b.onclick = function(){ speakEnglish(b.dataset.audio, b); };
  });

  // 答えを見る ボタン
  main.querySelectorAll('.reveal-btn[data-rev]').forEach(function(b){
    b.onclick = function(){
      testState.revealed[parseInt(b.dataset.rev, 10)] = true;
      testRenderMain();
    };
  });

  // 手書き入力ボタン
  main.querySelectorAll('.hw-ico-btn[data-hw]').forEach(function(b){
    b.onclick = function(){
      var inp = main.querySelector('input[data-qi="'+b.dataset.hw+'"]');
      openHandwriting(inp, currentSubj === 'en' ? 'en' : 'ja');
    };
  });

  // Writing inputs — score on keystroke (display depends on gradeMode)
  main.querySelectorAll('input[type="text"][data-qi]').forEach(function(inp){
    var qi = parseInt(inp.dataset.qi, 10);
    inp.oninput = function(){
      testState.answers[qi] = inp.value;
      testCheckAnswerAt(qi);
      if(testState.gradeMode === 'realtime') updateRowMark(qi);
    };
  });

  // 分数入力（分子/分母 + 符号トグル）
  main.querySelectorAll('.frac-input').forEach(function(box){
    var qi = parseInt(box.querySelector('.frac-num').dataset.qi, 10);
    var signBtn = box.querySelector('.frac-sign');
    var num = box.querySelector('.frac-num');
    var den = box.querySelector('.frac-den');
    function ensure(){
      var a = testState.answers[qi];
      if(!a || typeof a !== 'object'){ a = {sign:1, n:'', d:''}; testState.answers[qi] = a; }
      return a;
    }
    signBtn.onclick = function(){
      var a = ensure();
      a.sign = (a.sign === -1) ? 1 : -1;
      signBtn.textContent = a.sign === -1 ? '−' : '＋';
      signBtn.classList.toggle('minus', a.sign === -1);
      testCheckAnswerAt(qi);
      if(testState.gradeMode === 'realtime') updateRowMark(qi);
    };
    function onFracInput(inp, field){
      var a = ensure();
      var v = inp.value.replace(/[^0-9]/g, '');
      inp.value = v; a[field] = v;
      testCheckAnswerAt(qi);
      if(testState.gradeMode === 'realtime') updateRowMark(qi);
    }
    num.oninput = function(){ onFracInput(num, 'n'); };
    den.oninput = function(){ onFracInput(den, 'd'); };
  });

  // Choice pills
  main.querySelectorAll('.choice-pill').forEach(function(b){
    b.onclick = function(){
      var qi = parseInt(b.dataset.qi, 10);
      var ci = parseInt(b.dataset.c, 10);
      testState.answers[qi] = ci;
      testCheckAnswerAt(qi);
      // Toggle selection visuals
      var row = b.closest('.test-a');
      row.querySelectorAll('.choice-pill').forEach(function(p){ p.classList.remove('sel'); });
      b.classList.add('sel');
      if(testState.gradeMode === 'realtime') updateRowMark(qi);
    };
  });

  // Batch grade button
  var gradeBtn = document.getElementById('testGradeBtn');
  if(gradeBtn){
    gradeBtn.onclick = function(){
      for(var j=0; j<qs.length; j++) testCheckAnswerAt(j);
      testState.batchGraded = true;
      testRenderMain();
    };
  }

  // Submit / end test
  document.getElementById('testSubmit').onclick = function(){
    for(var j=0; j<qs.length; j++) testCheckAnswerAt(j);
    testStopTimer();
    testShowResult();
  };
}

// 分数を約分（符号は分子へ）
function fracReduce(n, d){
  n = Number(n); d = Number(d);
  if(!d) return [0, 0];
  var sign = ((n < 0) !== (d < 0)) ? -1 : 1;
  n = Math.abs(n); d = Math.abs(d);
  function gcd(a, b){ return b === 0 ? a : gcd(b, a % b); }
  var g = gcd(n, d) || 1;
  return [sign * (n / g), d / g];
}

function testCheckAnswerAt(qi){
  var setData = TEST_DATA[testState.subj].sets[testState.set];
  var q = setData.questions[qi];
  var userAnswer = testState.answers[qi];

  // 分数タイプ
  if(q.type === 'fraction'){
    var a = userAnswer;
    if(!a || a.n === '' || a.n === undefined || a.d === '' || a.d === undefined || Number(a.d) === 0){
      testState.scores[qi] = 0;
    } else {
      var u = fracReduce((a.sign === -1 ? -1 : 1) * Number(a.n), Number(a.d));
      var c = fracReduce(q.num, q.den);
      testState.scores[qi] = (u[0] === c[0] && u[1] === c[1]) ? 10 : 0;
    }
    if(testState.scores[qi] >= 10 && !testState.earned[qi]){ testState.earned[qi] = true; earnYen(2); }
    return;
  }

  if(userAnswer === undefined || userAnswer === null || userAnswer === ''){
    testState.scores[qi] = 0;
    return;
  }

  if(q.type === 'choice'){
    testState.scores[qi] = (userAnswer === q.correct) ? 10 : 0;
  } else {
    var keywords = q.keywords;
    var text = String(userAnswer).toLowerCase();
    var matched = keywords.filter(function(kw){
      return text.indexOf(kw.toLowerCase()) !== -1;
    }).length;
    if(matched >= keywords.length) testState.scores[qi] = 10;
    else if(matched > 0) testState.scores[qi] = Math.ceil((matched / keywords.length) * 10);
    else testState.scores[qi] = 0;
  }
  // 満点ではじめて正解した問題は +2分
  if(testState.scores[qi] >= 10 && !testState.earned[qi]){
    testState.earned[qi] = true;
    earnYen(2);
  }
}

function updateRowMark(qi){
  var setData = TEST_DATA[testState.subj].sets[testState.set];
  var q = setData.questions[qi];
  var aCol = document.getElementById('ta-'+qi);
  if(!aCol) return;
  var oldMark = aCol.querySelector('.mark');
  if(oldMark) oldMark.remove();
  var oldCorrect = aCol.querySelector('.correct-answer');
  if(oldCorrect) oldCorrect.remove();

  if(testState.scores[qi] !== undefined){
    var sc = testState.scores[qi];
    var markCls = sc >= 10 ? 'ok' : (sc > 0 ? 'partial' : 'ng');
    var markText = sc >= 10 ? '○ '+sc+'点' : (sc > 0 ? '△ '+sc+'点' : '× 0点');
    var markEl = document.createElement('span');
    markEl.className = 'mark ' + markCls;
    markEl.textContent = markText;
    // マークは「答えを見る」ボタンの前に挿入
    var revBtn = aCol.querySelector('.reveal-btn');
    if(revBtn) aCol.insertBefore(markEl, revBtn);
    else aCol.appendChild(markEl);
  }
}

// ============ 総合まとめ模試 MOCK MODE ============
// 各教科の全範囲（全TESTセットの問題プール）から出題する、50分の総合模試。
// 5パターン。各教科ごとに独立。
var MOCK_TIME = 50 * 60;
var MOCK_COUNT = 25; // 1パターンの問題数（中1単元・50分想定）
// 難易度レベル（上がるほど難しい）
var MOCK_LEVELS = [
  {n:1, mode:'choice', name:'選択肢', desc:'やさしい'},
  {n:2, mode:'hint',   name:'ヒント', desc:'ふつう'},
  {n:3, mode:'normal', name:'問題のみ', desc:'本番'}
];
var mockState = {
  subj: 'en', pattern: 0, phase: 'intro',
  questions: [], answers: {}, scores: {}, earned: {},
  level: 1,                // 1:選択肢 2:ヒント 3:通常
  choiceSets: {},          // 選択肢モード用に生成した選択肢
  choiceAnswers: {},       // 選択肢モードでの選択（index）
  revealedHints: {},       // ヒント表示済み
  timeRemaining: MOCK_TIME, running: false, timerInterval: null, graded: false
};
function mockSupport(){ return MOCK_LEVELS[(mockState.level || 1) - 1].mode; }

// 問題ごとのヒント文
function mockHint(q){
  if(q.type === 'choice'){
    for(var i = q.choices.length - 1; i >= 0; i--){ if(i !== q.correct) return '「' + q.choices[i] + '」はちがうよ'; }
  }
  if(q.type === 'fraction'){ var r = fracReduce(q.num, q.den); return '約分した分数。分母は ' + r[1] + ' になるよ'; }
  if(q.type === 'listening'){ return '語数: ' + q.audio.split(' ').length + '語。もう一度 🔊 を押そう'; }
  var kw = q.keywords[0];
  if(q.keywords.length === 1) return kw.length <= 2 ? ('答えは ' + kw.length + ' 文字') : ('最初の文字は「' + kw.charAt(0) + '」');
  return 'キーワード ' + q.keywords.length + ' 個。最初は「' + q.keywords[0].charAt(0) + '」';
}

// 問題の「正答テキスト」（選択肢モードの正解表示・ダミー生成用）
function mockCanonical(q){
  if(q.type === 'choice') return q.choices[q.correct];
  if(q.type === 'fraction'){ var r = fracReduce(q.num, q.den); return (r[0] < 0 ? '-' : '') + Math.abs(r[0]) + '/' + r[1]; }
  return q.keywords.length === 1 ? q.keywords[0] : q.keywords.join('、');
}
function mockIsNum(s){ return /^[\s\-+]*\d/.test(s) || String(s).indexOf('/') >= 0; }

// 選択肢モードの選択肢を全問分つくる（同タイプの答えをダミーに）
function mockBuildChoiceSets(){
  var qs = mockState.questions;
  var canon = qs.map(mockCanonical);
  var numPool = [], txtPool = [];
  canon.forEach(function(a){ (mockIsNum(a) ? numPool : txtPool).push(a); });
  mockState.choiceSets = {};
  for(var i = 0; i < qs.length; i++){
    var q = qs[i];
    if(q.type === 'choice'){
      mockState.choiceSets[i] = { choices: q.choices.slice(), correct: q.correct };
      continue;
    }
    var correct = canon[i];
    var pool = (mockIsNum(correct) ? numPool : txtPool).filter(function(a){ return a !== correct; });
    var uniq = [];
    pool.forEach(function(a){ if(uniq.indexOf(a) < 0) uniq.push(a); });
    uniq = mockSeededShuffle(uniq, i + 7);
    var choices = uniq.slice(0, 3).concat([correct]);
    choices = mockSeededShuffle(choices, i + 13);
    mockState.choiceSets[i] = { choices: choices, correct: choices.indexOf(correct) };
  }
}

// 採点共通関数（fraction / choice / 記述キーワード）
function gradeAnswer(q, ua){
  if(q.type === 'fraction'){
    if(!ua || ua.n === '' || ua.n == null || ua.d === '' || ua.d == null || Number(ua.d) === 0) return 0;
    var u = fracReduce((ua.sign === -1 ? -1 : 1) * Number(ua.n), Number(ua.d));
    var c = fracReduce(q.num, q.den);
    return (u[0] === c[0] && u[1] === c[1]) ? 10 : 0;
  }
  if(ua === undefined || ua === null || ua === '') return 0;
  if(q.type === 'choice') return (ua === q.correct) ? 10 : 0;
  var kws = q.keywords, text = String(ua).toLowerCase();
  var m = kws.filter(function(kw){ return text.indexOf(kw.toLowerCase()) !== -1; }).length;
  if(m >= kws.length) return 10;
  if(m > 0) return Math.ceil((m / kws.length) * 10);
  return 0;
}

// 種つきシャッフル（パターンごとに別の出題になる）
function mockSeededShuffle(arr, seed){
  var a = arr.slice();
  var s = (seed * 2654435761) % 2147483647 || 1;
  function rnd(){ s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }
  for(var i = a.length - 1; i > 0; i--){ var j = Math.floor(rnd() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

function buildMockQuestions(subj, pattern){
  var pool = [];
  TEST_DATA[subj].sets.forEach(function(set){ set.questions.forEach(function(q){ pool.push(q); }); });
  var shuffled = mockSeededShuffle(pool, pattern + 1);
  return shuffled.slice(0, Math.min(MOCK_COUNT, shuffled.length));
}

    {instr:'次の各問いに対する答えを、記号で選んで答えなさい。', idx:[], test:function(q){return q.type==='choice';}},
    {instr:'英文を聞いて、聞こえた文を書きなさい。', idx:[], test:function(q){return q.type==='listening';}}

  }

  var support = mockSupport();
  if(support === 'choice' && !Object.keys(mockState.choiceSets).length) mockBuildChoiceSets();

  // 一問分の解答欄HTML

function mockSubmit(){
  var qs = mockState.questions;
  var choiceMode = (mockSupport() === 'choice');
  for(var i = 0; i < qs.length; i++){
    if(choiceMode){
      var cs = mockState.choiceSets[i];
      mockState.scores[i] = (cs && mockState.choiceAnswers[i] === cs.correct) ? 10 : 0;
    } else {
      mockState.scores[i] = gradeAnswer(qs[i], mockState.answers[i]);
    }
  }
  mockState.graded = true;
  mockState.running = false;
  mockState.phase = 'result';
  mockStopTimer();
  mockRenderMain();
}

// 自分の回答を読める文字に
function mockUserAnswerText(i){
  var q = mockState.questions[i];
  if(mockSupport() === 'choice'){
    var cs = mockState.choiceSets[i], ci = mockState.choiceAnswers[i];
    return (cs && ci != null && cs.choices[ci] != null) ? cs.choices[ci] : '（未回答）';
  }
  var a = mockState.answers[i];
  if(q.type === 'fraction'){
    if(!a || a.n === '' || a.n == null || a.d === '' || a.d == null) return '（未回答）';
    return (a.sign === -1 ? '−' : '') + a.n + '/' + a.d;
  }
  if(q.type === 'choice'){
    return (a != null && q.choices[a] != null) ? q.choices[a] : '（未回答）';
  }
  return (a != null && String(a).trim() !== '') ? String(a) : '（未回答）';
}

function mockRenderResult(){
  var qs = mockState.questions;
  var total = 0, full = 0;
  for(var i = 0; i < qs.length; i++){ var sc = mockState.scores[i] || 0; total += sc; if(sc >= 10) full++; }
  var max = qs.length * 10;
  var pct = max ? Math.round(total / max * 100) : 0;
  var grade, msg;
  if(pct >= 80){ grade = '優秀'; msg = '1単元しっかり身についています！本番もこの調子。'; }
  else if(pct >= 60){ grade = '合格'; msg = '合格ライン。間違えた問題を要点で復習しよう。'; }
  else if(pct >= 40){ grade = '要復習'; msg = 'まだ伸びしろあり。LEARN・要点でもう一度固めよう。'; }
  else { grade = 'ファイト'; msg = 'まずはLEARNと要点で基礎から。あきらめずに！'; }

  // ゲーム時間ボーナス（パターンごと1回）
  var key = mockState.subj + '-' + mockState.pattern;
  if(!mockState.earned[key]){
    mockState.earned[key] = true;
    earnYen(pct >= 80 ? 5 : (pct >= 60 ? 3 : 1));
  }

  // レベルアップ判定（合格ライン60%以上 & まだ上のレベルがある）
  var canLevelUp = (pct >= 60 && mockState.level < MOCK_LEVELS.length);
  var nextLv = canLevelUp ? MOCK_LEVELS[mockState.level] : null;
  var lvUpBtn = canLevelUp ? '<button class="btn primary" id="mockLevelUp">Lv'+nextLv.n+'「'+nextLv.name+'」に挑戦 →</button>' : '';
  var lvMsg = canLevelUp ? '<br>合格！次は <b>Lv'+nextLv.n+'「'+nextLv.name+'」</b> に挑戦してみよう。' :
    (mockState.level === MOCK_LEVELS.length && pct >= 60 ? '<br>最高レベルで合格！本番もこの調子。' : '');

  var html = '<div class="result">' +
    '<h2>'+escapeHtml(grade)+'</h2>' +
    '<div style="font-size:12px;color:var(--muted);margin-bottom:4px">Lv'+mockState.level+'「'+MOCK_LEVELS[mockState.level-1].name+'」</div>' +
    '<div class="score">'+total+' / '+max+'</div>' +
    '<div class="test-result-grid">' +
      '<div class="test-result-cell"><div class="val">'+full+'</div><div class="lbl">正解</div></div>' +
      '<div class="test-result-cell"><div class="val">'+(qs.length-full)+'</div><div class="lbl">不正解</div></div>' +
      '<div class="test-result-cell"><div class="val">'+pct+'%</div><div class="lbl">得点率</div></div>' +
    '</div>' +
    '<div class="msg">'+msg+lvMsg+'<br><br>'+TEST_DATA[mockState.subj].name+' 総合模試 パターン'+(mockState.pattern+1)+'</div>' +
    '<div class="actions" style="justify-content:center;flex-wrap:wrap;gap:8px">' +
      lvUpBtn +
      '<button class="btn" id="mockReview">解答を確認</button>' +
      '<button class="btn" id="mockRetry">もう一度</button>' +
    '</div></div>';

  // 解答確認（全問の正誤＋正解）
  html += '<div class="test-sheet" style="margin-top:16px">';
  for(var i = 0; i < qs.length; i++){
    var q = qs[i]; var sc = mockState.scores[i] || 0;
    var markCls = sc >= 10 ? 'ok' : (sc > 0 ? 'partial' : 'ng');
    var markText = sc >= 10 ? '○' : (sc > 0 ? '△' : '×');
    var correctTxt;
    if(q.type === 'fraction'){ var rc = fracReduce(q.num, q.den); correctTxt = (rc[0]<0?'−':'')+Math.abs(rc[0])+'/'+rc[1]; }
    else correctTxt = q.type === 'choice' ? q.choices[q.correct] : q.keywords.join(', ');
    var ua = mockUserAnswerText(i);
    var uaCls = sc >= 10 ? 'ua-ok' : 'ua-ng';
    html += '<div class="test-row"><div class="test-q"><span class="num">'+(i+1)+'</span><div style="flex:1">'+fracText(q.text)+'</div></div>' +
      '<div class="test-a"><span class="mark '+markCls+'">'+markText+'</span>' +
      '<div class="your-answer '+uaCls+'">あなたの回答: '+fracText(ua)+'</div>' +
      (sc < 10 ? '<div class="correct-answer show">正解: '+fracText(correctTxt)+'</div>' : '') +
      '</div></div>';
  }
  html += '</div>';

  var main = document.getElementById('main');
  main.innerHTML = html;
  document.getElementById('mockRetry').onclick = function(){ mockResetState(); mockRenderMain(); };
  document.getElementById('mockReview').onclick = function(){
    document.querySelector('.test-sheet:last-child').scrollIntoView({behavior:'smooth'});
  };
  if(canLevelUp){
    document.getElementById('mockLevelUp').onclick = function(){
      mockState.level = Math.min(mockState.level + 1, MOCK_LEVELS.length);
      mockResetState();
      mockRenderMain();
    };
  }
}

function mockStartTimer(){
  mockStopTimer();
  mockUpdateTimerDisplay();
  mockState.timerInterval = setInterval(function(){
    mockState.timeRemaining--;
    mockUpdateTimerDisplay();
    if(mockState.timeRemaining <= 0){ mockStopTimer(); mockSubmit(); }
  }, 1000);
}
function mockStopTimer(){
  if(mockState.timerInterval){ clearInterval(mockState.timerInterval); mockState.timerInterval = null; }
}
function mockUpdateTimerDisplay(){
  var el = document.getElementById('mockTimerDisplay');
  if(!el) return;
  var m = Math.floor(mockState.timeRemaining / 60), s = mockState.timeRemaining % 60;
  el.textContent = m + ':' + (s < 10 ? '0' : '') + s;
  el.classList.remove('warn','danger');
  if(mockState.timeRemaining <= 60) el.classList.add('danger');
  else if(mockState.timeRemaining <= 300) el.classList.add('warn');
}

function summaryRender(){
  summaryRenderSubjTabs();
  summaryRenderMain();
}

function summaryRenderSubjTabs(){
  var el = document.getElementById('subjTabs');
  var html = '';
  Object.keys(SUMMARY_DATA).forEach(function(k){
    var s = SUMMARY_DATA[k];
    var act = (k === summarySubj) ? 'active' : '';
    html += '<button class="subj-tab '+act+'" data-k="'+k+'"><span class="glyph">'+s.glyph+'</span>'+s.name+'</button>';
  });
  el.innerHTML = html;
  el.querySelectorAll('.subj-tab').forEach(function(b){
    b.onclick = function(){
      currentSubj = b.dataset.k;
      summarySubj = b.dataset.k;
      summaryRender();
    };
  });
}

function summaryRenderMain(){
  _rubyMode = (summarySubj === 'jp') ? 'jp' : 'std';
  var main = document.getElementById('main');
  var data = SUMMARY_DATA[summarySubj];
  var html = '<div class="summary-scroll">';
  for(var i=0; i<data.sections.length; i++){
    var sec = data.sections[i];
    html += '<div class="summary-section">';
    var _chHas = RHYTHM_DATA[summarySubj] && RHYTHM_DATA[summarySubj][sec.title];
    html += '<div class="summary-section-title"><span class="num">'+(i+1)+'</span>'+furigana(sec.title)+
      (_chHas ? '<button class="chant-btn" data-chant="'+escapeHtml(sec.title)+'">🎵 リズムで覚える</button>' : '')+'</div>';
    if(sec.table){
      html += '<table class="summary-table"><tr>';
      for(var h=0; h<sec.table.headers.length; h++){
        html += '<th>'+furigana(sec.table.headers[h])+'</th>';
      }
      html += '</tr>';
      for(var r=0; r<sec.table.rows.length; r++){
        html += '<tr>';
        for(var c=0; c<sec.table.rows[r].length; c++){
          html += '<td>'+furigana(sec.table.rows[r][c])+'</td>';
        }
        html += '</tr>';
      }
      html += '</table>';
    }
    if(sec.points){
      for(var p=0; p<sec.points.length; p++){
        html += '<div class="summary-point">'+furigana(sec.points[p])+'</div>';
      }
    }
    if(sec.audio && sec.audio.length){
      html += '<div class="audio-section">';
      for(var a=0; a<sec.audio.length; a++){
        html += '<button class="audio-chip" data-text="'+escapeHtml(sec.audio[a])+'">&#x1f50a; '+escapeHtml(sec.audio[a])+'</button>';
      }
      html += '</div>';
    }
    if(sec.practice && sec.practice.length){
      html += '<div class="summary-practice"><div class="summary-practice-title">確認クイズ</div>';
      for(var j=0; j<sec.practice.length; j++){
        var pr = sec.practice[j];
        var choices = summaryBuildChoices(data, i, pr.answer);
        html += '<div class="practice-row">';
        html += '<span class="practice-hint">'+fracText(pr.hint)+'</span>';
        html += '<div class="practice-choices" data-si="'+i+'" data-pi="'+j+'" data-answer="'+escapeHtml(pr.answer)+'">';
        for(var ci=0; ci<choices.length; ci++){
          html += '<button class="practice-choice" data-v="'+escapeHtml(choices[ci])+'">'+fracText(choices[ci])+'</button>';
        }
        html += '</div>';
        html += '<span class="practice-mark" id="pm-'+i+'-'+j+'"></span>';
        html += '</div>';
      }
      html += '</div>';
    }
    html += '</div>';
  }
  html += '</div>';
  main.innerHTML = html;

  main.querySelectorAll('.practice-choices').forEach(function(box){
    var mark = document.getElementById('pm-'+box.dataset.si+'-'+box.dataset.pi);
    box.querySelectorAll('.practice-choice').forEach(function(b){
      b.onclick = function(){
        var correct = box.dataset.answer;
        if(b.dataset.v === correct){
          box.querySelectorAll('.practice-choice').forEach(function(x){ x.disabled = true; x.classList.remove('wrong'); });
          b.classList.add('correct');
          if(mark){ mark.textContent = '✓'; mark.style.color = 'var(--ok)'; }
          var key = summarySubj+'-'+box.dataset.si+'-'+box.dataset.pi;
          if(!summaryEarned[key]){ summaryEarned[key] = true; earnYen(1); } // 正解 +1分
        } else {
          b.classList.add('wrong'); b.disabled = true;
          if(mark){ mark.textContent = '✗'; mark.style.color = 'var(--ng)'; }
        }
      };
    });
  });

  main.querySelectorAll('.audio-chip').forEach(function(btn){
    btn.onclick = function(){ speakEnglish(btn.dataset.text, btn); };
  });
  main.querySelectorAll('.chant-btn[data-chant]').forEach(function(btn){
    btn.onclick = function(){ openChantPlayer(summarySubj, btn.dataset.chant); };
  });
}

// 確認クイズの選択肢を作る（正解＋同セクション/同科目の他の答えをダミーに）
function summaryBuildChoices(data, secIdx, correct){
  var pool = [];
  var sec = data.sections[secIdx];
  if(sec.practice) sec.practice.forEach(function(p){ if(p.answer !== correct && pool.indexOf(p.answer) === -1) pool.push(p.answer); });
  if(pool.length < 3){
    data.sections.forEach(function(s){
      if(s.practice) s.practice.forEach(function(p){ if(p.answer !== correct && pool.indexOf(p.answer) === -1) pool.push(p.answer); });
    });
  }
  // pool をシャッフルして最大3つのダミー
  for(var i=pool.length-1;i>0;i--){ var k=Math.floor(Math.random()*(i+1)); var t=pool[i]; pool[i]=pool[k]; pool[k]=t; }
  var choices = pool.slice(0,3);
  choices.push(correct);
  // 全体をシャッフル
  for(var i=choices.length-1;i>0;i--){ var k=Math.floor(Math.random()*(i+1)); var t=choices[i]; choices[i]=choices[k]; choices[k]=t; }
  return choices;
}

function speakEnglish(text, btn){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  var utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.85;
  var voices = window.speechSynthesis.getVoices();
  for(var i=0; i<voices.length; i++){
    if(voices[i].lang.indexOf('en') === 0 && voices[i].name.indexOf('Female') !== -1){ utter.voice = voices[i]; break; }
    if(voices[i].lang.indexOf('en') === 0 && !utter.voice) utter.voice = voices[i];
  }
  if(btn){
    btn.classList.add('playing');
    utter.onend = function(){ btn.classList.remove('playing'); };
    utter.onerror = function(){ btn.classList.remove('playing'); };
  }
  window.speechSynthesis.speak(utter);
}

// メロディを「歌うように」鳴らす（やわらかい音色＋レガート＋軽いビブラート）
function _chantMelody(ac, freqs){
  if(!ac) return;
  var t=ac.currentTime+0.05;
  for(var i=0;i<freqs.length;i++){
    var d=(i===freqs.length-1)?0.95:0.5;
    var o=ac.createOscillator(), o2=ac.createOscillator(), g=ac.createGain(), vib=ac.createOscillator(), vg=ac.createGain();
    o.type='sine'; o2.type='triangle'; o.frequency.setValueAtTime(freqs[i],t); o2.frequency.setValueAtTime(freqs[i],t);
    vib.frequency.setValueAtTime(5.5,t); vg.gain.setValueAtTime(freqs[i]*0.006,t); vib.connect(vg); vg.connect(o.frequency); vg.connect(o2.frequency);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.22,t+0.05); g.gain.setValueAtTime(0.20,t+d-0.12); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); o2.connect(g); g.connect(ac.destination);
    o.start(t); o2.start(t); vib.start(t); o.stop(t+d); o2.stop(t+d); vib.stop(t+d);
    t += d*0.96; // ちょっと重ねてレガート
  }
}
function _chantSpeak(say, rate){
  if(!say || !window.speechSynthesis) return;
  try{ window.speechSynthesis.cancel(); }catch(e){}
  var u=new SpeechSynthesisUtterance(say); u.lang='en-US'; u.rate=rate||0.95; u.pitch=1.05;
  var vs=window.speechSynthesis.getVoices();
  for(var i=0;i<vs.length;i++){ if(vs[i].lang.indexOf('en')===0 && vs[i].name.indexOf('Female')!==-1){ u.voice=vs[i]; break; } if(vs[i].lang.indexOf('en')===0 && !u.voice) u.voice=vs[i]; }
  window.speechSynthesis.speak(u);
}
function openChantPlayer(subj, title){
  var chant = RHYTHM_DATA[subj] && RHYTHM_DATA[subj][title];

  var ov = document.createElement('div');
  ov.className = 'chant-overlay'; ov.id = 'chantOverlay';
  var rows = '';
  for(var i=0;i<chant.items.length;i++){

    row.onclick = function(){ playChantOne(parseInt(row.dataset.i,10)); };
  });
}
function playChantOne(i){
  var it = _chant.items[i]; if(!it) return;
  try{ _chant.ac = _chant.ac || new (window.AudioContext||window.webkitAudioContext)(); if(_chant.ac.state==='suspended') _chant.ac.resume(); }catch(e){ _chant.ac=null; }
  document.querySelectorAll('#chantRows .chant-row').forEach(function(el){ el.classList.remove('active'); });
  var row = document.querySelector('#chantRows .chant-row[data-i="'+i+'"]'); if(row) row.classList.add('active');
  if(_chant.melody && _chant.ac){ _chantMelody(_chant.ac, _chant.melody); _chantSpeak(it.en, 0.9); }
  else { _chantSpeak(it.en, 0.95); }
}
function closeChantPlayer(){
  try{ window.speechSynthesis.cancel(); }catch(e){}

}

var cardState = {
  subj: 'en',
  deck: 0,
  idx: 0,
  flipped: false,
  mastered: {},
  missed: {}
};

// 現在の科目のデッキ一覧（decks があればそれ、なければ cards を単一デッキ扱い）
function cardDecks(){
  var s = CARD_DATA[cardState.subj];
  if(s.decks) return s.decks;
  return [{key:'main', name:s.name, cards:s.cards}];
}
function cardCurrentDeck(){
  var decks = cardDecks();
  return decks[cardState.deck] || decks[0];
}
function cardCurrentCards(){ return cardCurrentDeck().cards; }
// 進捗キーの接頭辞（科目+デッキで独立管理）
function cardPrefix(){ return cardState.subj + '/' + cardCurrentDeck().key; }

function cardRender(){
  cardRenderSubjTabs();
  cardRenderMain();
  cardUpdateStats();
}

function cardRenderSubjTabs(){
  var el = document.getElementById('subjTabs');
  var html = '';
  Object.keys(CARD_DATA).forEach(function(k){
    var s = CARD_DATA[k];
    var act = (k === cardState.subj) ? 'active' : '';
    html += '<button class="subj-tab '+act+'" data-k="'+k+'"><span class="glyph">'+s.glyph+'</span>'+s.name+'</button>';
  });
  el.innerHTML = html;
  el.querySelectorAll('.subj-tab').forEach(function(b){
    b.onclick = function(){
      currentSubj = b.dataset.k;
      cardState.subj = b.dataset.k;
      cardState.deck = 0;
      cardState.idx = 0;
      cardState.flipped = false;
      cardRender();
    };
  });
}

function cardRenderMain(){
  _rubyMode = (cardState.subj === 'jp') ? 'jp' : 'std';
  var main = document.getElementById('main');
  var prefix = cardPrefix();
  var cards = cardCurrentCards();
  var total = cards.length;
  var masteredCount = 0;
  for(var i=0;i<total;i++) if(cardState.mastered[prefix+'-'+i]) masteredCount++;

  var html = '';

  // デッキ切替（複数デッキがある科目のみ）
  var decks = cardDecks();
  if(decks.length > 1){
    html += '<div class="card-deck-bar">';
    for(var d=0; d<decks.length; d++){
      var dact = (d === cardState.deck) ? ' active' : '';
      html += '<button class="card-deck-btn'+dact+'" data-d="'+d+'">'+escapeHtml(decks[d].name)+'</button>';
    }
    html += '</div>';
  }

  if(masteredCount === total){
    main.innerHTML = html + cardCompleteHtml();
    bindDeckBar(main);
    document.getElementById('cardReset').onclick = function(){
      var m = 0;
      for(var i=0;i<cards.length;i++){ if(cardState.mastered[prefix+'-'+i]) m++; }
      if(m > 0) loseGameTime(m); // やり直す → 覚えて得た時間を返納
      for(var i=0;i<cards.length;i++){ delete cardState.mastered[prefix+'-'+i]; delete cardState.missed[prefix+'-'+i]; }
      cardState.idx = 0; cardState.flipped = false; cardRender();
    };
    document.getElementById('cardToLearn').onclick = function(){ switchMode('learn'); };
    cardUpdateStats();
    // 勉強順ナビ中: デッキ完了 → 自動で次（テスト）へ
    if(guide.active && currentMode === 'cards'){
      var gci = guideCurrentIndex();
      if(gci > -1 && gci < GUIDE_ORDER.length - 1){
        setTimeout(function(){
          if(guide.active && currentMode === 'cards') switchMode(GUIDE_ORDER[gci+1].mode);
        }, 1600);
      }
    }
    return;
  }

  var card = cards[cardState.idx];
  var deckMeta = cardCurrentDeck();
  html += '<div class="card-area">';

  html += '<div class="card-progress-bar">';
  for(var i=0;i<total;i++){
    var cls = 'dot';
    if(i === cardState.idx) cls += ' current';
    else if(cardState.mastered[prefix+'-'+i]) cls += ' mastered';
    else if(cardState.missed[prefix+'-'+i]) cls += ' missed';
    html += '<span class="'+cls+'" data-i="'+i+'"></span>';
  }
  html += '</div>';

  html += '<div class="card-category">'+escapeHtml(card.cat)+'</div>';

  // 英単語デッキ等は表面に音声ボタンを出す
  var audioBtn = deckMeta.audioFront ? '<button class="audio-btn" id="cardAudio" data-audio="'+escapeHtml(card.front)+'" style="margin-top:10px">&#x1f50a; 発音</button>' : '';

  html += '<div class="flashcard'+(cardState.flipped?' flipped':'')+'" id="flashcard">';
  html += '<div class="flashcard-inner">';
  html += '<div class="flashcard-face flashcard-front"><div class="label">QUESTION</div><div class="content">'+fracText(card.front)+'</div><div class="sub">タップ または → で答え</div></div>';
  html += '<div class="flashcard-face flashcard-back"><div class="label">ANSWER</div><div class="content">'+fracText(card.back)+'</div></div>';
  html += '</div></div>';
  html += audioBtn;

  if(cardState.flipped){
    html += '<div class="card-controls">';
    html += '<button class="btn" id="cardMiss" style="border-color:var(--ng);color:var(--ng)">もう一回 ✕</button>';
    html += '<button class="btn primary" id="cardOk" style="background:var(--ok);border-color:var(--ok)">覚えた ○</button>';
    html += '</div>';
  }

  html += '<div class="card-nav">';
  html += '<button class="btn" id="cardPrev">←</button>';
  html += '<span class="card-counter">'+(cardState.idx+1)+' / '+total+'</span>';
  html += '<button class="btn" id="cardNext">→</button>';
  html += '</div>';

  html += '</div>';
  main.innerHTML = html;

  bindDeckBar(main);

  document.getElementById('flashcard').onclick = function(){
    cardState.flipped = !cardState.flipped;
    cardRenderMain();
  };

  var au = document.getElementById('cardAudio');
  if(au) au.onclick = function(e){ e.stopPropagation(); speakEnglish(au.dataset.audio, au); };

  // ← : 答え表示中なら問題に戻る / 問題表示中なら前のカードの問題へ
  document.getElementById('cardPrev').onclick = function(){
    if(cardState.flipped){ cardState.flipped = false; cardRenderMain(); }
    else if(cardState.idx > 0){ cardState.idx--; cardState.flipped = false; cardRenderMain(); }
  };
  // → : 問題表示中なら答えをめくる / 答え表示中なら次のカードの問題へ（問題→答え→次の問題のリズム）
  document.getElementById('cardNext').onclick = function(){
    if(!cardState.flipped){ cardState.flipped = true; cardRenderMain(); }
    else if(cardState.idx < total-1){ cardState.idx++; cardState.flipped = false; cardRenderMain(); }
  };

  if(cardState.flipped){
    document.getElementById('cardOk').onclick = function(){
      var wasMastered = cardState.mastered[prefix+'-'+cardState.idx];
      cardState.mastered[prefix+'-'+cardState.idx] = true;
      delete cardState.missed[prefix+'-'+cardState.idx];
      if(!wasMastered) earnYen(1); // はじめて覚えた +1分
      cardAdvance();
    };
    document.getElementById('cardMiss').onclick = function(){
      cardState.missed[prefix+'-'+cardState.idx] = true;
      delete cardState.mastered[prefix+'-'+cardState.idx];
      cardState.flipped = false;   // 同じカードのまま問題に戻る（次に進まない）
      cardRenderMain();
      cardUpdateStats();
    };
  }

  main.querySelectorAll('.card-progress-bar .dot').forEach(function(d){
    d.onclick = function(e){
      e.stopPropagation();
      cardState.idx = parseInt(d.dataset.i, 10);
      cardState.flipped = false;
      cardRenderMain();
    };
  });
}

function bindDeckBar(main){
  main.querySelectorAll('.card-deck-btn').forEach(function(b){
    b.onclick = function(){
      cardState.deck = parseInt(b.dataset.d, 10);
      cardState.idx = 0;
      cardState.flipped = false;
      cardRender();
    };
  });
}

function cardAdvance(){
  var prefix = cardPrefix();
  var cards = cardCurrentCards();
  var next = -1;
  for(var i=cardState.idx+1; i<cards.length; i++){
    if(!cardState.mastered[prefix+'-'+i]){ next = i; break; }
  }
  if(next === -1){
    for(var i=0; i<cardState.idx; i++){
      if(!cardState.mastered[prefix+'-'+i]){ next = i; break; }
    }
  }
  cardState.idx = (next === -1) ? 0 : next;
  cardState.flipped = false;
  cardRenderMain();
  cardUpdateStats();
}

function cardUpdateStats(){
  var prefix = cardPrefix();
  var cards = cardCurrentCards();
  var m = 0;
  for(var i=0;i<cards.length;i++) if(cardState.mastered[prefix+'-'+i]) m++;
  var mEl = document.getElementById('cardMastered');
  var rEl = document.getElementById('cardRemain');
  if(mEl) mEl.textContent = m;
  if(rEl) rEl.textContent = cards.length - m;
}

function cardCompleteHtml(){
  var cards = cardCurrentCards();
  return '<div class="card-result">'+
    '<h2>全カード完了！</h2>'+
    '<div class="score">'+cards.length+' / '+cards.length+'</div>'+
    '<div class="msg">'+escapeHtml(CARD_DATA[cardState.subj].name+'「'+cardCurrentDeck().name+'」')+'のカードをすべて覚えました。</div>'+
    '<div class="actions" style="justify-content:center;gap:8px">'+
    '<button class="btn" id="cardReset">リセットしてやり直す</button>'+
    '<button class="btn primary" id="cardToLearn">LEARNに戻る</button>'+
    '</div></div>';
}

// ============ 手書き入力パッド ============
var hwTarget = null;     // 入力先 input
var hwLang = 'ja';
var hwStrokes = [];      // [[xs],[ys],[ts]] の配列
var hwCurStroke = null;
var hwDrawing = false;
var hwCtx = null;
var hwRecognizeTimer = null;

function hwInit(){
  var canvas = document.getElementById('hwCanvas');
  if(!canvas) return;
  hwCtx = canvas.getContext('2d');

  function pos(e){
    var rect = canvas.getBoundingClientRect();
    var src = e.touches && e.touches[0] ? e.touches[0] : e;
    var x = (src.clientX - rect.left) * (canvas.width / rect.width);
    var y = (src.clientY - rect.top) * (canvas.height / rect.height);
    return [x, y];
  }
  function start(e){
    e.preventDefault();
    hwDrawing = true;
    var p = pos(e);
    hwCurStroke = [[p[0]],[p[1]],[Date.now()]];
    hwCtx.beginPath();
    hwCtx.moveTo(p[0], p[1]);
  }
  function move(e){
    if(!hwDrawing) return;
    e.preventDefault();
    var p = pos(e);
    hwCurStroke[0].push(p[0]); hwCurStroke[1].push(p[1]); hwCurStroke[2].push(Date.now());
    hwCtx.lineWidth = 5; hwCtx.lineCap = 'round'; hwCtx.lineJoin = 'round';
    hwCtx.strokeStyle = '#1a1a1a';
    hwCtx.lineTo(p[0], p[1]);
    hwCtx.stroke();
  }
  function end(e){
    if(!hwDrawing) return;
    hwDrawing = false;
    if(hwCurStroke && hwCurStroke[0].length > 0) hwStrokes.push(hwCurStroke);
    hwCurStroke = null;
    clearTimeout(hwRecognizeTimer);
    hwRecognizeTimer = setTimeout(hwRecognize, 350);
  }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);

  document.getElementById('hwClose').onclick = closeHandwriting;
  document.getElementById('hwClear').onclick = hwClearCanvas;
  document.getElementById('hwDone').onclick = closeHandwriting;
  document.getElementById('hwBack').onclick = function(){
    if(hwTarget && hwTarget.value.length > 0){
      hwTarget.value = hwTarget.value.slice(0, -1);
      hwTarget.dispatchEvent(new Event('input'));
      hwUpdatePreview();
    }
  };
  document.getElementById('hwOverlay').addEventListener('click', function(e){
    if(e.target.id === 'hwOverlay') closeHandwriting();
  });
}

function openHandwriting(input, lang){
  if(!input) return;
  hwTarget = input;
  hwLang = lang || 'ja';
  var overlay = document.getElementById('hwOverlay');
  overlay.classList.add('show');
  hwClearCanvas();
  hwUpdatePreview();
}
function closeHandwriting(){
  document.getElementById('hwOverlay').classList.remove('show');
  if(hwTarget){ try{ hwTarget.focus(); }catch(e){} }
  hwTarget = null;
}
function hwClearCanvas(){
  hwStrokes = [];
  hwCurStroke = null;
  var canvas = document.getElementById('hwCanvas');
  if(hwCtx) hwCtx.clearRect(0,0,canvas.width,canvas.height);
  document.getElementById('hwCandidates').innerHTML = '';
}
function hwUpdatePreview(){
  var p = document.getElementById('hwPreview');
  if(p) p.textContent = hwTarget ? hwTarget.value : '';
}
function hwShowCandidates(list){
  var el = document.getElementById('hwCandidates');
  if(!list || !list.length){ el.innerHTML = ''; return; }
  var html = '';
  for(var i=0; i<list.length && i<12; i++){
    html += '<button class="hw-cand" data-c="'+escapeHtml(list[i])+'">'+escapeHtml(list[i])+'</button>';
  }
  el.innerHTML = html;
  el.querySelectorAll('.hw-cand').forEach(function(b){
    b.onclick = function(){
      if(hwTarget){
        hwTarget.value += b.dataset.c;
        hwTarget.dispatchEvent(new Event('input'));
        hwUpdatePreview();
      }
      hwClearCanvas(); // 次の字へ
    };
  });
}
function hwRecognize(){
  if(!hwStrokes.length){ hwShowCandidates([]); return; }
  var canvas = document.getElementById('hwCanvas');
  var el = document.getElementById('hwCandidates');
  el.innerHTML = '<span class="hw-cand loading">認識中...</span>';
  var itc = (hwLang === 'en') ? 'en-t-i0-handwrit' : 'ja-t-i0-handwrit';
  var body = {
    options: 'enable_pre_space',
    requests: [{
      writing_guide: { writing_area_width: canvas.width, writing_area_height: canvas.height },
      ink: hwStrokes,
      language: hwLang
    }]
  };
  fetch('https://inputtools.google.com/request?itc='+itc+'&app=cignallearn', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  }).then(function(r){ return r.json(); }).then(function(data){
    if(data && data[0] === 'SUCCESS' && data[1] && data[1][0] && data[1][0][1]){
      hwShowCandidates(data[1][0][1]);
    } else { hwShowCandidates([]); }
  }).catch(function(){
    el.innerHTML = '<span class="hw-cand loading">認識できませんでした（通信エラー）</span>';
  });
}

// ============ ゲーム時間メーター ============
var GAMETIME_KEY = 'cignal_learn_gametime';
var gameTime = 0; // 累計（分）

function fmtGameTime(m){
  if(m < 60) return m + '分';
  var h = Math.floor(m / 60), mm = m % 60;
  return mm === 0 ? h + '時間' : h + '時間' + mm + '分';
}
function loadAllowance(){
  try { gameTime = parseInt(localStorage.getItem(GAMETIME_KEY) || '0', 10) || 0; } catch(e){ gameTime = 0; }
  updateCoinMeter();
}
function saveAllowance(){
  try { localStorage.setItem(GAMETIME_KEY, String(gameTime)); } catch(e){}
}
function updateCoinMeter(){
  var el = document.getElementById('coinAmount');
  if(el) el.textContent = fmtGameTime(gameTime);
}

// 達成するとゲーム時間を mins 分追加。弾み + 「+N分」フロート + 効果音
function earnYen(mins){
  if(!mins || mins <= 0) return;
  var before = gameTime;
  gameTime += mins;
  saveAllowance();
  var meter = document.getElementById('coinMeter');
  var amt = document.getElementById('coinAmount');
  if(amt) amt.textContent = fmtGameTime(gameTime);
  if(meter){
    meter.classList.remove('pop'); void meter.offsetWidth; meter.classList.add('pop');
    var f = document.createElement('span');
    f.className = 'coin-float';
    f.textContent = '+' + mins + '分';
    meter.appendChild(f);
    setTimeout(function(){ if(f.parentNode) f.remove(); }, 1000);
  }
  playCoinSound(mins);
  // 30分ごとの達成演出
  if(Math.floor(before/30) !== Math.floor(gameTime/30)){
    showCoinMilestone(Math.floor(gameTime/30)*30);
  }
}

// リセット・やり直しでゲーム時間を減らす（最低0分）。赤い「-N分」フロート
function loseGameTime(mins){
  if(!mins || mins <= 0) return;
  var actual = Math.min(mins, gameTime);
  if(actual <= 0) return;
  gameTime -= actual;
  saveAllowance();
  var meter = document.getElementById('coinMeter');
  var amt = document.getElementById('coinAmount');
  if(amt) amt.textContent = fmtGameTime(gameTime);
  if(meter){
    meter.classList.remove('pop'); void meter.offsetWidth; meter.classList.add('pop');
    var f = document.createElement('span');
    f.className = 'coin-float lose';
    f.textContent = '-' + actual + '分';
    meter.appendChild(f);
    setTimeout(function(){ if(f.parentNode) f.remove(); }, 1000);
  }
}

function showCoinMilestone(mins){
  var t = document.createElement('div');
  t.className = 'coin-milestone';
  t.textContent = '🎮 ゲーム時間 ' + fmtGameTime(mins) + ' 達成！';
  document.body.appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.remove(); }, 1800);
}

function playCoinSound(amount){
  try {
    var ctx = window._coinCtx || (window._coinCtx = new (window.AudioContext||window.webkitAudioContext)());
    if(ctx.state === 'suspended') ctx.resume();
    var o = ctx.createOscillator(); var g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'triangle';
    o.frequency.setValueAtTime(988, ctx.currentTime);
    o.frequency.setValueAtTime(1319, ctx.currentTime + 0.07);
    g.gain.setValueAtTime(0.07, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.18);
    o.start(); o.stop(ctx.currentTime + 0.18);
  } catch(e){}
}

// ゲーム時間をリセット（メーターをクリック → 確認して0分に）
function resetGameTime(){
  if(gameTime <= 0){ alert('ゲーム時間はすでに0分です'); return; }
  if(confirm('ゲーム時間を 0分 にリセットしますか？\n（今の ' + fmtGameTime(gameTime) + ' は消えます）')){
    gameTime = 0;
    saveAllowance();
    updateCoinMeter();
  }
}
(function bindCoinReset(){
  var meter = document.getElementById('coinMeter');
  if(meter){
    meter.style.cursor = 'pointer';
    meter.title = 'クリックでゲーム時間をリセット';
    meter.onclick = resetGameTime;
  }
})();

// ============ 1年のロードマップ（テスト時期） ============
// 2学期制（前期4–9月 / 後期10–3月）。毎日1時間は各時期の中の「ホーム」に内包する
var ROADMAP = [
  {key:'mae_mid', name:'前期中間', month:'6月',     ready:true,  type:'exam'},
  {key:'mae_fin', name:'前期期末', month:'9月',     ready:true,  type:'exam'},
  {key:'ato_mid', name:'後期中間', month:'11–12月', ready:false, type:'exam'},
  {key:'ato_fin', name:'学年末',   month:'2–3月',   ready:false, type:'exam'}
];
var currentPhase = 'mae_fin'; // 前期中間のあと→前期期末(9月)に向けて毎日つみあげ中

function renderRoadmap(){
  var el = document.getElementById('roadmap');
  if(!el) return;
  var html = '<span class="rm-title">📅 1年ロードマップ</span>';
  for(var i=0; i<ROADMAP.length; i++){
    var p = ROADMAP[i];
    var cls = 'rm-step' + (p.type === 'daily' ? ' daily' : '') + (p.key === currentPhase ? ' current' : '') + (!p.ready ? ' locked' : '');
    var icon = p.type === 'daily' ? '🗓 ' : '';
    html += '<button class="'+cls+'" data-phase="'+p.key+'"><span class="rm-name">'+icon+p.name+'</span><span class="rm-month">'+p.month+'</span></button>';
    if(i < ROADMAP.length-1) html += '<span class="rm-arrow">›</span>';
  }
  el.innerHTML = html;
  el.querySelectorAll('.rm-step').forEach(function(b){
    b.onclick = function(){
      var key = b.dataset.phase;
      var p = ROADMAP.filter(function(x){ return x.key === key; })[0];
      if(!p.ready){
        var label = p.type === 'daily' ? ('「'+p.month+' 毎日1時間」コース') : ('「中1 '+p.name+'」版');
        rmToast(label + 'は準備中です。これから一緒に作ろう！');
        return;
      }
      currentPhase = key;
      renderRoadmap();
      applyPhase(p);
    };
  });
}
function rmToast(msg){
  var t = document.createElement('div');
  t.className = 'rm-toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.remove(); }, 2400);
}

function qMatchesUnit(q, u){
  var kws = q.keywords || [];
  var hay = (q.text||'') + '|' + ((q.choices||[]).join('|')) + '|' + (q.audio||'');
  return u.kw.some(function(k){ return (kws.indexOf(k) !== -1) || (hay.indexOf(k) !== -1); });
}
// 選んだ単元にマッチする問題で②今日の復習を作る（科目ごと最大10問）
function buildReviewItemsForUnits(sel){
  var items = [];
  DAILY_SUBJS.forEach(function(subj){
    var units = (DAILY_UNITS[subj]||[]).filter(function(u){ return sel[subj+'/'+u.id]; });
    if(!units.length) return;
    var seen = {}, picked = [];
    (TEST_DATA[subj].sets||[]).forEach(function(s){ if(!s) return; s.questions.forEach(function(q){
      if(seen[q.text]) return;
      if(units.some(function(u){ return qMatchesUnit(q, u); })){ seen[q.text]=1; picked.push({subj:subj, q:q}); }
    }); });
    items = items.concat(picked.slice(0, 10));
  });
  return items;
}

function buildDayPreview(day){
  var topicIdx = (day-1) % 3; // 3単元を1日ずつ進める
  return DAILY_SUBJS.map(function(subj){ return { subj:subj, topic: PREVIEW_DATA[subj][topicIdx] }; });
}

function loadDaily(){ try{ dailyDone = JSON.parse(localStorage.getItem(DAILY_KEY) || '{}'); }catch(e){ dailyDone = {}; } }
function saveDaily(){ try{ localStorage.setItem(DAILY_KEY, JSON.stringify(dailyDone)); }catch(e){} }
function dayKey(dt){ return dt.getFullYear()+'-'+('0'+(dt.getMonth()+1)).slice(-2)+'-'+('0'+dt.getDate()).slice(-2); }
function dailyStreak(){
  var n = 0, d = new Date();
  while(dailyDone[dayKey(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}
// 何日目か = これまでの完了日数+1（順番に進む）
function dailyProgramDay(){ return Object.keys(dailyDone).filter(function(k){ return dailyDone[k]; }).length + 1; }
// 進行に合わせて出題範囲を広げる（基礎→標準→応用→総合）
function dailyTierLabel(day){
  if(day<=5) return '基礎';
  if(day<=12) return '標準';
  if(day<=20) return '応用';
  return '総合（全範囲）';
}
function dailyTierSets(day){
  if(day<=5) return [0,1];
  if(day<=12) return [1,2,3];
  if(day<=20) return [2,3,4];
  return [0,1,2,3,4,5,6];
}
// その日の5教科ミックス問題を作る
function buildDayItems(day){
  var sets = dailyTierSets(day);
  var items = [];
  DAILY_SUBJS.forEach(function(subj, si){
    var examPool = [], tierPool = [];
    (TEST_DATA[subj].sets||[]).forEach(function(s, idx){
      if(!s) return;
      if(s.exam){ s.questions.forEach(function(q){ examPool.push(q); }); }        // 期末範囲（中間後に追加した新単元）
      else if(sets.indexOf(idx)>=0){ s.questions.forEach(function(q){ tierPool.push(q); }); } // 中間の復習（つみあげ）
    });
    var n = DAILY_WEIGHTS[subj] || 5;
    var picked;
    if(examPool.length){
      // 期末範囲があれば6割を期末、残りは中間の復習。無い科目は中間だけ（＝追加されなければ復習）
      var nExam = Math.min(examPool.length, Math.max(1, Math.ceil(n*0.6)));
      var e = mockSeededShuffle(examPool, day*13 + si + 1).slice(0, nExam);
      var t = mockSeededShuffle(tierPool, day*11 + si + 1).slice(0, Math.max(0, n - e.length));
      picked = e.concat(t);
    } else {
      picked = mockSeededShuffle(tierPool, day*11 + si + 1).slice(0, n);
    }
    picked.forEach(function(q){ items.push({ subj:subj, q:q }); });
  });
  return items;
}

// ===== ① 過去の復習＝タイムアタック：中間～昨日までに積み上げた範囲（累積） =====
var TA_SECONDS = 5*60; // 5分
// 何セット目まで＝中間(set0)から日が進むほど累積で広げる
function pastMaxSet(day){
  if(day<=2)  return 1; // 中間範囲（基礎2セット）
  if(day<=6)  return 2;
  if(day<=11) return 3;
  return 6;             // 全範囲（英語の追加セットも含む。不足セットは自動スキップ）
}
function buildTimeAttackPool(day){
  var pool=[];
  var maxSet = pastMaxSet(day); // set 0..maxSet を累積で（中間～昨日まで）
  DAILY_SUBJS.forEach(function(subj){
    (TEST_DATA[subj].sets||[]).forEach(function(s, si){
      if(!s) return;
      if(!s.exam && si>maxSet) return; // 中間はtier範囲まで、期末(exam)は常に累積に含める
      s.questions.forEach(function(q){ if(q.choices && q.type!=='listening' && q.type!=='fraction') pool.push({subj:subj, q:q}); });
    });
  });
  return mockSeededShuffle(pool, day*7+3);
}
function fmtMMSS(sec){ var m=Math.floor(sec/60), s=sec%60; return m+':'+('0'+s).slice(-2); }

// 数学用：分数(a/2, y/3, 3/4 など)を縦組み表示にする
function mathFrac(s){
  var out = escapeHtml(s).replace(/([0-9A-Za-z]+)\s*\/\s*([0-9A-Za-z]+)/g,
    '<span class="ifrac"><span class="ifn">$1</span><span class="ifd">$2</span></span>');
  return furigana(out);
}

function renderDaily(){
  if(dailyState.phase === 'gate') renderDailyGate();
  else if(dailyState.phase === 'ta') renderDailyTimeAttack();
  else if(dailyState.phase === 'rangepick') renderReviewRange();
  else if(dailyState.phase === 'review') renderDailyReview();
  else if(dailyState.phase === 'preview') renderDailyPreview();
  else renderDailyCalendar();
}

function renderDailyCalendar(){

  for(var d=1; d<=daysInMonth; d++){
    var dt = new Date(y, m, d);
    var k = dayKey(dt);
    var cls = 'cal-cell';
    if(dailyDone[k]) cls += ' done';
    if(k === EXAM_DATE && !dailyDone[k]) cls += ' exam-day';
    if(k === DAILY_START && !dailyDone[k]) cls += ' start-day';
    if(k === todayKey) cls += ' today';

    var badge = (k===EXAM_DATE) ? '<span class="cal-badge exam">中間</span>'

    html += '<div class="'+cls+'"><span class="cal-d">'+d+'</span>'+badge+(dailyDone[k]?'<span class="cal-check">✓</span>':'')+'</div>';
  }
  html += '</div>';      // .cal-grid
  html += '</div>';      // .cal-box

  var menuLine, subLine, btnLabel = '▶ 本日の学習を始める', canStart = true;
  if(doneToday){
    menuLine = '今日はおつかれさま！'; subLine = 'また明日つづきをやろう。'; canStart = false;
  } else if(todayKey < EXAM_DATE){
    menuLine = '中間試験まで あと'+daysBetween(todayKey, EXAM_DATE)+'日';
    subLine = '毎日1時間コースは <b>6/5</b>（試験のあと）スタート。今日は中間対策をがんばろう！下のボタンで先取り体験もできるよ。';
    btnLabel = '▶ 先取りでやってみる';
  } else if(todayKey === EXAM_DATE){
    menuLine = '今日は中間試験！💪';
    subLine = '全力を出してきてね。毎日1時間コースは明日 <b>6/5</b> スタート。';
    btnLabel = '▶ 先取りでやってみる';
  } else {
    menuLine = 'Day '+pDay+'：今日の1時間（'+dailyTierLabel(pDay)+'）';
    subLine = '① 過去の復習＝中間〜昨日までを5分タイムアタック → ② 今日の復習（全問正解で次へ）→ ③ 予習（次の単元を先取り）';
  }
  html += '<div class="daily-today"><div class="dt-date">'+todayKey+'（'+wds[today.getDay()]+'）</div>'+
    '<div class="dt-menu">'+menuLine+'</div>'+
    '<div class="dt-sub">'+subLine+'</div>'+
    (canStart
      ? '<button class="daily-done-btn" id="dailyStartBtn">'+btnLabel+'</button>'+
        '<div class="daily-flow"><span>① 過去の復習</span><i>›</i><span>② 今日の復習</span><i>›</i><span>③ 予習</span></div>'
      : '<button class="daily-done-btn completed">✓ 本日完了ずみ！</button>') +
    '</div></div>';

  main.innerHTML = html;

  document.getElementById('calPrev').onclick = function(){ dailyViewMonth = new Date(y, m-1, 1); renderDailyCalendar(); };
  document.getElementById('calNext').onclick = function(){ dailyViewMonth = new Date(y, m+1, 1); renderDailyCalendar(); };
  var sb = document.getElementById('dailyStartBtn');
  if(sb) sb.onclick = function(){
    dailyState.day = pDay;
    dailyState.gate = { step:1, hasHW:null, memo:'', deadline:'', done:false };
    dailyState.phase = 'gate';
    renderDaily();
  };
}

}

var SUBJ_NAME = {en:'英語', math:'数学', jp:'国語', sci:'理科', soc:'社会'};
// ===== ① 5分タイムアタック（過去問スピード・問題一覧形式） =====
function renderDailyTimeAttack(){
  var main = document.getElementById('main');
  var ta = dailyState.ta;
  if(!ta || !ta.pool.length){ endTimeAttack(); return; }
  if(!ta.answers) ta.answers = {};
  if(ta.endAt === 0) ta.endAt = Date.now() + TA_SECONDS*1000;
  var KANA = ['ア','イ','ウ','エ','オ','カ'];
  var html = '<div class="daily-wrap">';
  html += '<div class="ta-bar"><div class="ta-title">① 過去の復習<em>中間〜昨日まで・5分タイムアタック</em></div>'+
    '<div class="ta-bar-right"><span class="ta-count" id="taCount">答えた '+Object.keys(ta.answers).length+'/'+ta.pool.length+'</span>'+
    '<div class="ta-timer" id="taTimer">5:00</div></div></div>';
  html += '<div class="ta-sub" style="margin-bottom:8px">中間〜昨日までに習った範囲から出題。5分で できるだけ多く解こう！（まちがえても止まらず進める）</div>';
  html += '<div class="test-sheet">';
  var lastSubj = null;
  for(var i=0;i<ta.pool.length;i++){
    var item = ta.pool[i], q = item.q;
    if(item.subj !== lastSubj){ html += '<div class="exam-daimon-head" style="margin:14px 0 8px">'+SUBJ_NAME[item.subj]+'</div>'; lastSubj = item.subj; }
    _rubyMode = (item.subj==='jp') ? 'jp' : 'std';
    html += '<div class="test-row"><div class="test-q"><span class="num">'+(i+1)+'</span><div style="flex:1;min-width:0">'+fracText(q.text)+'</div></div>';
    html += '<div class="test-a"><div class="choice-row">';
    for(var c=0;c<q.choices.length;c++){ var sel=(ta.answers[i]===c)?' sel':''; html += '<button class="choice-pill'+sel+'" data-tac="'+i+'" data-c="'+c+'"><span class="kana">'+KANA[c]+'</span>'+fracText(q.choices[c])+'</button>'; }
    html += '</div></div></div>';
  }
  _rubyMode = 'std';
  html += '</div><div class="actions" style="justify-content:center;margin-top:14px"><button class="btn primary" id="taFinish">採点して復習へ →</button></div></div>';
  main.innerHTML = html;
  main.querySelectorAll('.choice-pill[data-tac]').forEach(function(b){
    b.onclick = function(){
      var qi = parseInt(b.dataset.tac,10);
      ta.answers[qi] = parseInt(b.dataset.c,10);
      var box = b.closest('.choice-row'); box.querySelectorAll('.choice-pill').forEach(function(p){ p.classList.remove('sel'); });
      b.classList.add('sel');
      var cnt = document.getElementById('taCount'); if(cnt) cnt.textContent = '答えた '+Object.keys(ta.answers).length+'/'+ta.pool.length;
    };
  });
  document.getElementById('taFinish').onclick = function(){ endTimeAttack(); };
  if(ta.timer) clearInterval(ta.timer);
  ta.timer = setInterval(function(){
    var tEl = document.getElementById('taTimer');
    if(!tEl || dailyState.phase !== 'ta'){ clearInterval(ta.timer); ta.timer=null; return; }
    var remMs = ta.endAt - Date.now();
    if(remMs <= 0){ tEl.textContent='0:00'; endTimeAttack(); return; }
    var sec = Math.ceil(remMs/1000);
    tEl.textContent = fmtMMSS(sec);
    tEl.classList.toggle('urgent', sec<=30);
  }, 250);
}
function endTimeAttack(){
  var ta = dailyState.ta || {pool:[], answers:{}};
  if(ta.timer){ clearInterval(ta.timer); ta.timer = null; }
  var solved=0, correct=0;
  (ta.pool||[]).forEach(function(item,i){ var a = ta.answers ? ta.answers[i] : undefined; if(a!==undefined){ solved++; if(a===item.q.correct) correct++; } });
  ta.solved = solved; ta.correct = correct;
  var main = document.getElementById('main');
  main.innerHTML = '<div class="daily-wrap"><div class="result"><h2>⏱ ① 過去の復習 おわり！</h2>'+
    '<div class="score">'+solved+' 問</div>'+
    '<div class="msg" style="line-height:2">5分で <b>'+solved+'問</b> 解いた！（正解 '+correct+'）<br>つぎは「② 今日の復習」。<b>全問正解</b>できたら予習に進めるよ。</div>'+
    '<div class="actions" style="justify-content:center"><button class="btn primary" id="taToReview">② 今日の復習へ →</button></div></div></div>';
  document.getElementById('taToReview').onclick = function(){ dailyState.phase='rangepick'; renderReviewRange(); };
}

// ===== ② 今日の復習（表示は従来どおり・全問正解で予習へ） =====
function renderDailyReview(){
  var main = document.getElementById('main');
  var items = dailyState.items, KANA = ['ア','イ','ウ','エ','オ','カ'];
  var checked = dailyState.reviewChecked;
  var allCorrect = items.length>0 && items.every(function(it,i){ return (dailyState.scores[i]||0) >= 10; });
  var wrongCount = 0; for(var w=0; w<items.length; w++){ if((dailyState.scores[w]||0) < 10) wrongCount++; }

  var html = '<div class="daily-wrap"><div class="daily-head"><div class="daily-title">Day '+dailyState.day+'<em>② 今日の復習：全問正解で予習へ</em></div></div>';
  if(checked){
    html += allCorrect
      ? '<div class="daily-banner ok">🎉 全問正解！予習に進もう</div>'
      : '<div class="daily-banner ng">まちがいが '+wrongCount+'問。直して「答え合わせ」！（正解した問題は ○ で固定されるよ）</div>';
  } else {
    html += '<div class="dt-sub" style="margin-bottom:10px;color:var(--muted);font-size:12px">5教科を解いて「答え合わせ」。まちがえた問題は正解できるまで直そう。全部○で予習へ（目安40分）。</div>';
  }
  html += '<div class="test-sheet">';
  var lastSubj = null;
  for(var i=0; i<items.length; i++){
    var it = items[i], q = it.q, sc = dailyState.scores[i]||0, locked = (sc >= 10);
    if(it.subj !== lastSubj){ html += '<div class="exam-daimon-head" style="margin:14px 0 8px">'+SUBJ_NAME[it.subj]+'</div>'; lastSubj = it.subj; }
    _rubyMode = (it.subj === 'jp') ? 'jp' : 'std';
    html += '<div class="test-row'+(locked?' row-locked':'')+'"><div class="test-q"><span class="num">'+(i+1)+'</span><div style="flex:1;min-width:0">';
    if(q.type === 'listening'){ html += '🎧 '+escapeHtml(q.text)+'<button class="audio-btn" data-audio="'+escapeHtml(q.audio)+'" style="margin-left:8px">&#x1f50a; 再生</button>'; }
    else { html += fracText(q.text); }
    html += '</div></div><div class="test-a" id="dqa-'+i+'">';
    if(locked){
      var ctxt; if(q.type==='fraction'){ var rc=fracReduce(q.num,q.den); ctxt=(rc[0]<0?'−':'')+Math.abs(rc[0])+'/'+rc[1]; }
      else ctxt = q.choices ? q.choices[q.correct] : (q.keywords ? q.keywords.join(', ') : '');
      html += '<span class="mark ok">○</span> <span class="correct-answer show" style="display:inline">'+fracText(ctxt)+'</span>';
    } else {
      if(q.type === 'fraction'){
        var fa = dailyState.answers[i] || {}; var fsign = fa.sign === -1 ? -1 : 1;
        html += '<div class="frac-input"><button class="frac-sign'+(fsign===-1?' minus':'')+'" data-dq="'+i+'">'+(fsign===-1?'−':'＋')+'</button><div class="frac-stack">';
        html += '<input class="frac-num" data-dq="'+i+'" inputmode="numeric" value="'+escapeHtml(String(fa.n!=null?fa.n:''))+'" placeholder="分子"><div class="frac-bar"></div>';
        html += '<input class="frac-den" data-dq="'+i+'" inputmode="numeric" value="'+escapeHtml(String(fa.d!=null?fa.d:''))+'" placeholder="分母"></div></div>';
      } else if(q.type === 'writing' || q.type === 'listening'){
        var val = dailyState.answers[i] !== undefined ? String(dailyState.answers[i]) : '';

      } else {
        html += '<div class="choice-row">';
        for(var c=0;c<q.choices.length;c++){ var sel=(dailyState.answers[i]===c)?' sel':''; html += '<button class="choice-pill'+sel+'" data-dqc="'+i+'" data-c="'+c+'"><span class="kana">'+KANA[c]+'</span>'+fracText(q.choices[c])+'</button>'; }
        html += '</div>';
      }
      if(checked){ html += '<div class="dq-retry">× もう一度！</div>'; }
    }
    html += '</div></div>';
  }
  _rubyMode = 'std';
  html += '</div><div class="actions" style="justify-content:center;margin-top:14px;gap:8px"><button class="btn" id="dqBack">カレンダーに戻る</button>'+
    (allCorrect ? '<button class="btn primary" id="dqToPreview">③ 予習へ進む →</button>'
                : '<button class="btn primary" id="dqCheck">答え合わせ</button>')+
    '</div></div>';
  main.innerHTML = html;
