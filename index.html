// 答え合わせ：正解(満点)した問題は固定。全問正解でゲーム時間付与＆予習へ進めるように
function dailyReviewCheck(){
  var items = dailyState.items;
  for(var i=0;i<items.length;i++){
    if((dailyState.scores[i]||0) >= 10) continue;       // すでに正解済みは固定
    dailyState.scores[i] = gradeAnswer(items[i].q, dailyState.answers[i]);
  }
  dailyState.reviewChecked = true;
  var allOK = items.length>0 && items.every(function(it,i){ return (dailyState.scores[i]||0) >= 10; });
  if(allOK && !dailyState.reviewRewarded){ dailyState.reviewRewarded = true; earnYen(10); }
  renderDailyReview();
}

// ③ 予習（調べて予習）：要点とヒントを見ながら次の単元を解く
function renderDailyPreview(){
  var main = document.getElementById('main');
  var pv = dailyState.pv, KANA=['ア','イ','ウ','エ'];
  var html = '<div class="daily-wrap"><div class="daily-head"><div class="daily-title">Day '+dailyState.day+'<em>③ 予習：次の単元を先取り（5教科）</em></div></div>';
  html += '<div class="dt-sub" style="margin-bottom:12px;color:var(--muted);font-size:12px">教科書のように1ステップずつ読んで → 最後に問題を解いてみよう。先に知っておくと授業がぐっとわかる！</div>';
  for(var p=0;p<pv.length;p++){
    var it=pv[p], t=it.topic;
    _rubyMode=(it.subj==='jp')?'jp':'std';
    // 数学だけ分数(a/2 等)を縦組み表示
    var F = (it.subj==='math') ? mathFrac : function(x){ return furigana(escapeHtml(x)); };
    html += '<div class="pv-card"><div class="pv-subj"><span class="pv-tag">予習</span>'+SUBJ_NAME[it.subj]+' — '+F(t.t)+'</div>';
    // 段階解説（教科書ふう）
    html += '<div class="pv-lesson">';
    for(var s=0;s<t.steps.length;s++){
      html += '<div class="pv-step"><div class="ps-h">'+F(t.steps[s].h)+'</div><div class="ps-b">'+F(t.steps[s].b)+'</div></div>';
    }
    if(t.ex){ html += '<div class="pv-ex"><span class="pe-label">れい</span>'+F(t.ex)+'</div>'; }
    html += '</div>';
    // では、問題を解いてみよう
    html += '<div class="pv-solve">では、問題を解いてみよう</div>';
    html += '<div class="pv-q">'+F(t.check.q)+'</div>';
    html += '<button class="pv-hint-btn" data-pvh="'+p+'">💡 ヒントを見る</button><div class="pv-hint" id="pvh-'+p+'" style="display:none"></div>';
    html += '<div class="choice-row">';
    for(var c=0;c<t.check.choices.length;c++){ var sel=(dailyState.pvAnswers[p]===c)?' sel':''; html += '<button class="choice-pill'+sel+'" data-pvc="'+p+'" data-c="'+c+'"><span class="kana">'+KANA[c]+'</span>'+F(t.check.choices[c])+'</button>'; }
    html += '</div><div class="pv-mark" id="pvm-'+p+'"></div>';
    html += '<button class="pv-understand'+(dailyState.understood[p]?' on':'')+'" data-pvu="'+p+'">'+(dailyState.understood[p]?'✓ 理解した！':'理解した ✓')+'</button></div>';
  }
  _rubyMode='std';
  html += '<div class="actions" style="justify-content:center;gap:8px;margin-top:6px"><button class="btn" id="pvBack">← 復習へ戻る</button><button class="btn primary" id="pvDone">✓ 本日完了</button></div></div>';
  main.innerHTML = html;

  main.querySelectorAll('.pv-hint-btn[data-pvh]').forEach(function(b){ b.onclick=function(){ var p=parseInt(b.dataset.pvh,10); var t=pv[p].topic; var wrong=t.check.choices[(t.check.correct+1)%t.check.choices.length]; var el=document.getElementById('pvh-'+p); el.textContent='要点をもう一度読もう。「'+wrong+'」はちがうよ。'; el.style.display='block'; }; });
  main.querySelectorAll('.choice-pill[data-pvc]').forEach(function(b){ b.onclick=function(){ var p=parseInt(b.dataset.pvc,10),c=parseInt(b.dataset.c,10); dailyState.pvAnswers[p]=c; var box=b.closest('.choice-row'); box.querySelectorAll('.choice-pill').forEach(function(x){x.classList.remove('sel');}); b.classList.add('sel'); var ok=(c===pv[p].topic.check.correct); var m=document.getElementById('pvm-'+p); m.textContent=ok?'○ 正解！この調子で先取りしよう':'× もう一度。要点にヒントがあるよ'; m.className='pv-mark '+(ok?'ok':'ng'); }; });
  main.querySelectorAll('.pv-understand[data-pvu]').forEach(function(b){ b.onclick=function(){ var p=parseInt(b.dataset.pvu,10); dailyState.understood[p]=!dailyState.understood[p]; b.classList.toggle('on',dailyState.understood[p]); b.textContent=dailyState.understood[p]?'✓ 理解した！':'理解した ✓'; }; });
  document.getElementById('pvBack').onclick=function(){ dailyState.phase='review'; renderDailyReview(); };
  document.getElementById('pvDone').onclick=function(){ dailyFinish(); };
}

function dailyFinish(){
  var todayKey=dayKey(new Date());
  var firstDone=!dailyDone[todayKey];

  if(firstDone) earnYen(10);   // 本日完了でゲーム時間を加算
  var uCount=0; for(var p=0;p<dailyState.pv.length;p++){ if(dailyState.understood[p]) uCount++; }

}

// 他科目は LEARN(SUBJECTS) のレベルから自動構築（解説つき）
function trainBaseCats(subj){
  var cats;
  if(TRAIN_DATA[subj]){
    cats = TRAIN_DATA[subj].cats;
  } else {
    var lv = (SUBJECTS[subj] && SUBJECTS[subj].levels) || [];
    cats = lv.map(function(level){
      return { name: level.name, items: (level.questions||[]).filter(function(q){ return q.choices; }).map(function(q){
        return { prompt:q.q, choices:q.choices, correct:q.a, expl:q.expl||'' };
      }) };
    });
  }
  // 期末つみあげ＝【期末】タグの単元だけ／中間モード＝【期末】を除外（被り解消）
  var wantFinal = !!trainState.yomatsu;
  return cats.filter(function(c){ var isFinal = /【期末】/.test(c.name); return wantFinal ? isFinal : !isFinal; });
}
var weakData = {}; // 弱点克服用: subj -> [item, ...]
// 英語の手作り問題は正解がアばかりなので、起動時に選択肢をシャッフルして正解位置を散らす
function shuffleTrainChoices(){
  if(!TRAIN_DATA.en) return;
  TRAIN_DATA.en.cats.forEach(function(cat){
    (cat.items||[]).forEach(function(it){
      if(!it.choices || it.choices.length<2) return;
      var order=[]; for(var k=0;k<it.choices.length;k++) order.push(k);
      order=_finShuffle(order);
      var nc=order.map(function(idx){ return it.choices[idx]; });
      it.correct=order.indexOf(it.correct);
      it.choices=nc;
    });
  });
}
function trainGetCats(subj){
  if(trainState.mode==='weak'){ return [{ name:'苦手だった問題', items: (weakData[subj]||[]) }]; }
  return trainBaseCats(subj);
}
function trainHintText(it){
  if(it.hint) return it.hint;
  if(it.expl){ var m=String(it.expl).split(/[。\n]/)[0]; if(m && m.length>=3) return m+'。'; }
  return '選択肢をよく見て、正しい形を選ぼう。';
}
function trainBindTabs(main){
  main.querySelectorAll('.train-subjtab[data-tsubj]').forEach(function(b){ b.onclick=function(){ trainState.subj=b.dataset.tsubj; trainState.cat=0; trainResetItem(); renderTrain(); }; });
  main.querySelectorAll('.train-cat[data-tcat]').forEach(function(b){ b.onclick=function(){ trainState.cat=parseInt(b.dataset.tcat,10); trainResetItem(); renderTrain(); }; });
}
function trainResetItem(){ trainState.idx=0; trainState.picked=null; trainState.revealed=false; trainState.elim=[]; trainState.hintShown=false; }
function trainResetFlow(){
  var subjs=scopeSubjs(); trainState.subj=subjs[0]; trainState.cat=0; trainState.idx=0; trainState.doneAll=false;
  trainState.picked=null; trainState.revealed=false; trainState.elim=[]; trainState.hintShown=false;
}
// 正解で次へ：項目内→次の項目→（総合なら）次の科目
function trainAdvance(){
  var subjs=scopeSubjs(); var cats=trainBaseCats(trainState.subj);
  trainState.idx++;
  if(trainState.idx >= ((cats[trainState.cat]&&cats[trainState.cat].items.length)||0)){
    trainState.idx=0; trainState.cat++;
    if(trainState.cat >= cats.length){
      trainState.cat=0;
      var si=subjs.indexOf(trainState.subj);
      if(si>=0 && si<subjs.length-1){ trainState.subj=subjs[si+1]; }
      else { trainState.doneAll=true; }
    }
  }
  trainState.picked=null; trainState.revealed=false; trainState.elim=[]; trainState.hintShown=false;
  renderTrain();
}
function renderTrain(){
  if(trainState.mode==='finisher'){ renderFinisher(); return; }
  if(trainState.mode==='weak'){ renderWeak(); return; }
  var main=document.getElementById('main');

  if(subjs.indexOf(trainState.subj)<0){ trainState.subj=subjs[0]; trainState.cat=0; trainState.idx=0; trainState.doneAll=false; }
  _rubyMode = (trainState.subj==='jp')?'jp':'std';
  var KANA=['ア','イ','ウ','エ','オ','カ'];

  html+=scopeBarHTML();
  // 全部おわり

    main.innerHTML=html; _rubyMode='std';

  }
  var cats=trainBaseCats(trainState.subj);
  if(trainState.cat>=cats.length) trainState.cat=0;
  var cat=cats[trainState.cat]||{items:[]};
  if(trainState.idx>=cat.items.length) trainState.idx=0;
  var it=cat.items[trainState.idx];
  // 現在の科目名（総合のとき）
  if(trainScope==='総合'){ var cnm=(TRAIN_DATA[trainState.subj]&&TRAIN_DATA[trainState.subj].name)||(SUBJECTS[trainState.subj]&&SUBJECTS[trainState.subj].name)||trainState.subj; html+='<div class="train-cursubj">'+escapeHtml(cnm)+'</div>'; }
  // 項目チップ（現在の科目の項目、現在地ハイライト）
  html+='<div class="train-cats">';
  cats.forEach(function(c,ci){ html+='<button class="train-cat'+(ci===trainState.cat?' on':'')+'" data-tcat="'+ci+'">'+furigana(escapeHtml(c.name))+'</button>'; });
  html+='</div>';
  if(!it){ html+='<div class="train-card">この項目は準備中です。</div></div>'; main.innerHTML=html; _rubyMode='std'; bindScopeBar(main, function(){ trainResetFlow(); renderTrain(); }); return; }
  var solved=(trainState.picked!=null && trainState.picked===it.correct);
  var revealed=trainState.revealed;
  var locked=(solved||revealed);
  var wrongPick=(trainState.picked!=null && trainState.picked!==it.correct && !revealed);
  var prompt=it.ja||it.prompt;
  var qlabel=it.ja?'次の日本語を 英語に すると？':'正しい答えを えらぼう';
  html+='<div class="train-card">';
  html+='<div class="train-progress">'+(trainState.idx+1)+' / '+cat.items.length+'　'+escapeHtml(cat.name)+'</div>';
  html+='<div class="train-qlabel">'+qlabel+'</div>';
  html+='<div class="train-prompt">'+(it.ja?furigana(escapeHtml(prompt)):fracText(prompt))+'</div>';
  html+='<div class="train-choices">';
  for(var c=0;c<it.choices.length;c++){
    var cls='tc';
    if(trainState.elim.indexOf(c)>=0) cls+=' elim';
    if(locked){ if(c===it.correct) cls+=' correct'; else if(trainState.picked===c) cls+=' wrong'; }
    else if(wrongPick && trainState.picked===c){ cls+=' wrong'; }
    var chtxt=it.ja?escapeHtml(it.choices[c]):fracText(it.choices[c]);
    html+='<button class="'+cls+'" data-tc="'+c+'"'+(locked?' disabled':'')+'><span class="kana">'+KANA[c]+'</span>'+chtxt+'</button>';
  }
  html+='</div>';
  if(solved){ html+='<div class="train-feedback ok">⭕ 正解！つぎへ進むよ</div>'; }
  else if(wrongPick){ html+='<div class="train-feedback ng">❌ ちがうよ。ヒントを見て もう一度えらぼう！</div>'; }
  html+='<div class="train-help"><button class="hint" id="tHint">💡 ヒント</button><button class="special" id="tSpecial">⭐ スペシャルヒント</button><button class="ans" id="tAns">👀 答えを見る</button></div>';
  html+='<div class="train-hintbox hint" id="tHintBox" style="display:'+(trainState.hintShown?'block':'none')+'">'+furigana(escapeHtml(trainHintText(it)))+'</div>';
  html+='<div class="train-hintbox special" id="tSpecialBox" style="display:'+(trainState.elim.length?'block':'none')+'">まちがいを 2つ 消したよ。のこりから えらぼう！</div>';
  html+='<div class="train-expl'+(locked?' show':'')+'" id="tExpl">📘 '+furigana(escapeHtml(it.expl||''))+'</div>';
  if(revealed && !solved){ html+='<div class="train-next"><button id="tNext">つぎへ →</button></div>'; }
  html+='</div></div>';
  main.innerHTML=html;
  _rubyMode='std';
  bindScopeBar(main, function(){ trainResetFlow(); renderTrain(); });
  main.querySelectorAll('.train-cat[data-tcat]').forEach(function(b){ b.onclick=function(){ trainState.cat=parseInt(b.dataset.tcat,10); trainResetItem(); renderTrain(); }; });
  main.querySelectorAll('.tc[data-tc]').forEach(function(b){ b.onclick=function(){
    if(locked) return;
    var c=parseInt(b.dataset.tc,10);
    trainState.picked=c;
    if(c===it.correct){ trainState.done++; var d=document.getElementById('trainDone'); if(d) d.textContent=trainState.done; renderTrain(); setTimeout(function(){ if(trainState.mode==='train' && trainState.picked===it.correct){ trainAdvance(); } }, 650); }
    else { renderTrain(); }
  }; });
  document.getElementById('tHint').onclick=function(){ trainState.hintShown=!trainState.hintShown; document.getElementById('tHintBox').style.display=trainState.hintShown?'block':'none'; };
  document.getElementById('tSpecial').onclick=function(){ var wrongs=[]; for(var c=0;c<it.choices.length;c++){ if(c!==it.correct) wrongs.push(c); } trainState.elim=wrongs.slice(0,2); renderTrain(); };
  document.getElementById('tAns').onclick=function(){ trainState.revealed=true; renderTrain(); };
  var tn=document.getElementById('tNext'); if(tn) tn.onclick=function(){ trainAdvance(); };
}

// ===== 💥 5科目集中 必殺テスト（5教科ミックス・一気に） =====
var finisherState = { pool:[], idx:0, correct:0, picked:null, bySubj:{}, rewarded:false };
function _finShuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function buildFinisherPool(){
  var pool=[];
  var subjs=scopeSubjs();
  var per=(subjs.length===1)?3:2; // 1科目のときは項目あたり多めに
  // 項目ごと：科目→項目の順に（シャッフルは項目内のみ）
  subjs.forEach(function(subj){
    trainBaseCats(subj).forEach(function(c){
      _finShuffle(c.items||[]).slice(0,per).forEach(function(it){ pool.push({subj:subj, cat:c.name, it:it}); });
    });
  });
  return pool;
}
function _finOrder(n){ var o=[]; for(var k=0;k<n;k++) o.push(k); return _finShuffle(o); }
function startFinisher(){
  finisherState={ pool:buildFinisherPool(), idx:0, correct:0, picked:null, bySubj:{}, wrong:[], rewarded:false, order:null, firstTry:true };
  trainState.mode='finisher'; renderFinisher();
}
function renderFinisher(){
  var main=document.getElementById('main'); var fs=finisherState;
  if(fs.idx>=fs.pool.length){ renderFinisherResult(); return; }
  var cur=fs.pool[fs.idx], it=cur.it, subj=cur.subj;
  if(!fs.order || fs.order.length!==it.choices.length) fs.order=_finOrder(it.choices.length);
  var order=fs.order, correctPos=order.indexOf(it.correct);
  _rubyMode=(subj==='jp')?'jp':'std';
  var KANA=['ア','イ','ウ','エ','オ','カ'];
  var subjName=(TRAIN_DATA[subj]&&TRAIN_DATA[subj].name)||(SUBJECTS[subj]&&SUBJECTS[subj].name)||subj;
  var answered=(fs.picked!=null);
  var ok = answered && (fs.picked===correctPos);
  var prompt=it.ja||it.prompt;
  var pct=Math.round(fs.idx/fs.pool.length*100);
  var html='<div class="train-wrap">';
  html+=scopeBarHTML();
  html+='<div class="fin-top"><div class="fin-bar"><i style="width:'+pct+'%"></i></div><div class="fin-meta"><span>'+(fs.idx+1)+' / '+fs.pool.length+' 問</span><span>正解 '+fs.correct+'</span></div></div>';
  html+='<div class="train-card">';
  html+='<div class="fin-subj">'+escapeHtml(subjName)+(cur.cat?' ・ '+escapeHtml(cur.cat):'')+(it.ja?' ・ 日本語→英語':'')+'</div>';
  html+='<div class="train-prompt">'+(it.ja?furigana(escapeHtml(prompt)):fracText(prompt))+'</div>';
  html+='<div class="train-choices">';
  for(var pos=0;pos<order.length;pos++){
    var origIdx=order[pos];
    var cls='tc';
    if(answered){ if(pos===correctPos) cls+=' correct'; else if(fs.picked===pos) cls+=' wrong'; }
    var chtxt=it.ja?escapeHtml(it.choices[origIdx]):fracText(it.choices[origIdx]);
    html+='<button class="'+cls+'" data-fc="'+pos+'"'+(answered?' disabled':'')+'><span class="kana">'+KANA[pos]+'</span>'+chtxt+'</button>';
  }
  html+='</div>';
  if(answered){
    html+='<div class="train-expl show">'+(ok?'⭕ 正解！つぎへ進むよ':'❌ ちがう。正解は '+KANA[correctPos])+(it.expl?'<br>📘 '+furigana(escapeHtml(it.expl)):'')+'</div>';
    if(!ok) html+='<div class="train-next"><button id="finRetryQ">🔁 もう一度（正解するまで進めない・位置がかわる）</button></div>';
  }
  html+='</div></div>';
  main.innerHTML=html; _rubyMode='std';
  bindScopeBar(main, function(){ startFinisher(); });
  if(!answered){
    main.querySelectorAll('.tc[data-fc]').forEach(function(b){ b.onclick=function(){
      if(fs.picked!=null) return;
      var pos=parseInt(b.dataset.fc,10);
      fs.picked=pos;
      var good=(pos===correctPos);
      if(fs.firstTry){ // 採点は最初の1回だけ（やり直しても点は増えない＝苦手扱い）
        fs.bySubj[subj]=fs.bySubj[subj]||{c:0,t:0}; fs.bySubj[subj].t++;
        if(good){ fs.correct++; fs.bySubj[subj].c++; } else { fs.wrong.push({subj:subj, cat:cur.cat, it:it}); }
        fs.firstTry=false;
      }
      renderFinisher();
      if(good){ setTimeout(function(){ if(trainState.mode==='finisher' && finisherState===fs && fs.picked!=null){ finNext(); } }, 700); }
      // 不正解は自動で進まない → 「もう一度」で位置をかえて再出題
    }; });
  } else if(!ok){
    var rb=document.getElementById('finRetryQ'); if(rb) rb.onclick=function(){ fs.picked=null; fs.order=_finOrder(it.choices.length); renderFinisher(); };
  }
}
function finNext(){ var fs=finisherState; fs.idx++; fs.picked=null; fs.order=null; fs.firstTry=true; renderFinisher(); }
function renderFinisherResult(){
  var main=document.getElementById('main'); var fs=finisherState;
  var total=fs.pool.length, pct=total?Math.round(fs.correct/total*100):0;
  var msg = pct>=90?'天才！もう完璧だ！💯' : (pct>=70?'よくできた！この調子！🔥' : (pct>=50?'あと一歩！まちがいを見直そう' : 'くりかえせば 必ず のびる！'));
  var rows='';
  TRAIN_SUBJS.forEach(function(s){ var b=fs.bySubj[s]; if(!b) return; var nm=(TRAIN_DATA[s]&&TRAIN_DATA[s].name)||(SUBJECTS[s]&&SUBJECTS[s].name)||s; rows+='<div class="fin-rrow"><span>'+escapeHtml(nm)+'</span><b>'+b.c+' / '+b.t+'</b></div>'; });
  if(!fs.rewarded){ fs.rewarded=true; earnYen(Math.max(1, Math.round(fs.correct/3))); }
  var nWrong = (fs.wrong||[]).length;
  var html='<div class="train-wrap"><div class="train-card" style="text-align:center">'+
    '<h2 style="margin:4px 0">💥 必殺テスト けっか</h2>'+
    '<div class="fin-score">'+fs.correct+' / '+total+'</div>'+
    '<div class="fin-pct">正答率 '+pct+'%</div>'+

// ===== ⚡ このまま行こうぜ！＝5科目 実力解放テスト（本番用紙形式・選択式）=====

function _sg(n){ return (n<0?'-'+(-n):'+'+n); }
function _par(n){ return '('+_sg(n)+')'; }
function genMath(){
  var out=[], rng=_genRng(20260601);
  function ri(a,b){ return a+Math.floor(rng()*(b-a+1)); }
  function push(q, correct, wrongs, cat, expl){
    var set=[correct]; wrongs.forEach(function(w){ if(set.indexOf(w)<0 && set.length<4) set.push(w); });
    var d=1; while(set.length<4){ [correct+d,correct-d].forEach(function(w){ if(set.indexOf(w)<0&&set.length<4) set.push(w); }); d++; }
    set=_shuf4(set,rng);
    out.push({it:{prompt:q, choices:set.map(function(n){return _sg(n);}), correct:set.indexOf(correct), expl:expl||''}, cat:cat});
  }
  var i,a,b,ans;
  for(i=0;i<55;i++){ a=ri(-15,15); b=ri(-15,15); ans=a+b; push(_par(a)+' + '+_par(b)+' = ?', ans, [a-b,-(a+b),Math.abs(a)+Math.abs(b)], '正負の数の加法','同符号は絶対値を足す、異符号は差。'); }
  for(i=0;i<55;i++){ a=ri(-15,15); b=ri(-15,15); ans=a-b; push(_par(a)+' - '+_par(b)+' = ?', ans, [a+b,-(a-b),b-a], '正負の数の減法','引く数の符号を変えて足す。'); }
  for(i=0;i<44;i++){ a=ri(-12,12)||2; b=ri(-12,12)||2; ans=a*b; push(_par(a)+' × '+_par(b)+' = ?', ans, [-ans,a+b,Math.abs(a*b)], '正負の数の乗法','同符号→+、異符号→-。'); }
  for(i=0;i<36;i++){ b=ri(2,12)*(rng()<.5?-1:1); var qq=ri(2,12)*(rng()<.5?-1:1); a=b*qq; ans=a/b; push(_par(a)+' ÷ '+_par(b)+' = ?', ans, [-ans,a-b,Math.abs(ans)+1], '正負の数の除法','同符号→+、異符号→-。'); }
  var bs=[-5,-4,-3,-2,2,3,4,5,6]; for(i=0;i<22;i++){ var ba=bs[i%bs.length]; var ex=2+(i%2); ans=Math.round(Math.pow(ba,ex)); push('('+_sg(ba)+')'+(ex===2?'²':'³')+' = ?', ans, [-ans,Math.abs(ba)*ex,Math.round(Math.pow(-ba,ex))], '累乗','マイナスが偶数個→+、奇数個→-。'); }

}
function genEnglish(){

  var nouns=[{j:'生徒',e:'a student',pl:'students'},{j:'先生',e:'a teacher',pl:'teachers'},{j:'友達',e:'a friend',pl:'friends'},{j:'医者',e:'a doctor',pl:'doctors'},{j:'歌手',e:'a singer',pl:'singers'},{j:'テニス選手',e:'a tennis player',pl:'tennis players'},{j:'看護師',e:'a nurse',pl:'nurses'},{j:'サッカー選手',e:'a soccer player',pl:'soccer players'},{j:'ピアニスト',e:'a pianist',pl:'pianists'},{j:'画家',e:'an artist',pl:'artists'}];

  }); });
  var verbs=[{j:'泳げます',e:'swim'},{j:'速く走れます',e:'run fast'},{j:'歌えます',e:'sing'},{j:'料理ができます',e:'cook'},{j:'ピアノをひけます',e:'play the piano'},{j:'英語を話せます',e:'speak English'},{j:'自転車に乗れます',e:'ride a bike'},{j:'スキーができます',e:'ski'},{j:'踊れます',e:'dance'},{j:'バスケができます',e:'play basketball'},{j:'絵をかけます',e:'draw'},{j:'ギターをひけます',e:'play the guitar'}];

  likes.forEach(function(t){
    push('私は'+t.j+'が好きです。', 'I like '+t.e+'.', ['I am like '+t.e+'.','I likes '+t.e+'.','Like I '+t.e+'.'], '否定・疑問');
    push('彼は'+t.j+'が好きです。', 'He likes '+t.e+'.', ['He like '+t.e+'.','He is like '+t.e+'.','He do like '+t.e+'.'], '否定・疑問');
    push('あなたは'+t.j+'が好きですか。', 'Do you like '+t.e+'?', ['Are you like '+t.e+'?','You like '+t.e+'?','Is you like '+t.e+'?'], '否定・疑問');
  });
  // this/that の疑問・応答
  things.forEach(function(t){
    push('これは'+t.j+'ですか。', 'Is this '+t.e+'?', ['This is '+t.e+'?','Are this '+t.e+'?','Do this '+t.e+'?'], 'this/that/it');
  });

  verbs.forEach(function(v){
    push('あなたは'+v.j.replace('ます','ますか')+'。', 'Can you '+v.e+'?', ['Do you '+v.e+'?','Are you '+v.e+'?','You can '+v.e+'?'], 'can');

  return out;
}
function genQuestions(subj){ if(subj==='math') return genMath(); if(subj==='en') return genEnglish(); return []; }
// 実力解放テスト用プール（手作り＝約1割 ＋ 自動生成＝残り）。科目ごとキャッシュ
var _relPoolCache={};
function releasePool(subj){
  if(_relPoolCache[subj]) return _relPoolCache[subj];
  var curated=[]; trainBaseCats(subj).forEach(function(c){ (c.items||[]).forEach(function(it){ curated.push({it:it, cat:c.name}); }); });
  var gen=genQuestions(subj);
  var raw;
  if(gen.length){
    // 手作り（これでいくぞ/必殺の内容）は約1割、残り9割は自動生成の類似別問題
    var nCur=Math.max(2, Math.round(gen.length/9));
    var curPick=mockSeededShuffle(curated, 555).slice(0, nCur);
    raw = curPick.concat(gen);
  } else {
    raw = curated;
  }
  // テキストで重複除去（同じ問題が2回出ないように）
  var seen={}, pool=[];
  raw.forEach(function(x){ var k=(x.it.ja||x.it.prompt); if(k && !seen[k]){ seen[k]=1; pool.push(x); } });
  _relPoolCache[subj]=pool;
  return pool;
}
function buildReleaseTest(pattern){
  var items=[], qi=0;

    var idx=[]; for(var k=0;k<it.choices.length;k++) idx.push(k);
    var order=mockSeededShuffle(idx, pattern*131 + qi*7 + 17); qi++;
    items.push({subj:subj, group:group, it:it, order:order});
  }
  var subjs=scopeSubjs();
  if(subjs.length===1){
    // 1科目: 大量プール（手作り＋自動生成）を固定順シャッフル → 各パターン重複なし（20問）。大問＝項目
    var subj=subjs[0]; var cats=trainBaseCats(subj);
    var catIdx={}; cats.forEach(function(c,ci){ catIdx[c.name]=ci; });
    var shuffled=mockSeededShuffle(releasePool(subj), 7777);
    var size=Math.min(20, Math.max(5, Math.floor(shuffled.length/RELEASE_PATTERNS)));
    var start=pattern*size, slice=[];
    for(var i=0;i<size;i++){ slice.push(shuffled[(start+i)%shuffled.length]); }
    slice.sort(function(a,b){ return (catIdx[a.cat]==null?99:catIdx[a.cat])-(catIdx[b.cat]==null?99:catIdx[b.cat]); });
    slice.forEach(function(s){ pushItem(subj, s.cat, s.it); });
  } else {
    // 総合: 科目ごとに大量プールを固定順シャッフル → 各パターン4問（被りゼロ）。大問＝科目
    subjs.forEach(function(subj,si){
      var snm=(TRAIN_DATA[subj]&&TRAIN_DATA[subj].name)||(SUBJECTS[subj]&&SUBJECTS[subj].name)||subj;
      var shuffled=mockSeededShuffle(releasePool(subj), 8800+si);
      var per=4, start=pattern*per;

function startRelease(pattern){

}
function setReleaseMode(m){

}
// ===== 実力解放テストの進行度（スコープ別・パターン別）。0=未挑戦 1=クリア(100点) 2=完全オール =====
function relProgKey(){ return trainScope||'総合'; }

}
function renderReleasePatternBar(){

  for(var i=0;i<RELEASE_PATTERNS;i++){

function gradeRelease(){
  var rs=releaseState, correct=0;

var SR_OK = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
var _srActive=null;
function normEn(s){ return (s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
function speechMatch(said, target){
  var a=normEn(said), b=normEn(target);
  if(!a||!b) return false;
  if(a===b) return true;
  var setA={}; a.split(' ').forEach(function(w){ setA[w]=1; });
  var bw=b.split(' '), hit=0; bw.forEach(function(w){ if(setA[w]) hit++; });
  return bw.length ? (hit/bw.length >= 0.6) : false;
}
var _srBusy=false;
function recognizeEnglish(target, btn, cb){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ cb(null,false,'unsupported'); return; }
  if(_srBusy){ return; } // 多重起動を防ぐ（前の認識が終わるまで無視）
  var r; try{ r=new SR(); }catch(e){ cb(null,false,'init'); return; }
  _srBusy=true; _srActive=r;
  r.lang='en-US'; r.interimResults=false; r.maxAlternatives=3; r.continuous=false;
  if(btn){ btn.classList.add('listening'); btn.textContent='🎤 聞いています…'; }
  var best='', ok=false, errCode=null, finished=false;
  var watchdog=setTimeout(function(){ try{ r.stop(); }catch(e){} }, 8000);
  r.onresult=function(e){ var res=e.results[0];
    for(var i=0;i<res.length;i++){ var t=res[i].transcript; if(!best) best=t; if(speechMatch(t,target)){ ok=true; best=t; break; } }
  };
  r.onerror=function(ev){ errCode=(ev&&ev.error)||'error'; };
  r.onend=function(){
    clearTimeout(watchdog);
    if(btn) btn.classList.remove('listening');
    _srBusy=false; _srActive=null;
    if(finished) return; finished=true;
    cb(best||null, ok, best? null : (errCode||'noresult'));
  };
  try{ r.start(); }catch(e){ clearTimeout(watchdog); _srBusy=false; _srActive=null; if(btn) btn.classList.remove('listening'); cb(null,false,'start'); }
}

      } else if(ms.graded){ var ok=(ms.answers[i]===it.a); html+='<div class="exam-mk" style="color:'+(ok?'#2e7d32':'#c62828')+'">'+(ok?'○ 正解':'× 正解は '+KANA[it.a])+(it.e?'　/　'+escapeHtml(it.e):'')+'</div>'; }
    }
    html+='</div></div>';
  });
  if(lastG!==null) html+='</div>';
  if(fix){
    if(solvedCount===list.length && list.length){
      if(!ms.rewarded){ ms.rewarded=true; earnYen(10); }
      var wwN=0; list.forEach(function(_,i){ if(ms.fix[i]&&ms.fix[i].wasWrong) wwN++; });
      html+='<div style="text-align:center;margin-top:22px"><div style="font-size:26px;font-weight:800;color:#2e7d32">💯 100点！ぜんぶ直してクリア！</div>';
      if(wwN){ html+='<div style="font-size:13px;color:#666;margin-top:6px">さっき まちがえた '+wwN+'問、こんどはヒントなしでやってみよう！</div><button class="exam-submit matome-ww" style="margin-top:12px;background:linear-gradient(135deg,#ff8f3d,#ff3d77)">💪 まちがいだけ やり直す（'+wwN+'問）</button><div style="margin-top:8px"><button class="exam-submit" id="matomeRetry" style="background:#888">🔁 もう一回</button></div>'; }
      else { html+='<div style="font-size:13px;color:#666;margin-top:6px">一度もまちがえずクリア！すごい！</div><button class="exam-submit" id="matomeRetry" style="margin-top:12px">🔁 もう一回</button>'; }
      html+='</div>';
    } else {
      html+='<div style="text-align:center;margin-top:18px;font-size:13px;color:#555">まちがえたら 💡ヒントを見て もう一度。ぜんぶ直すと <b>100点</b>！（のこり '+(list.length-solvedCount)+'問）</div>';
    }
  } else if(!ms.graded){ html+='<div style="text-align:center;margin-top:22px"><button class="exam-submit" id="matomeGrade">⚡ 採点する</button><div style="font-size:12px;color:#666;margin-top:8px">全'+list.length+'問。本番のつもりで！'+(jp?'（書き込みは漢字でもひらがなでもOK）':'')+'</div></div>'; }
  else {
    var wrongN=0; list.forEach(function(it,i){ if(!matomeCheck(it, ms.answers[i])) wrongN++; });
    html+='<div style="text-align:center;margin-top:22px"><div style="font-size:20px;font-weight:800;margin-bottom:6px">得点 '+ms.score+' 点（正解 '+ms.correct+' / '+list.length+'）</div>';
    if(ms.score===100){ html+='<div style="font-size:15px;color:#0aa6a6;font-weight:800;margin-bottom:8px">💯 パーフェクト！本番もこの調子！</div><button class="exam-submit" id="matomeRetry">🔁 もう一回</button>'; }
    else { html+='<div style="font-size:13px;color:#666;margin-bottom:8px">まちがえた問題だけ やり直して、全問正解（100点）にしよう！</div><button class="exam-submit" id="matomeWeakBtn" style="background:linear-gradient(135deg,#ff8f3d,#ff3d77)">💪 まちがいだけ やり直す（'+wrongN+'問）</button><div style="margin-top:8px"><button class="exam-submit" id="matomeRetry" style="background:#888">🔁 最初からもう一回</button></div>'; }
    html+='</div>';
  }
  html+='</div>';
  main.innerHTML=html; _rubyMode='std';
  main.querySelectorAll('.rel-mode[data-msub]').forEach(function(b){ b.onclick=function(){ setMatomeSubj(b.dataset.msub); }; });
  main.querySelectorAll('.rel-mode[data-mmode]').forEach(function(b){ b.onclick=function(){ setMatomeMode(b.dataset.mmode); }; });
  main.querySelectorAll('.test-set-btn[data-mpat]').forEach(function(b){ b.onclick=function(){ setMatomePat(parseInt(b.dataset.mpat,10)); }; });
  if(fix){
    main.querySelectorAll('.choice-pill[data-mq]').forEach(function(b){ b.onclick=function(){
      var qi=parseInt(b.dataset.mq,10); if(ms.fix[qi]&&ms.fix[qi].solved) return;
      var pos=parseInt(b.dataset.c,10); var prev=ms.fix[qi]||{};
      if(pos===list[qi].a){ ms.fix[qi]={solved:true, wasWrong:prev.wasWrong||false}; } else { ms.fix[qi]={solved:false, lastWrong:pos, wasWrong:true}; }
      renderMatome();
    }; });
    main.querySelectorAll('input[data-mw]').forEach(function(inp){ inp.oninput=function(){ ms.answers[parseInt(inp.dataset.mw,10)]=inp.value; }; });
    main.querySelectorAll('.mtm-check[data-mck]').forEach(function(b){ b.onclick=function(){
      var qi=parseInt(b.dataset.mck,10); var prev=ms.fix[qi]||{}; var val=ms.answers[qi]||'';
      if(matomeCheck(list[qi], val)){ ms.fix[qi]={solved:true, wasWrong:prev.wasWrong||false}; } else { ms.fix[qi]={solved:false, lastWrong:(val||'(空)'), wasWrong:true}; }
      renderMatome();
    }; });
    var rbf=document.getElementById('matomeRetry'); if(rbf) rbf.onclick=startMatome;
    var wwb=main.querySelector('.matome-ww'); if(wwb) wwb.onclick=function(){ var wr=[]; list.forEach(function(it,i){ if(ms.fix[i]&&ms.fix[i].wasWrong) wr.push(it); }); startMatomeWeak(wr); };
  } else if(!ms.graded){
    main.querySelectorAll('.choice-pill[data-mq]').forEach(function(b){ b.onclick=function(){ var qi=parseInt(b.dataset.mq,10); ms.answers[qi]=parseInt(b.dataset.c,10); var box=b.closest('.choice-row'); box.querySelectorAll('.choice-pill').forEach(function(p){ p.classList.remove('sel'); }); b.classList.add('sel'); }; });
    main.querySelectorAll('input[data-mw]').forEach(function(inp){ inp.oninput=function(){ ms.answers[parseInt(inp.dataset.mw,10)]=inp.value; }; });
    var gb=document.getElementById('matomeGrade'); if(gb) gb.onclick=gradeMatome;
  } else {
    var rb=document.getElementById('matomeRetry'); if(rb) rb.onclick=startMatome;
    var wb=document.getElementById('matomeWeakBtn'); if(wb) wb.onclick=function(){ var wr=[]; list.forEach(function(it,i){ if(!matomeCheck(it, ms.answers[i])) wr.push(it); }); startMatomeWeak(wr); };
  }
}
// ===== 最終まとめ：まちがいだけ やり直す（弱点なんてないモード方式・ラウンドで減らす）=====
function matomeWeakCorrect(wi, ans){ if(wi.it.type==='write'){ return matomeCheck(wi.it, ans); } return ans === (wi.order? wi.order.indexOf(wi.it.a) : wi.it.a); }
function startMatomeWeak(items){ if(!items||!items.length) return; matomeState.weak={ items: items.map(function(it){ return { it:it, order:(it.type!=='write'?_finOrder(it.c.length):null) }; }), answers:{}, judged:false, round:1, startCount:items.length, rewarded:false }; renderMatome(); try{ document.querySelector('.main').scrollTop=0; }catch(e){} }
function judgeMatomeWeak(){ matomeState.weak.judged=true; renderMatome(); try{ document.querySelector('.main').scrollTop=0; }catch(e){} }
function matomeWeakNext(){ var w=matomeState.weak, remain=[]; w.items.forEach(function(wi,i){ if(!matomeWeakCorrect(wi, w.answers[i])){ remain.push({ it:wi.it, order:(wi.it.type!=='write'?_finOrder(wi.it.c.length):null) }); } }); w.items=remain; w.answers={}; w.judged=false; w.round++; renderMatome(); try{ document.querySelector('.main').scrollTop=0; }catch(e){} }
function exitMatomeWeak(){ matomeState.weak=null; renderMatome(); try{ document.querySelector('.main').scrollTop=0; }catch(e){} }
function renderMatomeWeak(){
  var main=document.getElementById('main'); var ms=matomeState; var w=ms.weak; var KANA=['ア','イ','ウ','エ','オ'];
  var jp=(ms.subj==='jp'), math=(ms.subj==='math'); _rubyMode=jp?'jp':'std';
  var total=w.items.length, correctNow=0;
  w.items.forEach(function(wi,i){ if(matomeWeakCorrect(wi, w.answers[i])) correctNow++; });
  var remaining=total-correctNow;
  var html='<div class="exam-paper">';
  html+='<div class="exam-head"><div><div class="exam-title">💪 まちがいだけ やり直す</div><div class="exam-sub">ラウンド'+w.round+' ・ のこり'+total+'問 ・ 全問正解で100点！</div></div><div class="exam-score"><span class="lbl">のこり</span><span class="v">'+(w.judged?remaining:total)+'</span></div></div>';
  html+='<div style="margin:6px 0 12px;font-size:13px;color:#555">最初のまちがい <b>'+w.startCount+'問</b>。ぜんぶ正解で <b style="color:#ff3d77">パーフェクト</b>！</div>';
  html+='<div class="exam-daimon"><div class="exam-daimon-head"><span>のこり '+total+'問</span></div>';
  w.items.forEach(function(wi,i){
    var it=wi.it; _rubyMode=jp?'jp':'std';
    var qtext = math ? fracText(it.q) : (jp ? furigana(escapeHtml(it.q)) : escapeHtml(it.q));
    html+='<div class="exam-q"><div class="exam-qno">('+(i+1)+')</div><div class="exam-qbody"><div class="exam-qtext">'+qtext+'</div>'+(it.svg?'<div class="exam-fig">'+it.svg+'</div>':'');
    var ans=w.answers[i];
    if(it.type==='write'){
      var okw=w.judged && matomeCheck(it, ans||'');
      html+='<div class="exam-ans"><input type="text" data-ww="'+i+'" value="'+escapeHtml(ans||'')+'"'+(w.judged?' disabled':'')+' placeholder="ここに書く"></div>';
      if(w.judged){ html+='<div class="exam-mk" style="color:'+(okw?'#2e7d32':'#c62828')+'">'+(okw?'⭕ 正解！':'× 正解は「'+escapeHtml((it.accept||[''])[0])+'」')+(it.e?'　/　'+escapeHtml(it.e):'')+'</div>'; }
    } else {
      var order=wi.order||[]; var correctPos=order.indexOf(it.a);
      html+='<div class="choice-row">';
      for(var pos=0;pos<order.length;pos++){
        var origIdx=order[pos]; var cls='choice-pill';
        if(w.judged){ if(pos===correctPos) cls+=' gr-correct'; else if(ans===pos) cls+=' gr-wrong'; }
        else if(ans===pos) cls+=' sel';
        var ctxt = math ? fracText(it.c[origIdx]) : escapeHtml(it.c[origIdx]);
        html+='<button class="'+cls+'" data-wq="'+i+'" data-c="'+pos+'"'+(w.judged?' disabled':'')+'>'+KANA[pos]+'. '+ctxt+'</button>';
      }
      html+='</div>';
      if(w.judged){ var ok=(ans===correctPos); html+='<div class="exam-mk" style="color:'+(ok?'#2e7d32':'#c62828')+'">'+(ok?'⭕ 正解！':'× 正解は '+KANA[correctPos])+(it.e?'　/　'+escapeHtml(it.e):'')+'</div>'; }
    }
    html+='</div></div>';
  });
  _rubyMode='std'; html+='</div>';
  if(!w.judged){
    html+='<div style="text-align:center;margin-top:20px"><button class="exam-submit" id="mwJudge">⚡ 判定する</button><div style="font-size:12px;color:#666;margin-top:8px">えらんで／書いてから判定。</div><div style="margin-top:8px"><button class="exam-submit" id="mwExit" style="background:#888">↩ もどる</button></div></div>';
  } else if(remaining===0){
    if(!w.rewarded){ w.rewarded=true; earnYen(10); }
    html+='<div style="text-align:center;margin-top:22px"><div style="font-size:26px;font-weight:800;color:#ff3d77">💯 100点！全問正解！</div><div style="font-size:13px;color:#666;margin-top:6px">最初のまちがい '+w.startCount+'問を ぜんぶ こくふく！🎉</div><button class="exam-submit" id="mwExit" style="margin-top:12px">↩ テストにもどる</button></div>';
  } else {
    html+='<div style="text-align:center;margin-top:22px"><div style="font-size:20px;font-weight:800;color:#2e7d32">'+total+'問中 '+correctNow+'問 正解！</div><div style="font-size:15px;color:#c62828;margin-top:4px;font-weight:700">のこり '+remaining+'問！</div><div style="font-size:12px;color:#666;margin-top:6px">のこった問題だけ、もう一度（選択肢の位置はかわるよ）</div><button class="exam-submit" id="mwNext" style="margin-top:12px;background:linear-gradient(135deg,#ff8f3d,#ff3d77)">🔥 のこり '+remaining+'問に もう一回！</button><div style="margin-top:8px"><button class="exam-submit" id="mwExit" style="background:#888">↩ もどる</button></div></div>';
  }
  html+='</div>';
  main.innerHTML=html; _rubyMode='std';
  if(!w.judged){
    main.querySelectorAll('.choice-pill[data-wq]').forEach(function(b){ b.onclick=function(){ var qi=parseInt(b.dataset.wq,10); w.answers[qi]=parseInt(b.dataset.c,10); var box=b.closest('.choice-row'); box.querySelectorAll('.choice-pill').forEach(function(p){ p.classList.remove('sel'); }); b.classList.add('sel'); }; });
    main.querySelectorAll('input[data-ww]').forEach(function(inp){ inp.oninput=function(){ w.answers[parseInt(inp.dataset.ww,10)]=inp.value; }; });
    var jb=document.getElementById('mwJudge'); if(jb) jb.onclick=judgeMatomeWeak;
  } else {
    var nb=document.getElementById('mwNext'); if(nb) nb.onclick=matomeWeakNext;
  }
  var eb=document.getElementById('mwExit'); if(eb) eb.onclick=exitMatomeWeak;
}

// ============ Init ============
applyTheme();
loadProgress();
currentSubj = state.subj; // 保存済みの科目を全モードの初期選択に合わせる
loadAllowance();
loadDaily();
shuffleTrainChoices();
hwInit();
render();
// 起動はホーム（毎日1時間）から。迷ったらここだけでOK
(function(){
  var dp = ROADMAP.filter(function(x){ return x.key===currentPhase && x.ready; })[0]
        || ROADMAP.filter(function(x){ return x.ready; })[0];
  if(dp){ applyPhase(dp); }
})();
renderRoadmap();
</script>
