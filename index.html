function renderDailyPreview(){
  var main = document.getElementById('main');
  var pv = dailyState.pv, KANA=['ア','イ','ウ','エ'];
  var html = '<div class="daily-wrap"><div class="daily-head"><div class="daily-title">Day '+dailyState.day+'<em>③ 予習：次の単元を先取り（5教科）</em></div></div>';
  html += '<div class="dt-sub" style="margin-bottom:12px;color:var(--muted);font-size:12px">教科書のように1ステップずつ読んで → 最後に問題を解いてみよう。先に知っておくと授業がぐっとわかる！</div>';
  for(var p=0;p<pv.length;p++){
    var it=pv[p], t=it.topic;
    _rubyMode=(it.subj==='jp')?'jp':'std';
    // 数学だけ分数(a/2 等)を縦組み表示
    var F = (it.subj==='math') ? mathFrac : function(x){ return furigana(escapeHtml(x)); };
    html += '<div class="pv-card"><div class="pv-subj"><span class="pv-tag">予習</span>'+SUBJ_NAME[it.subj]+' — '+F(t.t)+'</div>';
    // 段階解説（教科書ふう）
    html += '<div class="pv-lesson">';
    for(var s=0;s<t.steps.length;s++){
      html += '<div class="pv-step"><div class="ps-h">'+F(t.steps[s].h)+'</div><div class="ps-b">'+F(t.steps[s].b)+'</div></div>';
    }
    if(t.ex){ html += '<div class="pv-ex"><span class="pe-label">れい</span>'+F(t.ex)+'</div>'; }
    html += '</div>';
    // では、問題を解いてみよう
    html += '<div class="pv-solve">では、問題を解いてみよう</div>';
    html += '<div class="pv-q">'+F(t.check.q)+'</div>';
    html += '<button class="pv-hint-btn" data-pvh="'+p+'">💡 ヒントを見る</button><div class="pv-hint" id="pvh-'+p+'" style="display:none"></div>';
    html += '<div class="choice-row">';
    for(var c=0;c<t.check.choices.length;c++){ var sel=(dailyState.pvAnswers[p]===c)?' sel':''; html += '<button class="choice-pill'+sel+'" data-pvc="'+p+'" data-c="'+c+'"><span class="kana">'+KANA[c]+'</span>'+F(t.check.choices[c])+'</button>'; }
    html += '</div><div class="pv-mark" id="pvm-'+p+'"></div>';
    html += '<button class="pv-understand'+(dailyState.understood[p]?' on':'')+'" data-pvu="'+p+'">'+(dailyState.understood[p]?'✓ 理解した！':'理解した ✓')+'</button></div>';
  }
  _rubyMode='std';
  html += '<div class="actions" style="justify-content:center;gap:8px;margin-top:6px"><button class="btn" id="pvBack">← 復習へ戻る</button><button class="btn primary" id="pvDone">✓ 本日完了</button></div></div>';
  main.innerHTML = html;

  main.querySelectorAll('.pv-hint-btn[data-pvh]').forEach(function(b){ b.onclick=function(){ var p=parseInt(b.dataset.pvh,10); var t=pv[p].topic; var wrong=t.check.choices[(t.check.correct+1)%t.check.choices.length]; var el=document.getElementById('pvh-'+p); el.textContent='要点をもう一度読もう。「'+wrong+'」はちがうよ。'; el.style.display='block'; }; });
  main.querySelectorAll('.choice-pill[data-pvc]').forEach(function(b){ b.onclick=function(){ var p=parseInt(b.dataset.pvc,10),c=parseInt(b.dataset.c,10); dailyState.pvAnswers[p]=c; var box=b.closest('.choice-row'); box.querySelectorAll('.choice-pill').forEach(function(x){x.classList.remove('sel');}); b.classList.add('sel'); var ok=(c===pv[p].topic.check.correct); var m=document.getElementById('pvm-'+p); m.textContent=ok?'○ 正解！この調子で先取りしよう':'× もう一度。要点にヒントがあるよ'; m.className='pv-mark '+(ok?'ok':'ng'); }; });
  main.querySelectorAll('.pv-understand[data-pvu]').forEach(function(b){ b.onclick=function(){ var p=parseInt(b.dataset.pvu,10); dailyState.understood[p]=!dailyState.understood[p]; b.classList.toggle('on',dailyState.understood[p]); b.textContent=dailyState.understood[p]?'✓ 理解した！':'理解した ✓'; }; });

}

// 他科目は LEARN(SUBJECTS) のレベルから自動構築（解説つき）
function trainBaseCats(subj){
  var cats;
  if(TRAIN_DATA[subj]){
    cats = TRAIN_DATA[subj].cats;
  } else {
    var lv = (SUBJECTS[subj] && SUBJECTS[subj].levels) || [];
    cats = lv.map(function(level){
      return { name: level.name, page: level.page||'', items: (level.questions||[]).filter(function(q){ return q.choices; }).map(function(q){
        return { prompt:q.q, choices:q.choices, correct:q.a, expl:q.expl||'' };
      }) };
    });
  }
  // 期末つみあげ＝【期末】タグの単元だけ／中間モード＝【期末】を除外（被り解消）
  var wantFinal = !!trainState.yomatsu;
  return cats.filter(function(c){ var isFinal = /【期末】/.test(c.name); return wantFinal ? isFinal : !isFinal; });
}
var weakData = {}; // 弱点克服用: subj -> [item, ...]
// 英語の手作り問題は正解がアばかりなので、起動時に選択肢をシャッフルして正解位置を散らす
function shuffleTrainChoices(){
  if(!TRAIN_DATA.en) return;
  TRAIN_DATA.en.cats.forEach(function(cat){
    (cat.items||[]).forEach(function(it){
      if(!it.choices || it.choices.length<2) return;
      var order=[]; for(var k=0;k<it.choices.length;k++) order.push(k);
      order=_finShuffle(order);
      var nc=order.map(function(idx){ return it.choices[idx]; });
      it.correct=order.indexOf(it.correct);
      it.choices=nc;
    });
  });
}
function trainGetCats(subj){
  if(trainState.mode==='weak'){ return [{ name:'苦手だった問題', items: (weakData[subj]||[]) }]; }
  return trainBaseCats(subj);
}
function trainHintText(it){
  if(it.hint) return it.hint;
  if(it.expl){ var m=String(it.expl).split(/[。\n]/)[0]; if(m && m.length>=3) return m+'。'; }
  return '選択肢をよく見て、正しい形を選ぼう。';
}
function trainBindTabs(main){
  main.querySelectorAll('.train-subjtab[data-tsubj]').forEach(function(b){ b.onclick=function(){ trainState.subj=b.dataset.tsubj; trainState.cat=0; trainResetItem(); renderTrain(); }; });
  main.querySelectorAll('.train-cat[data-tcat]').forEach(function(b){ b.onclick=function(){ trainState.cat=parseInt(b.dataset.tcat,10); trainResetItem(); renderTrain(); }; });
}
function trainResetItem(){ trainState.idx=0; trainState.picked=null; trainState.revealed=false; trainState.elim=[]; trainState.hintShown=false; trainState.orderPool=null; trainState.orderPicked=[]; trainState.orderJudged=false; trainState.orderCorrect=false; trainState.orderWrongFlash=false; }
function trainResetFlow(){
  var subjs=scopeSubjs(); trainState.subj=subjs[0]; trainState.cat=0; trainState.idx=0; trainState.doneAll=false;
  trainState.picked=null; trainState.revealed=false; trainState.elim=[]; trainState.hintShown=false;
  trainState.orderPool=null; trainState.orderPicked=[]; trainState.orderJudged=false; trainState.orderCorrect=false; trainState.orderWrongFlash=false;
}
function _trainShuffleIdx(n){ var o=[]; for(var k=0;k<n;k++) o.push(k); for(var i=o.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=o[i]; o[i]=o[j]; o[j]=t; } return o; }
// 並べ替え：単語チップをタップした順に並べ、元の順番(0,1,2...)と一致すれば正解
function trainOrderPick(poolPos){
  if(trainState.orderJudged && trainState.orderCorrect) return;
  var idx=trainState.orderPool[poolPos];
  trainState.orderPool.splice(poolPos,1);
  trainState.orderPicked.push(idx);
  trainState.orderWrongFlash=false;
  var it=trainBaseCats(trainState.subj)[trainState.cat].items[trainState.idx];
  if(trainState.orderPicked.length===it.tokens.length){
    var ok=true;
    for(var i=0;i<it.tokens.length;i++){ if(trainState.orderPicked[i]!==i){ ok=false; break; } }
    trainState.orderJudged=true; trainState.orderCorrect=ok;
    if(ok){
      trainState.done++; var d=document.getElementById('trainDone'); if(d) d.textContent=trainState.done;
      renderTrain();
      setTimeout(function(){ if(trainState.mode==='train' && trainState.orderCorrect){ trainAdvance(); } }, 750);
      return;
    } else { trainState.orderWrongFlash=true; }
  }
  renderTrain();
}
function trainOrderUndo(){
  if(trainState.orderJudged && trainState.orderCorrect) return;
  if(!trainState.orderPicked.length) return;
  var idx=trainState.orderPicked.pop();
  trainState.orderPool.push(idx);
  trainState.orderJudged=false; trainState.orderWrongFlash=false;
  renderTrain();
}
function trainOrderRetry(){ trainState.orderPool=trainState.orderPool.concat(trainState.orderPicked); trainState.orderPicked=[]; trainState.orderJudged=false; trainState.orderCorrect=false; trainState.orderWrongFlash=false; renderTrain(); }
// 正解で次へ：項目内→次の項目→（総合なら）次の科目
function trainAdvance(){
  var subjs=scopeSubjs(); var cats=trainBaseCats(trainState.subj);
  trainState.idx++;
  if(trainState.idx >= ((cats[trainState.cat]&&cats[trainState.cat].items.length)||0)){
    trainState.idx=0; trainState.cat++;
    if(trainState.cat >= cats.length){
      trainState.cat=0;
      var si=subjs.indexOf(trainState.subj);
      if(si>=0 && si<subjs.length-1){ trainState.subj=subjs[si+1]; }
      else { trainState.doneAll=true; }
    }
  }
  trainState.picked=null; trainState.revealed=false; trainState.elim=[]; trainState.hintShown=false;
  trainState.orderPool=null; trainState.orderPicked=[]; trainState.orderJudged=false; trainState.orderCorrect=false; trainState.orderWrongFlash=false;
  renderTrain();
}
function renderTrain(){
  if(trainState.mode==='finisher'){ renderFinisher(); return; }
  if(trainState.mode==='weak'){ renderWeak(); return; }
  var main=document.getElementById('main');
  var subjs=scopeSubjs();
  if(subjs.indexOf(trainState.subj)<0){ trainState.subj=subjs[0]; trainState.cat=0; trainState.idx=0; trainState.doneAll=false; }
  _rubyMode = (trainState.subj==='jp')?'jp':'std';
  var KANA=['ア','イ','ウ','エ','オ','カ'];
  var html='<div class="train-wrap">';
  html+=scopeBarHTML();
  // 全部おわり
  if(trainState.doneAll){
    html+='<div class="train-card" style="text-align:center"><h2 style="margin:6px 0">🎉 ぜんぶ おわり！</h2><div class="fin-msg">'+(trainScope==='総合'?'5科目':(TRAIN_SCOPES.filter(function(s){return s.k===trainScope;})[0]||{n:''}).n)+'の項目を ぜんぶ クリア！</div><div class="train-next"><button id="trainAgain">🔁 もう一周</button></div></div></div>';
    main.innerHTML=html; _rubyMode='std';
    bindScopeBar(main, function(){ trainResetFlow(); renderTrain(); });
    document.getElementById('trainAgain').onclick=function(){ trainResetFlow(); renderTrain(); };
    return;
  }
  var cats=trainBaseCats(trainState.subj);
  if(trainState.cat>=cats.length) trainState.cat=0;
  var cat=cats[trainState.cat]||{items:[]};
  if(trainState.idx>=cat.items.length) trainState.idx=0;
  var it=cat.items[trainState.idx];
  // 現在の科目名（総合のとき）
  if(trainScope==='総合'){ var cnm=(TRAIN_DATA[trainState.subj]&&TRAIN_DATA[trainState.subj].name)||(SUBJECTS[trainState.subj]&&SUBJECTS[trainState.subj].name)||trainState.subj; html+='<div class="train-cursubj">'+escapeHtml(cnm)+'</div>'; }
  // 項目チップ（現在の科目の項目、現在地ハイライト）
  html+='<div class="train-cats">';
  cats.forEach(function(c,ci){ var fin=isFinalName(c.name)?' final':''; html+='<button class="train-cat'+(ci===trainState.cat?' on':'')+fin+'" data-tcat="'+ci+'">'+furigana(escapeHtml(stripFinalTag(c.name)))+finalBadgeHtml(c.name)+'</button>'; });
  html+='</div>';
  if(trainState.subj==='en' && RHYTHM_DATA.en['疑問詞と命令文の歌【期末】']){ html+='<div class="train-song-row"><button class="train-song-btn" id="tSongBtn">🎵 歌で覚える（疑問詞・命令文）</button></div>'; }
  if(!it){ html+='<div class="train-card">この項目は準備中です。</div></div>'; main.innerHTML=html; _rubyMode='std'; bindScopeBar(main, function(){ trainResetFlow(); renderTrain(); }); return; }
  var isOrderItem=(it.type==='order');
  if(isOrderItem && !trainState.orderPool){ trainState.orderPool=_trainShuffleIdx(it.tokens.length); trainState.orderPicked=[]; trainState.orderJudged=false; trainState.orderCorrect=false; trainState.orderWrongFlash=false; }
  var solved = isOrderItem ? (trainState.orderJudged && trainState.orderCorrect) : (trainState.picked!=null && trainState.picked===it.correct);
  var revealed=trainState.revealed;
  var locked=(solved||revealed);
  var wrongPick = isOrderItem ? false : (trainState.picked!=null && trainState.picked!==it.correct && !revealed);
  var prompt=it.ja||it.prompt;
  var qlabel = isOrderItem ? '日本語の意味になるように、単語をタップして並べよう'
    : it.qkind==='wordmeaning' ? '次の英単語の日本語の意味は？'
    : it.qkind==='fillchoice' ? '（　）に あてはまる語を えらぼう'
    : it.ja?'次の日本語を 英語に すると？':'正しい答えを えらぼう';
  html+='<div class="train-card">';
  html+='<div class="train-progress">'+(trainState.idx+1)+' / '+cat.items.length+'　'+nameWithFinalBadge(cat.name)+'</div>';
  if(cat.page){ html+='<div class="train-page-ref">📘 わかりにくいときは <b>ワーク p.'+escapeHtml(cat.page)+'</b> の図を見てみよう</div>'; }
  html+='<div class="train-qlabel">'+qlabel+'</div>';
  var speakText = it.qkind==='wordmeaning' ? it.ja : (isOrderItem && locked ? it.tokens.join(' ') : '');
  html+='<div class="train-prompt">'+(it.ja?furigana(escapeHtml(prompt)):fracText(prompt))+(speakText?' <button class="train-speak" id="tSpeak" title="発音を聞く">🔊</button>':'')+'</div>';
  if(isOrderItem){
    html+='<div class="train-order-answer">';
    if(!trainState.orderPicked.length){ html+='<span class="train-order-ph">ここに単語が並ぶよ</span>'; }
    trainState.orderPicked.forEach(function(idx){ html+='<span class="train-order-chip placed">'+escapeHtml(it.tokens[idx])+'</span>'; });
    html+='</div>';
    if(solved){ html+='<div class="train-feedback ok">⭕ 正解！つぎへ進むよ</div>'; }
    else if(trainState.orderWrongFlash){ html+='<div class="train-feedback ng">❌ 順番がちがうよ。「1つ戻す」でやり直そう！</div>'; }
    html+='<div class="train-order-pool">';
    (locked?[]:trainState.orderPool).forEach(function(idx,poolPos){ html+='<button class="train-order-chip" data-poolpos="'+poolPos+'">'+escapeHtml(it.tokens[idx])+'</button>'; });
    html+='</div>';
    if(!locked){ html+='<div class="train-order-actions"><button class="train-order-undo" id="tOrderUndo"'+(trainState.orderPicked.length?'':' disabled')+'>⬅ 1つ戻す</button></div>'; }
  } else {
    html+='<div class="train-choices">';
    for(var c=0;c<it.choices.length;c++){
      var cls='tc';
      if(trainState.elim.indexOf(c)>=0) cls+=' elim';
      if(locked){ if(c===it.correct) cls+=' correct'; else if(trainState.picked===c) cls+=' wrong'; }
      else if(wrongPick && trainState.picked===c){ cls+=' wrong'; }
      var chtxt=it.ja?escapeHtml(it.choices[c]):fracText(it.choices[c]);
      html+='<button class="'+cls+'" data-tc="'+c+'"'+(locked?' disabled':'')+'><span class="kana">'+KANA[c]+'</span>'+chtxt+'</button>';
    }
    html+='</div>';
    if(solved){ html+='<div class="train-feedback ok">⭕ 正解！つぎへ進むよ</div>'; }
    else if(wrongPick){ html+='<div class="train-feedback ng">❌ ちがうよ。ヒントを見て もう一度えらぼう！</div>'; }
  }
  html+='<div class="train-help"><button class="hint" id="tHint">💡 ヒント</button>'+(isOrderItem?'':'<button class="special" id="tSpecial">⭐ スペシャルヒント</button>')+'<button class="ans" id="tAns">👀 答えを見る</button></div>';
  html+='<div class="train-hintbox hint" id="tHintBox" style="display:'+(trainState.hintShown?'block':'none')+'">'+furigana(escapeHtml(trainHintText(it)))+'</div>';
  if(!isOrderItem){ html+='<div class="train-hintbox special" id="tSpecialBox" style="display:'+(trainState.elim.length?'block':'none')+'">まちがいを 2つ 消したよ。のこりから えらぼう！</div>'; }
  if(isOrderItem && revealed && !solved){ html+='<div class="train-hintbox special" style="display:block">正解：'+escapeHtml(it.tokens.join(' '))+'</div>'; }
  html+='<div class="train-expl'+(locked?' show':'')+'" id="tExpl">📘 '+furigana(escapeHtml(it.expl||''))+'</div>';
  if(revealed && !solved){ html+='<div class="train-next"><button id="tNext">つぎへ →</button></div>'; }
  html+='</div></div>';
  main.innerHTML=html;
  _rubyMode='std';
  bindScopeBar(main, function(){ trainResetFlow(); renderTrain(); });
  main.querySelectorAll('.train-cat[data-tcat]').forEach(function(b){ b.onclick=function(){ trainState.cat=parseInt(b.dataset.tcat,10); trainResetItem(); renderTrain(); }; });
  var songBtn=document.getElementById('tSongBtn'); if(songBtn) songBtn.onclick=function(){ openChantPlayer('en','疑問詞と命令文の歌【期末】'); };
  if(isOrderItem){
    if(!locked){ main.querySelectorAll('.train-order-pool .train-order-chip[data-poolpos]').forEach(function(b){ b.onclick=function(){ trainOrderPick(parseInt(b.dataset.poolpos,10)); }; }); }
    var ou=document.getElementById('tOrderUndo'); if(ou) ou.onclick=trainOrderUndo;
  } else {
    main.querySelectorAll('.tc[data-tc]').forEach(function(b){ b.onclick=function(){
      if(locked) return;
      var c=parseInt(b.dataset.tc,10);
      trainState.picked=c;
      if(c===it.correct){ trainState.done++; var d=document.getElementById('trainDone'); if(d) d.textContent=trainState.done; renderTrain(); setTimeout(function(){ if(trainState.mode==='train' && trainState.picked===it.correct){ trainAdvance(); } }, 650); }
      else { renderTrain(); }
    }; });
    var tsp=document.getElementById('tSpecial'); if(tsp) tsp.onclick=function(){ var wrongs=[]; for(var c=0;c<it.choices.length;c++){ if(c!==it.correct) wrongs.push(c); } trainState.elim=wrongs.slice(0,2); renderTrain(); };
  }
  document.getElementById('tHint').onclick=function(){ trainState.hintShown=!trainState.hintShown; document.getElementById('tHintBox').style.display=trainState.hintShown?'block':'none'; };
  document.getElementById('tAns').onclick=function(){ trainState.revealed=true; renderTrain(); };
  var tn=document.getElementById('tNext'); if(tn) tn.onclick=function(){ trainAdvance(); };
  var tsk=document.getElementById('tSpeak'); if(tsk) tsk.onclick=function(){ speakEnglish(speakText, tsk); };
}

// ===== 💥 5科目集中 必殺テスト（5教科ミックス・一気に） =====
var finisherState = { pool:[], idx:0, correct:0, picked:null, bySubj:{}, rewarded:false };
function _finShuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function buildFinisherPool(){
  var pool=[];
  var subjs=scopeSubjs();
  var per=(subjs.length===1)?3:2; // 1科目のときは項目あたり多めに
  // 項目ごと：科目→項目の順に（シャッフルは項目内のみ）
  subjs.forEach(function(subj){
    trainBaseCats(subj).forEach(function(c){
      var choiceItems=(c.items||[]).filter(function(it){ return it.type!=='order'; }); // 必殺テストは選択式のみ対象（並べ替えは除外）
      _finShuffle(choiceItems).slice(0,per).forEach(function(it){ pool.push({subj:subj, cat:c.name, it:it}); });
    });
  });
  return pool;
}
function _finOrder(n){ var o=[]; for(var k=0;k<n;k++) o.push(k); return _finShuffle(o); }
function startFinisher(){
  finisherState={ pool:buildFinisherPool(), idx:0, correct:0, picked:null, bySubj:{}, wrong:[], rewarded:false, order:null, firstTry:true };
  trainState.mode='finisher'; renderFinisher();
}
function renderFinisher(){
  var main=document.getElementById('main'); var fs=finisherState;
  if(fs.idx>=fs.pool.length){ renderFinisherResult(); return; }
  var cur=fs.pool[fs.idx], it=cur.it, subj=cur.subj;
  if(!fs.order || fs.order.length!==it.choices.length) fs.order=_finOrder(it.choices.length);
  var order=fs.order, correctPos=order.indexOf(it.correct);
  _rubyMode=(subj==='jp')?'jp':'std';
  var KANA=['ア','イ','ウ','エ','オ','カ'];
  var subjName=(TRAIN_DATA[subj]&&TRAIN_DATA[subj].name)||(SUBJECTS[subj]&&SUBJECTS[subj].name)||subj;
  var answered=(fs.picked!=null);
  var ok = answered && (fs.picked===correctPos);
  var prompt=it.ja||it.prompt;
  var pct=Math.round(fs.idx/fs.pool.length*100);
  var html='<div class="train-wrap">';
  html+=scopeBarHTML();
  html+='<div class="fin-top"><div class="fin-bar"><i style="width:'+pct+'%"></i></div><div class="fin-meta"><span>'+(fs.idx+1)+' / '+fs.pool.length+' 問</span><span>正解 '+fs.correct+'</span></div></div>';
  html+='<div class="train-card">';
  html+='<div class="fin-subj">'+escapeHtml(subjName)+(cur.cat?' ・ '+escapeHtml(cur.cat):'')+(it.ja?' ・ 日本語→英語':'')+'</div>';
  html+='<div class="train-prompt">'+(it.ja?furigana(escapeHtml(prompt)):fracText(prompt))+'</div>';
  html+='<div class="train-choices">';
  for(var pos=0;pos<order.length;pos++){
    var origIdx=order[pos];
    var cls='tc';
    if(answered){ if(pos===correctPos) cls+=' correct'; else if(fs.picked===pos) cls+=' wrong'; }
    var chtxt=it.ja?escapeHtml(it.choices[origIdx]):fracText(it.choices[origIdx]);
    html+='<button class="'+cls+'" data-fc="'+pos+'"'+(answered?' disabled':'')+'><span class="kana">'+KANA[pos]+'</span>'+chtxt+'</button>';
  }
  html+='</div>';
  if(answered){
    html+='<div class="train-expl show">'+(ok?'⭕ 正解！つぎへ進むよ':'❌ ちがう。正解は '+KANA[correctPos])+(it.expl?'<br>📘 '+furigana(escapeHtml(it.expl)):'')+'</div>';
    if(!ok) html+='<div class="train-next"><button id="finRetryQ">🔁 もう一度（正解するまで進めない・位置がかわる）</button></div>';
  }
  html+='</div></div>';
  main.innerHTML=html; _rubyMode='std';
  bindScopeBar(main, function(){ startFinisher(); });
  if(!answered){
    main.querySelectorAll('.tc[data-fc]').forEach(function(b){ b.onclick=function(){
      if(fs.picked!=null) return;
      var pos=parseInt(b.dataset.fc,10);
      fs.picked=pos;
      var good=(pos===correctPos);
      if(fs.firstTry){ // 採点は最初の1回だけ（やり直しても点は増えない＝苦手扱い）
        fs.bySubj[subj]=fs.bySubj[subj]||{c:0,t:0}; fs.bySubj[subj].t++;
        if(good){ fs.correct++; fs.bySubj[subj].c++; } else { fs.wrong.push({subj:subj, cat:cur.cat, it:it}); }
        fs.firstTry=false;
      }
      renderFinisher();
      if(good){ setTimeout(function(){ if(trainState.mode==='finisher' && finisherState===fs && fs.picked!=null){ finNext(); } }, 700); }
      // 不正解は自動で進まない → 「もう一度」で位置をかえて再出題
    }; });
  } else if(!ok){
    var rb=document.getElementById('finRetryQ'); if(rb) rb.onclick=function(){ fs.picked=null; fs.order=_finOrder(it.choices.length); renderFinisher(); };
  }
}
function finNext(){ var fs=finisherState; fs.idx++; fs.picked=null; fs.order=null; fs.firstTry=true; renderFinisher(); }
function renderFinisherResult(){
  var main=document.getElementById('main'); var fs=finisherState;
  var total=fs.pool.length, pct=total?Math.round(fs.correct/total*100):0;
  var msg = pct>=90?'天才！もう完璧だ！💯' : (pct>=70?'よくできた！この調子！🔥' : (pct>=50?'あと一歩！まちがいを見直そう' : 'くりかえせば 必ず のびる！'));
  var rows='';
  TRAIN_SUBJS.forEach(function(s){ var b=fs.bySubj[s]; if(!b) return; var nm=(TRAIN_DATA[s]&&TRAIN_DATA[s].name)||(SUBJECTS[s]&&SUBJECTS[s].name)||s; rows+='<div class="fin-rrow"><span>'+escapeHtml(nm)+'</span><b>'+b.c+' / '+b.t+'</b></div>'; });
  if(!fs.rewarded){ fs.rewarded=true; earnYen(Math.max(1, Math.round(fs.correct/3))); }
  var nWrong = (fs.wrong||[]).length;
  var html='<div class="train-wrap"><div class="train-card" style="text-align:center">'+
    '<h2 style="margin:4px 0">💥 必殺テスト けっか</h2>'+
    '<div class="fin-score">'+fs.correct+' / '+total+'</div>'+
    '<div class="fin-pct">正答率 '+pct+'%</div>'+
    '<div class="fin-rrows">'+rows+'</div>'+
    '<div class="fin-msg">'+msg+'</div>'+
    (nWrong ? '<div class="train-next"><button id="finWeak" style="background:linear-gradient(135deg,#ff6b3d,#ff3d77)">💪 弱点克服へ（できなかった '+nWrong+' 問）</button></div>' : '<div class="fin-msg" style="color:var(--ok);margin-top:8px">⭐ 全問正解！弱点なし！</div>')+
    '<div class="train-next" style="margin-top:10px"><button id="finRelease" style="background:linear-gradient(135deg,#ffb300,#ff7043);color:#1b1b1b">⚡ このまま行こうぜ！（実力解放テスト）</button></div>'+
    '<div class="train-help" style="justify-content:center;margin-top:14px"><button class="special" id="finRetry">💥 もう一回</button><button class="ans" id="finBack">← もどる</button></div>'+
    '</div></div>';
  main.innerHTML=html;
  var fw=document.getElementById('finWeak'); if(fw) fw.onclick=function(){ startWeak(fs.wrong); };
  var sc=document.getElementById('finScore'); if(sc) sc.textContent=fs.correct;
  document.getElementById('finRelease').onclick=function(){ switchMode('release'); };
  document.getElementById('finRetry').onclick=startFinisher;
  document.getElementById('finBack').onclick=function(){ switchMode('train'); };
}

// ===== 💪 5科目集中 弱点克服（必殺でできなかった所を科目別に・連続で）=====
function startWeak(wrongList){
  weakData={};
  (wrongList||[]).forEach(function(w){ (weakData[w.subj]=weakData[w.subj]||[]).push(w.it); });
  var ws=TRAIN_SUBJS.filter(function(s){ return (weakData[s]||[]).length; });
  trainState.subj = ws.length?ws[0]:'en';
  trainState.mode='weak'; trainResetItem();
  renderWeak();
}
function weakExit(){ trainState.mode='train'; trainResetItem(); switchMode('train'); }
function weakNext(){
  var arr=weakData[trainState.subj]||[]; var it=arr[0];
  if(it){ if(trainState.picked===it.correct){ arr.shift(); } else { arr.push(arr.shift()); } } // 正解→克服(削除) / まちがい→後ろへ
  trainState.picked=null; trainState.revealed=false; trainState.elim=[]; trainState.hintShown=false;
  if(!(weakData[trainState.subj]||[]).length){ var ws=TRAIN_SUBJS.filter(function(s){ return (weakData[s]||[]).length; }); if(ws.length) trainState.subj=ws[0]; }
  renderWeak();
}
function renderWeak(){
  var main=document.getElementById('main');
  _rubyMode=(trainState.subj==='jp')?'jp':'std';
  var weakSubjs=TRAIN_SUBJS.filter(function(s){ return (weakData[s]||[]).length; });
  var total=0; weakSubjs.forEach(function(s){ total+=weakData[s].length; });
  var KANA=['ア','イ','ウ','エ','オ','カ'];
  var html='<div class="train-wrap">';
  html+='<div class="train-finisher-cta weak"><button id="weakBack">← 集中トレーニングに もどる</button></div>';
  if(total===0){
    html+='<div class="train-card" style="text-align:center"><h2 style="margin:6px 0">🎉 弱点 ぜんぶ 克服！</h2><div class="fin-msg">できなかった問題を ぜんぶ 正解にできたね！もう バッチリ！</div><div class="train-next"><button id="weakDone">これでいくぞ！へ →</button></div></div></div>';
    main.innerHTML=html; _rubyMode='std';
    document.getElementById('weakBack').onclick=weakExit; document.getElementById('weakDone').onclick=weakExit; return;
  }
  if(!(weakData[trainState.subj]||[]).length) trainState.subj=weakSubjs[0];
  // 1画面で5科目の苦手を表示
  html+='<div class="wk-banner"><span class="wk-title">💪 5科目集中 弱点克服</span><div class="wk-chips">';
  weakSubjs.forEach(function(s){ var nm=(TRAIN_DATA[s]&&TRAIN_DATA[s].name)||(SUBJECTS[s]&&SUBJECTS[s].name)||s; html+='<button class="wk-chip'+(s===trainState.subj?' on':'')+'" data-wksubj="'+s+'">'+nm+' '+weakData[s].length+'</button>'; });
  html+='</div></div>';
  var arr=weakData[trainState.subj]; var it=arr[0];
  var subjName=(TRAIN_DATA[trainState.subj]&&TRAIN_DATA[trainState.subj].name)||(SUBJECTS[trainState.subj]&&SUBJECTS[trainState.subj].name)||trainState.subj;

function genMath(){

    var d=1; while(set.length<4){ [correct+d,correct-d].forEach(function(w){ if(set.indexOf(w)<0&&set.length<4) set.push(w); }); d++; }

var _relPoolCache={};
function releasePool(subj){
  if(_relPoolCache[subj]) return _relPoolCache[subj];
  var curated=[]; trainBaseCats(subj).forEach(function(c){ (c.items||[]).forEach(function(it){ curated.push({it:it, cat:c.name}); }); });
  var gen=genQuestions(subj);
  var raw;
  if(gen.length){
    // 手作り（これでいくぞ/必殺の内容）は約1割、残り9割は自動生成の類似別問題
    var nCur=Math.max(2, Math.round(gen.length/9));
    var curPick=mockSeededShuffle(curated, 555).slice(0, nCur);
    raw = curPick.concat(gen);
  } else {
    raw = curated;
  }
  // テキストで重複除去（同じ問題が2回出ないように）
  var seen={}, pool=[];
  raw.forEach(function(x){ var k=(x.it.ja||x.it.prompt); if(k && !seen[k]){ seen[k]=1; pool.push(x); } });

function buildReleaseTest(pattern){

  }
  var subjs=scopeSubjs();
  if(subjs.length===1){
    // 1科目: 大量プール（手作り＋自動生成）を固定順シャッフル → 各パターン重複なし（20問）。大問＝項目
    var subj=subjs[0]; var cats=trainBaseCats(subj);

    var shuffled=mockSeededShuffle(releasePool(subj), 7777);

    for(var i=0;i<size;i++){ slice.push(shuffled[(start+i)%shuffled.length]); }
    slice.sort(function(a,b){ return (catIdx[a.cat]==null?99:catIdx[a.cat])-(catIdx[b.cat]==null?99:catIdx[b.cat]); });
    slice.forEach(function(s){ pushItem(subj, s.cat, s.it); });
  } else {
    // 総合: 科目ごとに大量プールを固定順シャッフル → 各パターン4問（被りゼロ）。大問＝科目
    subjs.forEach(function(subj,si){
      var snm=(TRAIN_DATA[subj]&&TRAIN_DATA[subj].name)||(SUBJECTS[subj]&&SUBJECTS[subj].name)||subj;

var SR_OK = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
var _srActive=null;
function normEn(s){ return (s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
function speechMatch(said, target){
  var a=normEn(said), b=normEn(target);
  if(!a||!b) return false;
  if(a===b) return true;
  var setA={}; a.split(' ').forEach(function(w){ setA[w]=1; });
  var bw=b.split(' '), hit=0; bw.forEach(function(w){ if(setA[w]) hit++; });
  return bw.length ? (hit/bw.length >= 0.6) : false;
}
var _srBusy=false;
function recognizeEnglish(target, btn, cb){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ cb(null,false,'unsupported'); return; }
  if(_srBusy){ return; } // 多重起動を防ぐ（前の認識が終わるまで無視）
  var r; try{ r=new SR(); }catch(e){ cb(null,false,'init'); return; }
  _srBusy=true; _srActive=r;
  r.lang='en-US'; r.interimResults=false; r.maxAlternatives=3; r.continuous=false;
  if(btn){ btn.classList.add('listening'); btn.textContent='🎤 聞いています…'; }
  var best='', ok=false, errCode=null, finished=false;
  var watchdog=setTimeout(function(){ try{ r.stop(); }catch(e){} }, 8000);
  r.onresult=function(e){ var res=e.results[0];
    for(var i=0;i<res.length;i++){ var t=res[i].transcript; if(!best) best=t; if(speechMatch(t,target)){ ok=true; best=t; break; } }
  };
  r.onerror=function(ev){ errCode=(ev&&ev.error)||'error'; };
  r.onend=function(){
    clearTimeout(watchdog);
    if(btn) btn.classList.remove('listening');
    _srBusy=false; _srActive=null;
    if(finished) return; finished=true;
    cb(best||null, ok, best? null : (errCode||'noresult'));
  };
  try{ r.start(); }catch(e){ clearTimeout(watchdog); _srBusy=false; _srActive=null; if(btn) btn.classList.remove('listening'); cb(null,false,'start'); }
}

var JP_REGION = {
  hokkaido:'hokkaido',
  aomori:'tohoku',iwate:'tohoku',miyagi:'tohoku',akita:'tohoku',yamagata:'tohoku',fukushima:'tohoku',
  ibaraki:'kanto',tochigi:'kanto',gunma:'kanto',saitama:'kanto',chiba:'kanto',tokyo:'kanto',kanagawa:'kanto',
  niigata:'chubu',toyama:'chubu',ishikawa:'chubu',fukui:'chubu',yamanashi:'chubu',nagano:'chubu',gifu:'chubu',shizuoka:'chubu',aichi:'chubu',
  mie:'kinki',shiga:'kinki',kyoto:'kinki',osaka:'kinki',hyogo:'kinki',nara:'kinki',wakayama:'kinki',
  tottori:'chugoku',shimane:'chugoku',okayama:'chugoku',hiroshima:'chugoku',yamaguchi:'chugoku',
  tokushima:'shikoku',kagawa:'shikoku',ehime:'shikoku',kochi:'shikoku',
  fukuoka:'kyushu',saga:'kyushu',nagasaki:'kyushu',kumamoto:'kyushu',oita:'kyushu',miyazaki:'kyushu',kagoshima:'kyushu',okinawa:'kyushu'
};
var JP_REGION_NAME = {hokkaido:'北海道',tohoku:'東北',kanto:'関東',chubu:'中部',kinki:'近畿',chugoku:'中国',shikoku:'四国',kyushu:'九州'};
var jmapState = { mode:'view', queue:[], idx:0, correct:0, wrong:0, revealed:false, lastOk:false, capInput:'', _wrongPid:null, sel:null };
function jmapModeBarHtml(){
  return '<div class="jmap-modebar">' +
    '<button class="jmap-modebtn'+(jmapState.mode==='view'?' on':'')+'" data-jm="view">🗺 ぜんぶ見る</button>' +
    '<button class="jmap-modebtn'+(jmapState.mode==='find'?' on':'')+'" data-jm="find">🗾 県さがし</button>' +
    '<button class="jmap-modebtn'+(jmapState.mode==='cap'?' on':'')+'" data-jm="cap">🏛 県庁所在地</button>' +
    '</div>';
}
function jmapBindModeBar(main){
  main.querySelectorAll('.jmap-modebtn').forEach(function(b){
    b.onclick=function(){ jmapState.mode=b.dataset.jm; jmapState.sel=null; if(b.dataset.jm!=='view') jmapNewQueue(); renderJapanMap(); };
  });
}
function renderJmapOverview(){
  var main=document.getElementById('main');
  var sel=jmapState.sel;
  var html='<div class="jmap-wrap jmap-wrap-wide">';
  html+=jmapModeBarHtml();
  html+='<div class="jmap-view-hint">地図の県をタップすると、県名と県庁所在地が出るよ。色は8地方区分。</div>';
  if(sel){ var p=JP_PREF[sel]; html+='<div class="jmap-info"><b>'+escapeHtml(p.ja)+'</b><span>県庁所在地：'+escapeHtml(p.cap)+'</span><span class="jmap-info-region">'+JP_REGION_NAME[JP_REGION[sel]]+'地方</span></div>'; }
  else { html+='<div class="jmap-info jmap-info-empty">地図の県をタップしてみよう</div>'; }
  html+='<div class="jmap-svgbox jmap-view">'+buildJpSvgHtml()+'<div class="jmap-credit">地図: © Victor Cazanave (CC BY 4.0)</div></div>';
  html+='</div>';
  main.innerHTML=html;
  var svgEl=main.querySelector('.jp-map-svg');
  if(svgEl){
    svgEl.querySelectorAll('.jp-pref').forEach(function(pth){
      pth.classList.add('reg-'+JP_REGION[pth.dataset.pid]);
      if(pth.dataset.pid===sel) pth.classList.add('jmap-selected');
      pth.onclick=function(){ jmapState.sel=pth.dataset.pid; renderJmapOverview(); };
    });
  }
  jmapBindModeBar(main);
}
function jmapShuffle(arr){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function jmapNewQueue(){ jmapState.queue=jmapShuffle(JP_PREF_IDS); jmapState.idx=0; jmapState.correct=0; jmapState.wrong=0; jmapState.revealed=false; jmapState.lastOk=false; jmapState.capInput=''; jmapState._wrongPid=null; }
function jmapNormCap(s){ return String(s||'').trim().replace(/[市区町村都道府県\s]+$/,''); }
function buildJpSvgHtml(){ return '<svg viewBox="0 0 438 516" class="jp-map-svg" xmlns="http://www.w3.org/2000/svg">' + JP_MAP_PATHS + '</svg>'; }
function renderJapanMap(){
  if(jmapState.mode==='view'){ renderJmapOverview(); return; }
  var main=document.getElementById('main');
  if(!jmapState.queue.length) jmapNewQueue();
  if(jmapState.idx>=jmapState.queue.length){
    main.innerHTML='<div class="jmap-wrap">'+jmapModeBarHtml()+'<div class="jmap-done">🎉 47都道府県ぜんぶ おわり！<br>正解 '+jmapState.correct+' / 47</div><button class="jmap-next" id="jmapRestart">🔁 もう一度</button></div>';
    jmapBindModeBar(main);
    document.getElementById('jmapRestart').onclick=function(){ jmapNewQueue(); renderJapanMap(); }; return;
  }
  var id=jmapState.queue[jmapState.idx]; var pref=JP_PREF[id];
  var html='<div class="jmap-wrap">';
  html+=jmapModeBarHtml();
  html+='<div class="jmap-score">'+jmapState.idx+' / '+jmapState.queue.length+'　正解 '+jmapState.correct+'</div>';
  if(jmapState.mode==='find'){ html+='<div class="jmap-q">次の都道府県を地図でタップしよう<br><b class="jmap-target">'+escapeHtml(pref.ja)+'</b></div>'; }
  else { html+='<div class="jmap-q">地図で紫色にハイライトされた都道府県の<b>県庁所在地</b>はどこ？</div>'; }
  html+='<div class="jmap-svgbox">'+buildJpSvgHtml()+'<div class="jmap-credit">地図: © Victor Cazanave (CC BY 4.0)</div></div>';
  if(jmapState.mode==='cap' && !jmapState.revealed){ html+='<div class="jmap-capinput"><input type="text" id="jmapCapIn" placeholder="県庁所在地を入力（例：横浜市）" value="'+escapeHtml(jmapState.capInput)+'"><button id="jmapCapCheck">答える</button></div>'; }
  if(jmapState.revealed){ html+='<div class="jmap-fb '+(jmapState.lastOk?'ok':'ng')+'">'+(jmapState.lastOk?'○ 正解！':('× 正解は「'+escapeHtml(pref.ja)+(jmapState.mode==='cap'?'（'+escapeHtml(pref.cap)+'）':'')+'」'))+'</div><button class="jmap-next" id="jmapNext">つぎへ →</button>'; }
  html+='</div>';
  main.innerHTML=html;
  var svgEl=main.querySelector('.jp-map-svg');
  if(jmapState.mode==='cap' && svgEl){ var hEl=svgEl.querySelector('[data-pid="'+id+'"]'); if(hEl) hEl.classList.add('jmap-highlight'); }
  if(jmapState.revealed && svgEl){ var tEl=svgEl.querySelector('[data-pid="'+id+'"]'); if(tEl) tEl.classList.add('jmap-ok'); if(jmapState._wrongPid){ var wEl=svgEl.querySelector('[data-pid="'+jmapState._wrongPid+'"]'); if(wEl) wEl.classList.add('jmap-ng'); } }
  jmapBindModeBar(main);
  if(svgEl && jmapState.mode==='find' && !jmapState.revealed){ svgEl.querySelectorAll('.jp-pref').forEach(function(p){ p.onclick=function(){ jmapHandleFindClick(p.dataset.pid); }; }); }
  var capBtn=document.getElementById('jmapCapCheck');
  if(capBtn){ var capInEl=document.getElementById('jmapCapIn'); capInEl.focus(); capInEl.onkeydown=function(e){ if(e.key==='Enter') jmapHandleCapCheck(); }; capBtn.onclick=jmapHandleCapCheck; }
  var nextBtn=document.getElementById('jmapNext');
  if(nextBtn){ nextBtn.onclick=function(){ jmapState.idx++; jmapState.revealed=false; jmapState._wrongPid=null; renderJapanMap(); }; }
}
function jmapHandleFindClick(pid){ if(jmapState.revealed) return; var target=jmapState.queue[jmapState.idx]; jmapState.revealed=true; jmapState.lastOk=(pid===target); jmapState._wrongPid=jmapState.lastOk?null:pid; if(jmapState.lastOk) jmapState.correct++; else jmapState.wrong++; renderJapanMap(); }
function jmapHandleCapCheck(){ if(jmapState.revealed) return; var el=document.getElementById('jmapCapIn'); var val=el?el.value:''; jmapState.capInput=val; var target=jmapState.queue[jmapState.idx]; var pref=JP_PREF[target]; jmapState.revealed=true; jmapState.lastOk=(jmapNormCap(val)!=='' && jmapNormCap(val)===jmapNormCap(pref.cap)); if(jmapState.lastOk) jmapState.correct++; else jmapState.wrong++; renderJapanMap(); }

// ============ Init ============
applyTheme();
loadProgress();
currentSubj = state.subj; // 保存済みの科目を全モードの初期選択に合わせる
loadAllowance();
loadDaily();
shuffleTrainChoices();
hwInit();
render();
// 起動は「📒 期末つみあげ」から。毎日1時間・ロードマップは非表示（期末対策に集中）
document.getElementById('studyGuide').style.display = 'none';
switchMode('yomatsu');
renderRoadmap();
</script>
