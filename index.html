<style>
:root{
  --bg:#0e0f12;
  --paper:#171a1f;
  --paper-2:#1f232a;
  --ink:#eef0f3;
  --muted:#8a8f9a;
  --border:#2a2f38;
  --border-h:#3a414c;
  --accent:#4468ff;
  --accent-d:#0d33ff;
  --ok:#3ed184;
  --ng:#ff5a64;
  --warn:#f0b90b;
  --shadow:rgba(0,0,0,0.4);
}
html.light{
  --bg:#fafaf7;
  --paper:#ffffff;
  --paper-2:#f4f3ef;
  --ink:#15171c;
  --muted:#73798a;
  --border:#e5e4dd;
  --border-h:#cfcec6;
  --accent:#0d33ff;
  --accent-d:#0728c2;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans JP',system-ui,sans-serif;overflow:hidden}
button{font-family:inherit;color:inherit}

.panel-ctrl{position:fixed;top:8px;right:8px;z-index:9999;display:flex;gap:4px;height:30px}
.panel-ctrl button{
  background:transparent;border:1px solid var(--border);border-radius:6px;
  width:28px;height:28px;cursor:pointer;color:var(--muted);
  display:flex;align-items:center;justify-content:center;font-size:14px;
}
.panel-ctrl button:hover{color:var(--ink);background:var(--paper-2);border-color:var(--border-h)}

#root{height:100%;display:flex;flex-direction:column}

/* ===== 1年のロードマップ（テスト時期の選択） ===== */
.roadmap{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:62%}
.rm-title{font-size:9px;letter-spacing:0.15em;color:var(--muted);text-transform:uppercase;margin-right:4px;white-space:nowrap}
.rm-step{
  display:flex;flex-direction:column;align-items:center;line-height:1.15;
  padding:4px 9px;border:1px solid var(--border);border-radius:8px;background:var(--paper);
  cursor:pointer;transition:all .15s;white-space:nowrap;
}
.rm-step .rm-name{font-size:11px;font-weight:600}
.rm-step .rm-month{font-size:8.5px;color:var(--muted)}
.rm-step:hover{border-color:var(--border-h)}
.rm-step.current{background:var(--accent);border-color:var(--accent)}
.rm-step.current .rm-name{color:#fff}
.rm-step.current .rm-month{color:rgba(255,255,255,0.8)}
.rm-step.daily{border-style:dashed;border-color:var(--ok)}
.rm-step.daily .rm-name{color:var(--ok)}
.rm-step.daily.current{background:var(--ok);border-style:solid}
.rm-step.daily.current .rm-name{color:#fff}
.rm-step.locked{opacity:0.55}
.rm-step.locked .rm-name::after{content:' 🔒';font-size:8px}
.rm-arrow{color:var(--muted);font-size:9px}
/* 準備中トースト */
.rm-toast{
  position:fixed;top:14px;left:50%;transform:translateX(-50%);
  background:var(--paper);border:1px solid var(--border-h);border-radius:10px;
  padding:12px 20px;font-size:13px;box-shadow:0 8px 30px var(--shadow);z-index:99999;
  animation:rmToast 2.4s ease forwards;
}
@keyframes rmToast{0%{opacity:0;transform:translate(-50%,-8px)}12%{opacity:1;transform:translate(-50%,0)}82%{opacity:1}100%{opacity:0;transform:translate(-50%,-8px)}}
@media (max-width:900px){ .roadmap{display:none} }

/* ===== 毎日1時間カレンダー ===== */
.daily-wrap{max-width:780px;margin:0 auto;padding:6px 4px 24px}
.daily-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.daily-title{font-size:18px;font-weight:700}
.daily-title em{font-style:normal;color:var(--ok);margin-left:6px;font-size:13px}
.daily-stats{display:flex;gap:14px}
.daily-stat{text-align:center}
.daily-stat b{font-size:20px;color:var(--ok);font-family:'JetBrains Mono',monospace}
.daily-stat span{font-size:9px;color:var(--muted);display:block;letter-spacing:0.1em}
.cal-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px 0}
.cal-nav button{background:var(--paper-2);border:1px solid var(--border);border-radius:6px;width:30px;height:30px;cursor:pointer;color:var(--ink);font-size:14px}
.cal-nav .cal-month{font-size:15px;font-weight:700;min-width:130px;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
/* カレンダー＋RPGの横並び（カレンダーは小さめ） */
.daily-main{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-top:6px}
.daily-cal-col{flex:1 1 330px;min-width:280px}
.daily-cal-col .cal-nav{margin:2px 0 8px}
.daily-cal-col .cal-nav button{width:26px;height:26px;font-size:13px}
.daily-cal-col .cal-nav .cal-month{font-size:13px;min-width:110px}
.daily-cal-col .cal-grid{gap:4px}
.daily-cal-col .cal-cell{font-size:11px;border-radius:6px;gap:1px}
.daily-cal-col .cal-cell .cal-d{font-size:12px}
.daily-cal-col .cal-cell.done .cal-check{font-size:12px}
.daily-cal-col .cal-badge{font-size:7px;padding:1px 3px}
.rpg-col{flex:1 1 210px;min-width:195px;display:flex;flex-direction:column;gap:12px}
.rpg-card{background:linear-gradient(135deg,rgba(124,92,255,0.16),rgba(68,104,255,0.07));border:1px solid var(--border-h);border-radius:12px;padding:13px 15px}
.rpg-card .rc-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rpg-card .rc-badge{width:44px;height:44px;border-radius:11px;background:linear-gradient(135deg,#7c5cff,#4468ff);display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1;color:#fff;flex:0 0 auto;box-shadow:0 3px 10px rgba(124,92,255,.35)}
.rpg-card .rc-badge b{font-size:17px;font-weight:800}
.rpg-card .rc-badge small{font-size:7px;font-weight:600;opacity:.85;letter-spacing:.05em}
.rpg-card .rc-title{font-size:14px;font-weight:700}
.rpg-card .rc-sub{font-size:10px;color:var(--muted)}
.rpg-bar{height:9px;background:var(--paper-2);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.rpg-bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7c5cff,#4cc2ff);border-radius:6px;transition:width .8s ease}
.rpg-exp-txt{font-size:10px;color:var(--muted);margin-top:4px;text-align:right;font-family:'JetBrains Mono',monospace}
.rpg-enemy{background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:12px 15px;text-align:center}
.rpg-enemy .re-label{font-size:10px;color:var(--muted);letter-spacing:.08em;margin-bottom:2px}
.rpg-enemy .re-emoji{font-size:38px;line-height:1;margin:2px 0;transition:filter .4s,opacity .4s}
.rpg-enemy .re-emoji.defeated{filter:grayscale(1);opacity:.35}
.rpg-enemy .re-name{font-size:13px;font-weight:700;margin-bottom:8px}
.rpg-hp{display:flex;align-items:center;gap:6px}
.rpg-hp .hp-tag{font-size:9px;font-weight:800;color:#ff5d5d}
.rpg-hp .rpg-bar{flex:1}
.rpg-hp .rpg-bar > i{background:linear-gradient(90deg,#ff5d5d,#ff9f43);width:100%}
.rpg-hp-txt{font-size:10px;color:var(--muted);margin-top:5px;font-family:'JetBrains Mono',monospace}
.rpg-result{background:linear-gradient(135deg,rgba(124,92,255,0.1),transparent);border:1px solid var(--border-h);border-radius:12px;padding:16px;text-align:center;margin-bottom:14px}
.rpg-result .rr-emoji{font-size:48px;line-height:1;transition:filter .5s,opacity .5s}
.rpg-result .rr-emoji.defeated{filter:grayscale(1);opacity:.35}
.rpg-result .rr-msg{font-size:16px;font-weight:800;margin:8px 0 4px}
.rpg-result .rr-sub{font-size:12px;color:var(--muted)}
.rpg-result .rpg-bar{max-width:240px;margin:10px auto 0}
.rpg-result .rpg-bar > i{background:linear-gradient(90deg,#ff5d5d,#ff9f43)}
.rpg-levelup{color:var(--warn);font-weight:800;font-size:14px;margin-top:8px}
/* === 毎日1時間 新フロー === */
.cal-box{max-width:460px;margin:0 auto}
.daily-flow{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.daily-flow span{background:var(--paper-2);border:1px solid var(--border);border-radius:20px;padding:4px 11px;font-weight:600}
.daily-flow i{color:var(--border-h);font-style:normal;font-size:13px}
/* ① タイムアタック */
.ta-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 2px 8px;margin-bottom:2px;border-bottom:1px solid var(--border)}
.ta-bar-right{display:flex;align-items:center;gap:12px}
.ta-count{font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace;white-space:nowrap}
.ta-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.ta-title{font-size:18px;font-weight:700}
.ta-title em{font-style:normal;color:var(--accent);margin-left:6px;font-size:12px}
.ta-timer{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:800;color:var(--ok);min-width:78px;text-align:center;background:var(--paper-2);border:1px solid var(--border);border-radius:10px;padding:4px 10px}
.ta-timer.urgent{color:#fff;background:#e84c4c;border-color:#e84c4c;animation:taPulse .6s infinite alternate}
@keyframes taPulse{from{transform:scale(1)}to{transform:scale(1.07)}}
.ta-sub{font-size:12px;color:var(--muted);margin-bottom:6px}
.ta-progress{font-size:12px;color:var(--muted);margin-bottom:10px;font-family:'JetBrains Mono',monospace}
.ta-card{background:var(--paper);border:1px solid var(--border-h);border-radius:14px;padding:20px;box-shadow:0 3px 12px var(--shadow);min-height:150px}
.ta-subj{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:6px}
.ta-q{font-size:18px;font-weight:700;margin-bottom:16px;line-height:1.6}
.ta-choices{display:flex;flex-direction:column;gap:8px}
.ta-choices .choice-pill{padding:11px 14px;background:var(--paper-2);border:1px solid var(--border);color:var(--ink);border-radius:8px;cursor:pointer;font-size:15px;text-align:left}
.ta-choices .choice-pill:hover{border-color:var(--accent)}
.ta-choices .choice-pill .kana{font-weight:700;margin-right:8px;color:var(--muted)}
.ta-choices .choice-pill.ta-ok{background:rgba(62,209,132,0.2);border-color:var(--ok);color:var(--ok)}
.ta-choices .choice-pill.ta-ng{background:rgba(232,76,76,0.18);border-color:var(--ng);color:var(--ng)}
.ta-choices .choice-pill:disabled{cursor:default}
.ta-feedback{font-size:15px;font-weight:700;margin-top:12px;min-height:20px;text-align:center}
.ta-feedback.ok{color:var(--ok)} .ta-feedback.ng{color:var(--ng)}
/* ② 復習：正解ロック行・再挑戦・バナー */
.test-row.row-locked{opacity:.62}
.dq-retry{font-size:11px;color:var(--ng);font-weight:700;margin-top:4px}
.daily-banner{border-radius:10px;padding:10px 14px;font-size:13px;font-weight:700;text-align:center;margin-bottom:12px}
.daily-banner.ok{background:rgba(62,209,132,0.15);color:var(--ok);border:1px solid var(--ok)}
.daily-banner.ng{background:rgba(240,185,11,0.12);color:var(--warn);border:1px solid var(--warn)}
/* ② 範囲をえらぶ（単元チップ） */
.unit-group{margin-bottom:12px}
.unit-subj{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:6px}
.unit-chips{display:flex;flex-wrap:wrap;gap:8px}
.unit-chip{padding:7px 14px;background:var(--paper-2);border:1px solid var(--border);color:var(--ink);border-radius:20px;cursor:pointer;font-size:13px;transition:all .12s}
.unit-chip:hover{border-color:var(--accent)}
.unit-chip.on{background:rgba(68,104,255,0.2);border-color:var(--accent);color:var(--accent);font-weight:700}
/* ③ 予習：理解した✓ */
.pv-understand{margin-top:12px;width:100%;padding:9px;font-size:13px;font-weight:700;cursor:pointer;background:var(--paper-2);border:1px dashed var(--border-h);border-radius:8px;color:var(--muted);transition:all .15s}
.pv-understand:hover{border-color:var(--ok);color:var(--ok)}
.pv-understand.on{background:rgba(62,209,132,0.15);border-style:solid;border-color:var(--ok);color:var(--ok)}
/* 🎵 リズムで覚える */
.chant-btn{margin-left:10px;padding:3px 10px;font-size:11px;font-weight:700;border-radius:14px;border:1px solid var(--accent);background:rgba(124,92,255,0.14);color:var(--accent);cursor:pointer;vertical-align:middle;transition:all .15s}
.chant-btn:hover{background:var(--accent);color:#fff}
.chant-overlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.chant-card{position:relative;width:min(92vw,460px);max-height:86vh;overflow:auto;background:linear-gradient(160deg,var(--paper),var(--paper-2));border:1px solid var(--border-h);border-radius:18px;padding:22px 22px 18px;box-shadow:0 12px 40px rgba(0,0,0,0.5);text-align:center}
.chant-close{position:absolute;top:12px;right:14px;background:transparent;border:none;color:var(--muted);font-size:18px;cursor:pointer}
.chant-title{font-size:17px;font-weight:800;margin-bottom:14px}
.chant-title span{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:2px}
.chant-lines{display:flex;flex-direction:column;gap:9px;margin-bottom:16px}
.chant-line{padding:11px 12px;border-radius:10px;background:var(--paper-2);border:1px solid var(--border);font-size:15px;font-weight:600;transition:transform .18s,background .18s,color .18s,box-shadow .18s}
.chant-line.active{background:linear-gradient(90deg,#7c5cff,#4cc2ff);color:#fff;transform:scale(1.06);box-shadow:0 6px 18px rgba(124,92,255,.5);font-weight:800}
.chant-ctrl{display:flex;justify-content:center;gap:10px}
.chant-play{padding:11px 26px;border-radius:24px;border:none;font-size:15px;font-weight:800;cursor:pointer;background:var(--accent);color:#fff;transition:filter .15s}
.chant-play:hover{filter:brightness(1.1)}
.chant-play.stop{background:var(--ng)}
.chant-hint{font-size:11px;color:var(--muted);margin-top:10px}
/* 1個ずつ再生カード（最小ペア＋日本語） */
.chant-rows{display:flex;flex-direction:column;gap:9px;margin-bottom:6px;text-align:left}
.chant-row{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;background:var(--paper-2);border:1px solid var(--border);cursor:pointer;transition:transform .15s,background .15s,box-shadow .15s}
.chant-row:hover{border-color:var(--accent)}
.chant-row.active{background:linear-gradient(90deg,rgba(124,92,255,.22),rgba(76,194,255,.12));border-color:var(--accent);transform:scale(1.03);box-shadow:0 6px 18px rgba(124,92,255,.35)}
.chant-row-play{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:filter .15s}
.chant-row-play:hover{filter:brightness(1.12)}
.chant-row.active .chant-row-play{animation:crPulse .5s infinite alternate}
@keyframes crPulse{from{transform:scale(1)}to{transform:scale(1.12)}}
.chant-row-text{flex:1;min-width:0}
.cr-en{font-size:16px;font-weight:800;letter-spacing:.01em}
.cr-ja{font-size:12px;color:var(--muted);margin-top:2px}
/* 🔥 5科目集中トレーニング */
.mode-train{background:linear-gradient(135deg,#ff8f3d,#ff6b3d)!important;color:#fff!important;border:1px solid transparent!important;font-weight:800!important}
.mode-finisher{background:linear-gradient(135deg,#ff3d77,#c2185b)!important;color:#fff!important;border:1px solid transparent!important;font-weight:800!important}
.mode-matome{background:linear-gradient(135deg,#0aa6a6,#0d7a9c)!important;color:#fff!important;border:1px solid transparent!important;font-weight:800!important}
.mode-yomatsu{background:linear-gradient(135deg,#7c5cff,#a23ca6)!important;color:#fff!important;border:1px solid transparent!important;font-weight:800!important}
.mode-home{background:var(--ok)!important;color:#fff!important;border:1px solid transparent!important;font-weight:800!important;border-radius:9px!important;padding:8px 15px!important;margin-right:10px;border-bottom:2px solid transparent!important}
.mode-home:hover{filter:brightness(1.08)}
.mode-home.active{border-bottom:2px solid transparent!important}
.train-wrap{max-width:680px;margin:0 auto;padding:6px 4px 28px}
.train-subjtabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.train-subjtab{padding:7px 17px;border-radius:20px;border:1px solid var(--border);background:var(--paper-2);color:var(--muted);font-weight:700;cursor:pointer;font-size:13px;transition:all .12s}
.train-subjtab:hover{border-color:var(--accent)}
.train-subjtab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.train-cats{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.train-cat{padding:5px 13px;border-radius:14px;border:1px solid var(--border);background:var(--paper);color:var(--ink);font-size:12px;cursor:pointer;transition:all .12s}
.train-cat:hover{border-color:var(--accent)}
.train-cat.on{background:rgba(68,104,255,.18);border-color:var(--accent);color:var(--accent);font-weight:700}
.train-cursubj{text-align:center;font-size:13px;font-weight:800;color:var(--accent);margin:2px 0 8px}
.train-feedback{font-size:14px;font-weight:800;margin-top:12px;text-align:center}
.train-feedback.ok{color:var(--ok)} .train-feedback.ng{color:var(--ng)}
.train-card{background:var(--paper);border:1px solid var(--border-h);border-radius:16px;padding:20px 22px;box-shadow:0 3px 14px var(--shadow)}
.train-progress{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:10px}
.train-qlabel{font-size:12px;color:var(--accent);font-weight:700;margin-bottom:6px}
.train-prompt{font-size:23px;font-weight:800;line-height:1.55;margin-bottom:18px}
.train-choices{display:flex;flex-direction:column;gap:9px}
.train-choices .tc{padding:12px 15px;border-radius:10px;border:1px solid var(--border);background:var(--paper-2);color:var(--ink);font-size:15px;cursor:pointer;text-align:left;transition:all .12s}
.train-choices .tc:hover{border-color:var(--accent)}
.train-choices .tc .kana{font-weight:700;margin-right:9px;color:var(--muted)}
.train-choices .tc.correct{background:rgba(62,209,132,.2);border-color:var(--ok);color:var(--ok);font-weight:800}
.train-choices .tc.wrong{background:rgba(232,76,76,.18);border-color:var(--ng);color:var(--ng)}
.train-choices .tc.elim{opacity:.32;text-decoration:line-through;pointer-events:none}
.train-choices .tc:disabled{cursor:default}
.train-help{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.train-help button{padding:6px 13px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;transition:all .12s}
.train-help .hint:hover{color:var(--warn);border-color:var(--warn)}
.train-help .special:hover{color:var(--accent);border-color:var(--accent)}
.train-help .ans:hover{color:var(--ok);border-color:var(--ok)}
.train-hintbox{margin-top:10px;font-size:13px;border-radius:8px;padding:9px 12px}
.train-hintbox.hint{background:rgba(240,185,11,.1);color:var(--warn);border:1px solid var(--warn)}
.train-hintbox.special{background:rgba(124,92,255,.1);color:var(--accent);border:1px solid var(--accent)}
.train-expl{margin-top:10px;font-size:13px;line-height:1.75;background:var(--paper-2);border-left:3px solid var(--ok);border-radius:8px;padding:10px 13px;display:none}
.train-expl.show{display:block}
.train-next{margin-top:16px;text-align:center}
.train-next button{padding:11px 32px;border-radius:24px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:800;cursor:pointer;transition:filter .15s}
.train-next button:hover{filter:brightness(1.1)}
/* 💥 必殺テスト CTA */
.train-finisher-cta{text-align:center;margin-bottom:12px}
.train-finisher-cta button{padding:12px 24px;border-radius:14px;border:none;background:linear-gradient(135deg,#ff6b3d,#ff3d77);color:#fff;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(255,61,119,.35);transition:filter .15s}
.train-finisher-cta button:hover{filter:brightness(1.08)}
.train-finisher-cta button small{display:block;font-size:10px;font-weight:600;opacity:.9;margin-top:2px}
.train-finisher-cta.weak button{background:var(--paper-2);color:var(--muted);box-shadow:none;border:1px solid var(--border);font-size:13px;padding:8px 18px}
.fin-top{margin-bottom:12px}
.fin-bar{height:8px;background:var(--paper-2);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.fin-bar>i{display:block;height:100%;background:linear-gradient(90deg,#ff6b3d,#ff3d77);transition:width .3s}
.fin-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-top:5px}
.fin-subj{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:8px}
.fin-score{font-size:40px;font-weight:800;color:var(--accent);font-family:'JetBrains Mono',monospace;margin:8px 0 2px}
.fin-pct{font-size:14px;color:var(--muted);margin-bottom:12px}
.fin-rrows{max-width:280px;margin:0 auto 8px}
.fin-rrow{display:flex;justify-content:space-between;padding:6px 12px;border-bottom:1px dashed var(--border);font-size:13px}
.fin-rrow b{font-family:'JetBrains Mono',monospace;color:var(--ok)}
.fin-msg{font-size:14px;font-weight:700;margin-top:10px}
/* 💪 弱点克服 */
.wk-banner{background:linear-gradient(135deg,rgba(255,107,61,.12),rgba(255,61,119,.08));border:1px solid var(--border-h);border-radius:12px;padding:11px 14px;margin-bottom:14px;text-align:center}
.wk-title{font-size:13px;font-weight:800;color:#ff6b3d;display:block;margin-bottom:8px}
.wk-chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.wk-chip{padding:6px 13px;border-radius:16px;border:1px solid var(--border);background:var(--paper-2);color:var(--ink);font-size:12px;font-weight:700;cursor:pointer;transition:all .12s}
.wk-chip:hover{border-color:#ff6b3d}
.wk-chip.on{background:linear-gradient(135deg,#ff6b3d,#ff3d77);border-color:transparent;color:#fff}
/* ⚡ このまま行こうぜ！＝実力解放テスト */
.mode-release{background:linear-gradient(135deg,#ffb300,#ff7043)!important;color:#1b1b1b!important;border:1px solid transparent!important;font-weight:800!important}
/* 🎯 中間集中モード（3分類だけ表示） */
.focus-toggle-btn{padding:6px 14px;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:13px;font-weight:800;cursor:pointer;margin-right:8px;transition:all .15s}
.focus-toggle-btn:hover{background:var(--accent);color:#fff}
#root.focus-mode .focus-toggle-btn{background:linear-gradient(135deg,#ff3d77,#ff6b3d);color:#fff;border-color:transparent}
#root.focus-mode #subjTabs{display:none}
#root.focus-mode #guideStart{display:none}
#root.focus-mode #studyGuide{display:none}
#root.focus-mode .mode-btn[data-mode="learn"],
#root.focus-mode .mode-btn[data-mode="test"],
#root.focus-mode .mode-btn[data-mode="summary"],
#root.focus-mode .mode-btn[data-mode="cards"],
#root.focus-mode .mode-btn[data-mode="mock"]{display:none}
.exam-submit{padding:12px 30px;border-radius:6px;border:none;background:#1b1b1b;color:#fcfbf6;font-size:15px;font-weight:800;cursor:pointer;transition:background .15s}
.exam-submit:hover{background:#000}
.exam-paper .choice-pill.gr-correct{background:#e3f4e6!important;border-color:#2e7d32!important;color:#1b5e20!important;font-weight:700}
.exam-paper .choice-pill.gr-wrong{background:#fce4e6!important;border-color:#c62828!important;color:#b71c1c!important}
.exam-mk{font-size:12px;margin-top:6px;font-weight:700}
.rel-modes{display:flex;gap:10px;justify-content:center;max-width:780px;margin:0 auto 12px}
.rel-mode{padding:10px 20px;border-radius:10px;border:1px solid var(--border);background:var(--paper-2);color:var(--muted);font-size:14px;font-weight:800;cursor:pointer;transition:all .12s}
.rel-mode:hover{border-color:var(--accent)}
.rel-mode.on{background:var(--accent);border-color:var(--accent);color:#fff}
.rel-mode.on.fix{background:linear-gradient(135deg,#2e9e54,#1e7d40)}
.cal-wd{text-align:center;font-size:11px;color:var(--muted);padding:4px 0;font-weight:600}
.cal-wd.sun{color:var(--ng)} .cal-wd.sat{color:var(--accent)}
.cal-cell{
  aspect-ratio:1;border:1px solid var(--border);border-radius:8px;background:var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:13px;position:relative;
}
.cal-cell.empty{border:none;background:transparent}
.cal-cell.done{background:rgba(62,209,132,0.18);border-color:var(--ok)}
.cal-cell.done .cal-check{color:var(--ok);font-size:15px;line-height:1}
.cal-cell.today{border-color:var(--accent);border-width:2px;box-shadow:0 0 0 2px rgba(68,104,255,0.2)}
.cal-cell.future{opacity:0.45}
.cal-cell .cal-d{font-weight:600}
.cal-cell .cal-tag{font-size:8px;color:var(--muted)}
.daily-today{
  margin-top:18px;background:var(--paper);border:1px solid var(--border);border-radius:12px;
  padding:18px 20px;text-align:center;box-shadow:0 3px 12px var(--shadow);
}
.daily-today .dt-date{font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.daily-today .dt-menu{font-size:16px;font-weight:600;margin:8px 0 4px}
.daily-today .dt-menu b{color:var(--ok)}
.daily-today .dt-sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.daily-done-btn{
  padding:12px 30px;background:var(--ok);color:#fff;border:none;border-radius:10px;
  font-size:15px;font-weight:700;cursor:pointer;transition:all .15s;
}
.daily-done-btn:hover{filter:brightness(1.08)}
.daily-done-btn.completed{background:var(--paper-2);color:var(--ok);border:1px solid var(--ok);cursor:default}
/* わからないトグル */
.dq-unknown{
  margin-top:4px;width:fit-content;padding:3px 10px;font-size:11px;cursor:pointer;
  background:transparent;border:1px dashed var(--border-h);border-radius:5px;color:var(--muted);transition:all .15s;
}
.dq-unknown:hover{color:var(--warn);border-color:var(--warn)}
.dq-unknown.on{background:rgba(240,185,11,0.15);border-style:solid;border-color:var(--warn);color:var(--warn)}
/* 予習カード（調べて予習） */
.pv-card{background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:0 2px 8px var(--shadow)}
.pv-subj{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:8px}
.pv-subj .pv-tag{font-size:10px;background:var(--accent);color:#fff;border-radius:4px;padding:1px 6px;margin-right:6px}
.pv-point{background:var(--paper-2);border-left:4px solid var(--accent);border-radius:6px;padding:10px 12px;font-size:13px;line-height:1.8;margin-bottom:10px}
.pv-point .pp-label{font-size:10px;color:var(--muted);font-weight:600;display:block;margin-bottom:3px}
.pv-q{font-size:13px;font-weight:600;margin:10px 0 8px}
.pv-hint-btn{background:transparent;border:1px solid var(--border);border-radius:5px;padding:3px 10px;font-size:11px;cursor:pointer;color:var(--muted);margin-bottom:8px}
.pv-hint-btn:hover{color:var(--warn);border-color:var(--warn)}
.pv-hint{font-size:12px;color:var(--warn);background:rgba(240,185,11,0.08);border-radius:5px;padding:6px 10px;margin-bottom:8px}
.pv-mark{font-size:12px;margin-top:6px;font-weight:600}
.pv-mark.ok{color:var(--ok)} .pv-mark.ng{color:var(--ng)}
/* 予習カード内の選択肢（テーマ準拠のダークスタイル） */
.pv-card .choice-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pv-card .choice-pill{padding:7px 12px;background:var(--paper-2);border:1px solid var(--border);color:var(--ink);border-radius:6px;cursor:pointer;font-size:13px;transition:all .12s}
.pv-card .choice-pill:hover{border-color:var(--accent)}
.pv-card .choice-pill.sel{background:rgba(68,104,255,0.2);border-color:var(--accent);color:var(--accent)}
.pv-card .choice-pill .kana{font-weight:700;margin-right:5px;color:var(--muted)}
/* 教科書ふうの段階解説 */
.pv-lesson{margin-bottom:12px}
.pv-step{background:var(--paper-2);border-radius:8px;padding:10px 13px;margin-bottom:8px;border-left:3px solid var(--border-h)}
.pv-step .ps-h{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:4px}
.pv-step .ps-b{font-size:13px;line-height:1.85}
.pv-ex{background:rgba(68,104,255,0.06);border:1px dashed var(--accent);border-radius:8px;padding:9px 12px;font-size:12.5px;line-height:1.8;margin-bottom:6px}
.pv-ex .pe-label{font-size:10px;color:var(--accent);font-weight:700;display:block;margin-bottom:2px}
.pv-solve{display:flex;align-items:center;gap:8px;margin:14px 0 8px;color:var(--ok);font-size:13px;font-weight:700}
.pv-solve::before,.pv-solve::after{content:'';flex:1;height:1px;background:var(--border)}
/* カレンダー：試験日・開始日バッジ */
.cal-cell.exam-day{background:rgba(232,76,76,0.14);border-color:var(--ng)}
.cal-cell.start-day{background:rgba(68,104,255,0.12);border-color:var(--accent)}
.cal-badge{font-size:8px;font-weight:700;line-height:1;padding:1px 4px;border-radius:3px;color:#fff}
.cal-badge.exam{background:var(--ng)} .cal-badge.start{background:var(--accent)}

/* ===== 科目行 + ステータス（同じ行） ===== */
.subj-row{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  border-bottom:1px solid var(--border);background:var(--paper-2);
  padding:8px 16px;
}
.subj-row .subj-tabs{border-bottom:none;background:transparent;padding:0;flex-shrink:1;flex-wrap:wrap}
.status-band{
  display:flex;align-items:center;gap:14px;flex-shrink:0;
}
.hdr-coin{
  display:flex;align-items:center;gap:8px;position:relative;
  background:linear-gradient(135deg,#7c5cff,#4468ff);
  color:#fff;border-radius:22px;padding:6px 16px;
  box-shadow:0 3px 10px rgba(99,102,241,0.4);
  font-family:'JetBrains Mono',monospace;white-space:nowrap;
}
.hdr-coin .coin-ico{font-size:20px;line-height:1}
.hdr-coin .coin-label{font-size:11px;font-weight:700;letter-spacing:0.08em;opacity:0.85}
.hdr-coin .coin-val{font-size:18px;font-weight:700}
.hdr-coin .coin-val b{font-size:20px}
.hdr-coin.pop{animation:coinPop .45s ease}
@keyframes coinPop{0%{transform:scale(1)}35%{transform:scale(1.15) rotate(-2deg)}100%{transform:scale(1) rotate(0)}}
.coin-float{
  position:absolute;top:-2px;right:14px;color:#7c5cff;font-weight:700;
  font-size:15px;pointer-events:none;animation:coinFloat 1s ease forwards;
  text-shadow:0 1px 3px rgba(0,0,0,0.25);font-family:'JetBrains Mono',monospace;
}
.coin-float.lose{color:#ff5a64}
@keyframes coinFloat{0%{opacity:0;transform:translateY(2px) scale(0.8)}25%{opacity:1;transform:translateY(-6px) scale(1.1)}100%{opacity:0;transform:translateY(-34px) scale(1)}}
.status-band .hdr-right{gap:18px}
.status-band .hdr-stat b{font-size:18px}
.status-band .hdr-stat span{font-size:9px}
.coin-milestone{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:linear-gradient(135deg,#7c5cff,#4468ff);color:#fff;
  font-weight:700;font-size:22px;padding:18px 36px;border-radius:16px;
  box-shadow:0 8px 40px rgba(99,102,241,0.55);z-index:99999;pointer-events:none;
  animation:milestonePop 1.8s ease forwards;font-family:'JetBrains Mono',monospace;
}
@keyframes milestonePop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(0.6)}
  15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
  30%{transform:translate(-50%,-50%) scale(1)}
  80%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-60%) scale(0.95)}
}

/* ===== RIGHT SIDEBAR (LENS + Browser) ===== */
#rootWrap{flex:1;display:flex;overflow:hidden;min-height:0}
#rootMain{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
#sidePanel{
  width:380px;min-width:380px;height:100%;border-left:1px solid var(--border);
  display:flex;flex-direction:column;background:var(--bg);overflow:hidden;
}
.side-tabs{
  display:flex;background:var(--paper);flex-shrink:0;
}
.side-tab{
  flex:1;padding:8px 0;cursor:pointer;font-size:11px;font-weight:600;color:var(--muted);
  border:none;border-bottom:2px solid transparent;background:transparent;
  text-align:center;transition:all .15s;letter-spacing:0.05em;
}
.side-tab:hover{color:var(--ink)}
.side-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.side-content{flex:1;overflow:hidden;position:relative}
.side-pane{position:absolute;inset:0;display:none;flex-direction:column}
.side-pane.active{display:flex}
#sideBrowser{width:100%;height:100%;border:none;background:#fff}
#sideLens{flex:1;display:flex;flex-direction:column;overflow:hidden}
.lens-intro{padding:12px 12px 4px;font-size:12.5px;line-height:1.7;color:var(--muted);flex-shrink:0}
/* 入力欄は上部固定。返答は入力欄の真下に表示（視線が下に逸れない） */
.lens-messages{padding:4px 12px 12px;display:flex;flex-direction:column;gap:10px;flex:1;overflow-y:auto}
.lens-msg{
  padding:10px 12px;border-radius:8px;font-size:12.5px;line-height:1.7;
  max-width:95%;word-wrap:break-word;
}
.lens-msg.user{
  background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:2px;
}
.lens-msg.ai{
  background:var(--paper);border:1px solid var(--border);align-self:flex-start;
  border-bottom-left-radius:2px;
}
.lens-msg.ai.loading{color:var(--muted);font-style:italic}
.lens-input-bar{
  display:flex;gap:6px;padding:6px 12px 8px;flex-shrink:0;
}
.lens-input-bar input{
  flex:1;padding:8px 10px;background:var(--paper-2);border:1px solid var(--border);
  border-radius:6px;color:var(--ink);font-size:12px;font-family:inherit;
}
.lens-input-bar input:focus{outline:none;border-color:var(--accent)}
.lens-input-bar button{
  padding:6px 12px;background:var(--accent);color:#fff;border:none;
  border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;
}
.lens-input-bar button:hover{background:var(--accent-d)}
.side-url-bar{
  display:flex;gap:4px;padding:6px 8px;border-bottom:1px solid var(--border);
  background:var(--paper);flex-shrink:0;align-items:center;
}
.side-url-bar input{
  flex:1;padding:5px 8px;background:var(--paper-2);border:1px solid var(--border);
  border-radius:4px;color:var(--ink);font-size:11px;font-family:'JetBrains Mono',monospace;
}
.side-url-bar input:focus{outline:none;border-color:var(--accent)}
.side-url-bar button{
  width:26px;height:26px;background:transparent;border:1px solid var(--border);
  border-radius:4px;cursor:pointer;color:var(--muted);font-size:12px;
  display:flex;align-items:center;justify-content:center;
}
.side-url-bar button:hover{color:var(--ink);border-color:var(--border-h)}

.hdr{
  padding:16px 20px 10px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:flex-end;gap:16px;
}
.hdr-left{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.3em;color:var(--muted);text-transform:uppercase}
.title{font-family:'Fraunces',serif;font-size:24px;font-weight:600;letter-spacing:-0.01em;line-height:1}
.title em{font-style:italic;color:var(--muted);font-weight:400;margin-left:8px;font-size:18px}
.hdr-right{display:flex;gap:12px;align-items:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)}
.hdr-stat{display:flex;flex-direction:column;align-items:flex-end}
.hdr-stat b{font-size:16px;color:var(--ink);font-weight:600;line-height:1}
.hdr-stat span{font-size:9px;letter-spacing:0.18em;text-transform:uppercase;margin-top:2px}

.subj-tabs{
  display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border);
  background:var(--paper-2);
}
.subj-tab{
  padding:8px 18px;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);
  border:1px solid var(--border);border-radius:8px;background:var(--paper);
  transition:all .15s;display:flex;align-items:center;gap:6px;
}
.subj-tab:hover{color:var(--ink);border-color:var(--border-h)}
.subj-tab.active{
  color:#fff;background:var(--accent);border-color:var(--accent);
  box-shadow:0 2px 8px rgba(68,104,255,0.3);
}
.subj-tab .glyph{font-size:15px;opacity:0.85}
.subj-tab.active .glyph{opacity:1}

.lv-bar{
  display:flex;gap:8px;padding:12px 20px;border-bottom:1px solid var(--border);
  align-items:center;flex-wrap:wrap;
}
.lv-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.2em;color:var(--muted);text-transform:uppercase;margin-right:4px}
.lv-btn{
  padding:6px 12px;border:1px solid var(--border);border-radius:6px;
  background:var(--paper);cursor:pointer;font-size:12px;font-weight:500;
  display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px;
  transition:all .15s;position:relative;
}
.lv-btn:hover{border-color:var(--border-h)}
.lv-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.lv-btn.done{border-color:var(--ok)}
.lv-btn small{font-family:'JetBrains Mono',monospace;font-size:9px;opacity:0.7;letter-spacing:0.08em}
.lv-btn.active small{opacity:0.9}

.main{flex:1;overflow-y:auto;padding:24px 20px;display:flex;flex-direction:column;align-items:center;gap:16px}
.intro{
  max-width:600px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7;
  padding:0 8px;
}
.intro b{color:var(--ink);font-weight:600;font-size:14px}

.card{
  width:100%;max-width:640px;
  background:var(--paper);border:1px solid var(--border);border-radius:10px;
  padding:28px 24px;box-shadow:0 4px 12px var(--shadow);
}
.card .q-meta{
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.2em;
  color:var(--muted);text-transform:uppercase;margin-bottom:10px;
  display:flex;justify-content:space-between;align-items:center;
}
.q-meta .progress{display:flex;gap:3px}
.q-meta .progress span{
  width:14px;height:5px;border-radius:2px;background:var(--border);
}
.q-meta .progress span.ok{background:var(--ok)}
.q-meta .progress span.ng{background:var(--ng)}
.q-meta .progress span.cur{background:var(--accent)}

.card .q-text{
  font-size:17px;line-height:1.7;font-weight:500;margin:8px 0 18px;
  white-space:pre-wrap;
}

.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{
  padding:14px 16px;background:var(--paper-2);border:1px solid var(--border);
  border-radius:8px;cursor:pointer;text-align:left;font-size:14px;line-height:1.4;
  transition:all .12s;display:flex;align-items:center;gap:10px;
}
.choice:hover{border-color:var(--accent);background:var(--paper)}
.choice .lbl{
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;
  width:22px;height:22px;border-radius:50%;background:var(--border);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.choice.correct{border-color:var(--ok);background:rgba(62,209,132,0.12)}
.choice.correct .lbl{background:var(--ok);color:#fff}
.choice.wrong{border-color:var(--ng);background:rgba(255,90,100,0.12)}
.choice.wrong .lbl{background:var(--ng);color:#fff}
.choice.disabled{cursor:default;opacity:0.55}

.feedback{
  margin-top:16px;padding:14px 16px;border-radius:8px;font-size:13px;line-height:1.7;
  display:none;
}
.feedback.show{display:block}
.feedback.ok{background:rgba(62,209,132,0.1);border-left:3px solid var(--ok)}
.feedback.ng{background:rgba(255,90,100,0.1);border-left:3px solid var(--ng)}
.feedback b{font-weight:600}
.feedback .expl{margin-top:6px;color:var(--muted);font-size:12.5px;line-height:1.7}

.fb-tools{
  display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;
  padding-top:10px;border-top:1px dashed var(--border);
}
.fb-tool{
  padding:5px 10px;background:var(--paper-2);border:1px solid var(--border);
  border-radius:6px;font-size:11px;cursor:pointer;color:var(--muted);
  display:inline-flex;align-items:center;gap:5px;transition:all .15s;
}
.fb-tool:hover{color:var(--ink);border-color:var(--accent);background:var(--paper)}
.fb-tool .ico{font-size:12px}

.actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.btn{
  padding:8px 16px;background:var(--paper-2);border:1px solid var(--border);border-radius:6px;
  cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;
}
.btn:hover{border-color:var(--border-h)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-d);border-color:var(--accent-d)}
.btn:disabled{opacity:0.4;cursor:not-allowed}

.result{
  width:100%;max-width:600px;
  background:var(--paper);border:1px solid var(--border);border-radius:10px;
  padding:32px 24px;text-align:center;box-shadow:0 4px 12px var(--shadow);
}
.result h2{font-family:'Fraunces',serif;font-size:28px;margin-bottom:6px;font-weight:600}
.result .score{
  font-family:'JetBrains Mono',monospace;font-size:48px;font-weight:600;color:var(--accent);
  margin:14px 0;letter-spacing:-0.02em;
}
.result .msg{font-size:14px;color:var(--muted);line-height:1.7;margin-bottom:20px}
.result .msg b{color:var(--ink);font-weight:600}
.result .actions{justify-content:center}

/* ===== MODE TOGGLE ===== */
.mode-toggle{
  display:flex;gap:0 4px;padding:6px 20px;background:var(--paper);border-bottom:1px solid var(--border);
  flex-wrap:wrap;align-items:center;
}
.mode-group{
  display:flex;align-items:center;gap:0;margin:3px 10px 3px 0;padding-right:12px;
  border-right:1px dashed var(--border);
}
.mode-group:last-child{border-right:none;padding-right:0;margin-right:0}
.mode-group-label{
  font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.03em;
  margin-right:8px;white-space:nowrap;opacity:.7;
}
.mode-btn{
  padding:9px 16px;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);
  border:none;border-bottom:2px solid transparent;background:transparent;
  transition:all .15s;letter-spacing:0.05em;border-radius:7px 7px 0 0;
}
.mode-btn:hover{color:var(--ink)}
.mode-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.guide-start-btn{
  align-self:center;margin-right:16px;cursor:pointer;font-size:12px;font-weight:600;
  background:var(--paper-2);border:1px solid var(--border);border-radius:16px;
  padding:5px 14px;color:var(--muted);transition:all .15s;
}
.guide-start-btn:hover{color:var(--accent);border-color:var(--accent)}
.guide-start-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* 今日の勉強順ナビ */
.study-guide{display:none}
.study-guide.show{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 20px;border-bottom:1px solid var(--border);
  background:linear-gradient(90deg,rgba(124,92,255,0.12),rgba(68,104,255,0.06));
}
.guide-title{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:0.08em;white-space:nowrap}
.guide-steps{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.guide-step{
  display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:16px;
  background:var(--paper);border:1px solid var(--border);cursor:pointer;
  font-size:12px;font-weight:600;color:var(--muted);transition:all .15s;
}
.guide-step:hover{border-color:var(--border-h);color:var(--ink)}
.guide-step.current{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 8px rgba(68,104,255,0.3)}
.guide-step.done{border-color:var(--ok);color:var(--ok)}
.guide-step .gstep-no{font-family:'JetBrains Mono',monospace;font-size:10px;opacity:0.8}
.guide-arrow{color:var(--muted);font-size:11px}
.guide-next{
  margin-left:auto;cursor:pointer;font-size:12px;font-weight:700;
  background:var(--accent);color:#fff;border:none;border-radius:16px;padding:6px 16px;
  transition:all .15s;white-space:nowrap;
}
.guide-next:hover{background:var(--accent-d)}
.guide-done-msg{margin-left:auto;font-size:12px;font-weight:700;color:var(--ok);white-space:nowrap}
.guide-close{
  background:transparent;border:none;color:var(--muted);font-size:16px;cursor:pointer;
  width:24px;height:24px;border-radius:6px;flex-shrink:0;
}
.guide-close:hover{color:var(--ink);background:var(--paper-2)}

/* ===== TEST MODE ===== */
.test-timer{
  font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:600;
  color:var(--accent);letter-spacing:-0.02em;
}
.test-timer.warn{color:var(--warn)}
.test-timer.danger{color:var(--ng);animation:pulse 1s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}

.test-set-bar{
  display:flex;gap:8px;padding:12px 20px;border-bottom:1px solid var(--border);
  align-items:center;flex-wrap:wrap;
}
.test-set-btn{
  padding:6px 14px;border:1px solid var(--border);border-radius:6px;
  background:var(--paper);cursor:pointer;font-size:12px;font-weight:500;
  transition:all .15s;
}
.test-set-btn:hover{border-color:var(--border-h)}
.test-set-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.test-set-btn.rel-clear{border-color:#3ed184}
.test-set-btn.rel-clear small{color:#3ed184;font-weight:700}
.test-set-btn.rel-all{border-color:#e0a800;box-shadow:0 0 0 1px #e0a800 inset}
.test-set-btn.rel-all small{color:#e0a800;font-weight:800}
.test-set-btn.active small{color:#fff!important}
/* 仕上げ：読む */
.read-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid #ccc;border-radius:8px;background:#fff;margin:7px 0}
.read-row.done{border-color:#3ed184;background:rgba(62,209,132,0.12)}
.read-txt{flex:1 1 auto;min-width:0}
.read-jp{font-size:14px;color:#1b1b1b}
.read-en{font-size:15px;font-weight:800;color:#0d33ff;margin-top:2px}
.read-btns{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.read-play{padding:9px 16px;border:none;border-radius:20px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer;font-size:13px;transition:filter .15s;white-space:nowrap}
.read-play:hover{filter:brightness(1.1)}
.read-play.playing{filter:brightness(1.25)}
.read-mic{padding:9px 16px;border:none;border-radius:20px;background:#ff3d77;color:#fff;font-weight:800;cursor:pointer;font-size:13px;transition:filter .15s;white-space:nowrap}
.read-mic:hover{filter:brightness(1.1)}
.read-mic.done{background:#3ed184}
@keyframes micpulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.4)}}
.read-mic.listening{animation:micpulse .9s infinite}
.read-heard{margin-top:5px;font-size:12px;color:#666}
.read-heard.ok{color:#2e7d32;font-weight:700}
.read-heard.ng{color:#c62828}

/* テストシート: 左=問題 右=回答 */
.test-sheet{width:100%;max-width:900px}
.test-row{
  display:grid;grid-template-columns:1fr 1fr;gap:0;
  border-bottom:1px solid var(--border);min-height:56px;
}
.test-row:first-child{border-top:1px solid var(--border)}
.test-q{
  padding:12px 14px;display:flex;align-items:flex-start;gap:8px;
  font-size:13px;line-height:1.6;border-right:1px solid var(--border);
}
.test-q .num{
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;
  color:var(--accent);min-width:20px;flex-shrink:0;padding-top:2px;
}
.test-q .hint-btn{
  flex-shrink:0;background:none;border:1px solid var(--border);border-radius:4px;
  width:24px;height:24px;cursor:pointer;color:var(--muted);font-size:13px;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
  margin-left:auto;
}
.test-q .hint-btn:hover{color:var(--warn);border-color:var(--warn)}
.test-q .hint-btn.open{color:var(--warn);border-color:var(--warn);background:rgba(240,185,11,0.1)}
.test-hint{
  font-size:11px;color:var(--warn);margin-top:6px;padding:4px 8px;
  background:rgba(240,185,11,0.08);border-radius:4px;display:none;
  line-height:1.5;
}
.test-hint.show{display:block}

.test-a{
  padding:10px 12px;display:flex;flex-direction:column;justify-content:center;gap:4px;
}
.test-a input[type="text"]{
  width:100%;padding:8px 10px;background:var(--paper-2);border:1px solid var(--border);
  border-radius:6px;color:var(--ink);font-size:13px;font-family:inherit;
  transition:border-color .15s;
}
.test-a input[type="text"]:focus{outline:none;border-color:var(--accent);background:var(--paper)}
/* 分数入力（分子/分母を上下に） */
.frac-input{display:flex;align-items:center;gap:8px}
.frac-sign{
  width:32px;height:32px;border:1px solid var(--border);border-radius:6px;
  background:var(--paper-2);color:var(--ink);font-size:18px;font-weight:700;
  cursor:pointer;flex-shrink:0;transition:all .15s;
}
.frac-sign:hover{border-color:var(--accent)}
.frac-sign.minus{color:var(--ng);border-color:var(--ng)}
.frac-stack{display:flex;flex-direction:column;align-items:center;gap:3px}
.frac-stack input{
  width:64px;padding:5px 6px;background:var(--paper-2);border:1px solid var(--border);
  border-radius:5px;color:var(--ink);font-size:15px;font-family:'JetBrains Mono',monospace;
  text-align:center;
}
.frac-stack input:focus{outline:none;border-color:var(--accent);background:var(--paper)}
.frac-bar{width:64px;height:2px;background:var(--ink);border-radius:2px}
/* 文中インライン分数 */
.ifrac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px}
.ifrac .ifn{padding:0 4px;border-bottom:1.5px solid currentColor;font-size:0.82em}
.ifrac .ifd{padding:1px 4px 0;font-size:0.82em}
/* ふりがな（ルビ） */
ruby rt{font-size:0.56em;opacity:0.72;font-weight:400;letter-spacing:0;line-height:1}
/* 文章問題の本文 */
.reading-passage{
  background:var(--paper-2);border:1px solid var(--border);border-left:4px solid var(--accent);
  border-radius:8px;padding:14px 16px;margin:14px 0;font-size:14px;line-height:2;
}
.reading-passage .rp-label{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:8px;border-bottom:1px dashed var(--border);padding-bottom:6px}
.exam-paper .reading-passage{background:#f4f1e8;border-color:#cfc8b4;border-left-color:#1b1b1b;color:#1b1b1b}
.exam-paper .reading-passage .rp-label{color:#555;border-color:#cfc8b4}

/* ===== 模試: 本物のテスト用紙風 ===== */
.exam-paper{
  max-width:780px;margin:0 auto;background:#fcfbf6;color:#1b1b1b;
  border:1px solid #d8d4c8;border-radius:6px;padding:28px 34px 36px;
  box-shadow:0 6px 30px rgba(0,0,0,0.35);
}
.exam-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px double #1b1b1b;padding-bottom:12px;margin-bottom:14px;gap:16px}
.exam-title{font-size:19px;font-weight:700;letter-spacing:0.02em}
.exam-sub{font-size:11.5px;color:#666;margin-top:5px}
.exam-score{border:1.5px solid #1b1b1b;border-radius:4px;text-align:center;min-width:88px;flex-shrink:0}
.exam-score .lbl{font-size:10px;border-bottom:1px solid #1b1b1b;padding:2px 0;display:block;background:#efece2}
.exam-score .v{font-size:22px;font-weight:700;padding:6px 0;display:block;color:#b8860b}
.exam-name{display:flex;gap:18px;align-items:flex-end;font-size:12px;color:#333;margin-bottom:20px;flex-wrap:wrap}
.exam-name .field{display:flex;align-items:flex-end;gap:6px}
.exam-name .line{display:inline-block;border-bottom:1px solid #888;min-width:60px}
.exam-name .nameline{min-width:160px}
.exam-daimon{margin:16px 0 22px}
.exam-daimon-head{font-size:14px;font-weight:700;background:#1b1b1b;color:#fcfbf6;padding:5px 10px;border-radius:3px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.exam-daimon-head .haiten{font-size:10.5px;font-weight:400;opacity:0.85}
.exam-q{display:flex;gap:10px;align-items:flex-start;padding:9px 4px;border-bottom:1px dotted #cdc8b8}
.exam-q:last-child{border-bottom:none}
.exam-qno{font-weight:700;min-width:34px;font-size:13px;padding-top:2px}
.exam-qbody{flex:1;min-width:0}
.exam-qtext{font-size:14px;line-height:1.8}
.exam-ans{margin-top:8px}
.mtm-check{flex:0 0 auto;padding:7px 14px;border:none;border-radius:18px;background:#0aa6a6;color:#fff;font-weight:800;cursor:pointer;font-size:13px}
.mtm-check:hover{filter:brightness(1.1)}
.exam-fig{text-align:center;margin:8px 0 6px;padding:8px;background:#fff;border:1px solid #ddd6c4;border-radius:6px}
.exam-fig svg{vertical-align:middle;max-width:100%;height:auto}
/* 用紙内の解答ウィジェットを白系に */
.exam-paper input[type="text"]{background:#fff;border:1px solid #999;color:#1b1b1b;border-radius:3px;padding:6px 9px;font-size:13px;width:100%;max-width:280px}
.exam-paper input[type="text"]:focus{outline:none;border-color:#b8860b}
.exam-paper .hw-input-wrap{display:flex;gap:6px;align-items:center;max-width:320px}
.exam-paper .hw-ico-btn{background:#fff;border:1px solid #999;color:#555}
.exam-paper .audio-btn{background:#fff;border:1px solid #999;color:#333}
.exam-paper .choice-row{display:flex;flex-wrap:wrap;gap:8px}
.exam-paper .choice-pill{background:#fff;border:1px solid #999;color:#1b1b1b;border-radius:4px;padding:5px 12px;cursor:pointer;font-size:13px}
.exam-paper .choice-pill:hover{border-color:#b8860b}
.exam-paper .choice-pill.sel{background:#1b1b1b;color:#fff;border-color:#1b1b1b}
.exam-paper .choice-pill .kana{font-weight:700;margin-right:5px}
.exam-paper .frac-stack input{background:#fff;color:#1b1b1b;border:1px solid #999}
.exam-paper .frac-bar{background:#1b1b1b}
.exam-paper .frac-sign{background:#fff;color:#1b1b1b;border:1px solid #999}
.exam-paper .ifrac .ifn{border-bottom-color:#1b1b1b}
.exam-submit-row{text-align:center;margin-top:20px}
/* 模試 難易度レベル */
.mock-level-pick{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:6px 0}
.mock-level-card{
  background:var(--paper-2);border:1px solid var(--border);border-radius:10px;
  padding:12px 18px;cursor:pointer;min-width:96px;transition:all .15s;color:var(--ink);
}
.mock-level-card:hover{border-color:var(--border-h)}
.mock-level-card.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 3px 10px rgba(68,104,255,0.3)}
.mock-level-card .lvn{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;opacity:0.8}
.mock-level-card .lvname{font-size:15px;font-weight:700;margin-top:2px}
.mock-level-card .lvdesc{font-size:10.5px;opacity:0.75;margin-top:2px}
.mock-level-arrow{color:var(--muted);font-size:13px}
.mock-level-bar{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;max-width:780px;margin:0 auto 12px}
.mll-label{font-size:11px;color:var(--muted);margin-right:4px}
.mll-pill{
  background:var(--paper-2);border:1px solid var(--border);border-radius:16px;
  padding:5px 12px;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);transition:all .15s;
}
.mll-pill:hover{color:var(--ink);border-color:var(--border-h)}
.mll-pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.mll-arrow{color:var(--muted);font-size:11px}
.exam-hint-row{margin-top:5px;display:flex;align-items:center;gap:8px}
.exam-hint-row .hint-btn{background:#fff;border:1px solid #c9a227;color:#b8860b;border-radius:4px;width:26px;height:26px;cursor:pointer;font-size:13px;flex-shrink:0}
.exam-hint{font-size:12.5px;color:#b8860b;font-weight:600}
.test-a .choice-row{display:flex;flex-wrap:wrap;gap:4px}
.test-a .choice-pill{
  padding:5px 10px;background:var(--paper-2);border:1px solid var(--border);
  border-radius:5px;cursor:pointer;font-size:12px;transition:all .12s;
}
.test-a .choice-pill:hover{border-color:var(--accent)}
.test-a .choice-pill.sel{background:rgba(68,104,255,0.2);border-color:var(--accent);color:var(--accent)}

/* 採点結果バッジ（各行の右端） */
.test-a .mark{
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;
  padding:2px 6px;border-radius:4px;display:inline-block;margin-top:4px;width:fit-content;
}
.test-a .mark.ok{background:rgba(62,209,132,0.15);color:var(--ok)}
.test-a .mark.partial{background:rgba(240,185,11,0.15);color:var(--warn)}
.test-a .mark.ng{background:rgba(255,90,100,0.12);color:var(--ng)}
.test-a .mark.hidden{display:none}
.test-a .correct-answer{font-size:11px;color:var(--ok);margin-top:2px;display:none}
.test-a .correct-answer.show{display:block}
.test-a .your-answer{font-size:11px;margin-top:3px}
.test-a .your-answer.ua-ng{color:var(--ng)}
.test-a .your-answer.ua-ok{color:var(--ok)}
.test-a .reveal-btn{
  margin-top:4px;width:fit-content;padding:3px 10px;font-size:11px;cursor:pointer;
  background:var(--paper-2);border:1px solid var(--border);border-radius:5px;
  color:var(--muted);transition:all .15s;
}
.test-a .reveal-btn:hover{color:var(--accent);border-color:var(--accent)}

/* 採点モード切替 */
.test-mode-bar{
  display:flex;gap:8px;align-items:center;margin-bottom:16px;
}
.test-mode-pill{
  padding:5px 12px;background:var(--paper-2);border:1px solid var(--border);
  border-radius:16px;cursor:pointer;font-size:11px;font-weight:500;
  transition:all .15s;color:var(--muted);
}
.test-mode-pill:hover{border-color:var(--border-h);color:var(--ink)}
.test-mode-pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.test-grade-btn{
  padding:10px 24px;background:var(--accent);color:#fff;border:none;
  border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;
  transition:all .15s;margin-top:16px;
}
.test-grade-btn:hover{background:var(--accent-d)}
.test-grade-btn:disabled{opacity:0.4;cursor:not-allowed}

.test-result-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0;
}
.test-result-cell{
  background:var(--paper-2);border:1px solid var(--border);border-radius:8px;
  padding:16px;text-align:center;
}
.test-result-cell .val{
  font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:600;color:var(--accent);
}
.test-result-cell .lbl{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:0.1em}

.test-modal-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);
  z-index:9998;display:none;align-items:center;justify-content:center;
}
.test-modal-overlay.show{display:flex}
.test-modal{
  background:var(--paper);border:1px solid var(--border);border-radius:12px;
  padding:32px;max-width:360px;text-align:center;box-shadow:0 8px 32px var(--shadow);
}
.test-modal h3{font-size:18px;margin-bottom:12px}
.test-modal p{font-size:14px;color:var(--muted);margin-bottom:20px}

/* ===== 要点✓ SUMMARY MODE ===== */
.summary-scroll{width:100%;max-width:720px}
.summary-section{
  background:var(--paper);border:1px solid var(--border);border-radius:10px;
  padding:20px 24px;margin-bottom:14px;box-shadow:0 2px 8px var(--shadow);
}
.summary-section-title{
  font-size:14px;font-weight:700;margin-bottom:12px;padding-bottom:8px;
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;
}
.summary-section-title .num{
  font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;
  background:var(--accent);color:#fff;border-radius:4px;padding:2px 6px;
}
.summary-point{
  font-size:13px;line-height:1.8;padding:4px 0 4px 16px;position:relative;
}
.summary-point::before{content:'•';position:absolute;left:0;color:var(--accent)}
.summary-point .key{color:var(--ng);font-weight:700}
.summary-point .formula{
  font-family:'JetBrains Mono',monospace;font-size:12px;
  background:var(--paper-2);padding:2px 6px;border-radius:4px;
}
.summary-table{
  width:100%;border-collapse:collapse;margin:8px 0;font-size:12px;
}
.summary-table th{
  background:var(--paper-2);padding:6px 10px;text-align:left;font-weight:600;
  border:1px solid var(--border);font-size:11px;letter-spacing:0.05em;
}
.summary-table td{
  padding:6px 10px;border:1px solid var(--border);
}
.summary-table td .key{color:var(--ng);font-weight:700}

/* 穴埋め練習エリア */
.summary-practice{
  margin-top:14px;padding-top:12px;border-top:1px dashed var(--border);
}
.summary-practice-title{
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.15em;
  color:var(--muted);text-transform:uppercase;margin-bottom:10px;
}
.practice-row{
  display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;flex-wrap:wrap;
}
.practice-hint{color:var(--muted);min-width:150px;flex-shrink:0;font-size:12px}
.practice-choices{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.practice-choice{
  padding:6px 12px;background:var(--paper-2);border:1px solid var(--border);
  border-radius:6px;color:var(--ink);font-size:13px;cursor:pointer;
  transition:all .15s;font-family:inherit;
}
.practice-choice:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.practice-choice:disabled{cursor:default}
.practice-choice.correct{background:rgba(62,209,132,0.15);border-color:var(--ok);color:var(--ok);font-weight:700}
.practice-choice.wrong{background:rgba(255,90,100,0.12);border-color:var(--ng);color:var(--ng);opacity:0.7}
.practice-mark{font-size:14px;min-width:20px;text-align:center}

/* 音声再生ボタン */
.audio-btn{
  background:none;border:1px solid var(--border);border-radius:5px;
  padding:3px 8px;cursor:pointer;font-size:12px;color:var(--muted);
  transition:all .15s;display:inline-flex;align-items:center;gap:4px;
  margin-left:6px;vertical-align:middle;
}
.audio-btn:hover{color:var(--accent);border-color:var(--accent)}
.audio-btn.playing{color:var(--accent);border-color:var(--accent);background:rgba(68,104,255,0.1)}
.audio-section{
  margin-top:12px;padding-top:10px;border-top:1px dashed var(--border);
  display:flex;flex-wrap:wrap;gap:6px;
}
.audio-chip{
  padding:5px 10px;background:var(--paper-2);border:1px solid var(--border);
  border-radius:16px;cursor:pointer;font-size:11px;color:var(--muted);
  transition:all .15s;display:inline-flex;align-items:center;gap:4px;
}
.audio-chip:hover{color:var(--accent);border-color:var(--accent)}
.audio-chip.playing{color:var(--accent);border-color:var(--accent);background:rgba(68,104,255,0.1)}

/* ===== 暗記 CARD MODE ===== */
.card-deck-bar{
  display:flex;gap:8px;justify-content:center;margin-bottom:20px;
}
.card-deck-btn{
  padding:6px 18px;border:1px solid var(--border);border-radius:16px;
  background:var(--paper);cursor:pointer;font-size:12px;font-weight:600;
  color:var(--muted);transition:all .15s;
}
.card-deck-btn:hover{color:var(--ink);border-color:var(--border-h)}
.card-deck-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.card-area{width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:16px}
.card-progress-bar{
  display:flex;gap:3px;width:100%;justify-content:center;
}
.card-progress-bar .dot{
  width:10px;height:10px;border-radius:50%;background:var(--border);
  transition:all .2s;cursor:pointer;
}
.card-progress-bar .dot.current{background:var(--accent);transform:scale(1.3)}
.card-progress-bar .dot.mastered{background:var(--ok)}
.card-progress-bar .dot.missed{background:var(--ng)}
.card-category{
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.2em;
  color:var(--muted);text-transform:uppercase;
}
.flashcard{
  width:100%;min-height:240px;perspective:800px;cursor:pointer;
}
.flashcard-inner{
  width:100%;min-height:240px;position:relative;transition:transform 0.5s;
  transform-style:preserve-3d;
}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg)}
.flashcard-face{
  position:absolute;top:0;left:0;width:100%;min-height:240px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--paper);border:1px solid var(--border);border-radius:12px;
  padding:32px 28px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;box-shadow:0 4px 16px var(--shadow);
}
.flashcard-back{transform:rotateY(180deg)}
.flashcard-face .label{
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.3em;
  color:var(--muted);text-transform:uppercase;margin-bottom:16px;
}
.flashcard-face .content{font-size:20px;line-height:1.6;font-weight:500}
.flashcard-back .content{color:var(--accent);font-weight:600}
.flashcard-face .sub{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.6}
.card-controls{display:flex;gap:10px;align-items:center;width:100%}
.card-controls .btn{flex:1}
.card-nav{display:flex;gap:8px;align-items:center}
.card-nav .btn{min-width:44px;display:flex;align-items:center;justify-content:center}
.card-counter{
  font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);
  min-width:60px;text-align:center;
}
.card-result{
  width:100%;max-width:520px;background:var(--paper);border:1px solid var(--border);
  border-radius:10px;padding:28px 24px;text-align:center;box-shadow:0 4px 12px var(--shadow);
}
.card-result h2{font-family:'Fraunces',serif;font-size:24px;margin-bottom:6px;font-weight:600}
.card-result .score{
  font-family:'JetBrains Mono',monospace;font-size:40px;font-weight:600;
  color:var(--accent);margin:12px 0;
}
.card-result .msg{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:16px}

@media (max-width:600px){
  /* ===== スマホ最適化 ===== */
  .main{padding:12px 10px;gap:12px}
  /* ヘッダー */
  .hdr{padding:12px 14px 8px;gap:8px;flex-wrap:wrap;align-items:center}

  /* これでいくぞ／必殺 */
  .train-card{padding:16px 14px}
  .train-choices .tc{padding:13px 14px;font-size:15px;min-height:46px}
  .train-subjtabs{gap:5px}
  .train-subjtab{padding:6px 12px;font-size:12px}
  /* このまま行こうぜ（試験用紙） */
  .exam-paper{padding:14px 12px 20px;box-shadow:0 3px 14px rgba(0,0,0,0.25);border-radius:8px}
  .exam-head{flex-direction:column;gap:8px}
  .exam-score{align-self:flex-start;min-width:72px}
  .exam-title{font-size:16px}
  .exam-qtext{font-size:15px}
  .exam-paper .choice-row{flex-direction:column}
  .exam-paper .choice-pill{width:100%;padding:11px 12px;font-size:15px;text-align:left}
  .rel-modes{flex-wrap:wrap;gap:8px}
  .rel-mode{flex:1 1 45%;min-width:0;text-align:center}
  /* 読み上げ／音声プラス */
  .read-row{flex-direction:column;align-items:stretch;gap:8px}
  .read-btns{flex-direction:row}
  .read-play,.read-mic{flex:1;min-height:44px}
  /* タイムアタック */
  .ta-card{padding:16px 14px}
  .ta-q{font-size:16px}
  .ta-title{font-size:16px}
  .ta-timer{font-size:22px;min-width:64px}
  /* 送信ボタン */
  .exam-submit{padding:12px 22px;font-size:14px;width:100%;max-width:340px}
  /* フラッシュカード */
  .flashcard-face{min-height:180px;padding:24px 20px}
  .flashcard-face .content{font-size:17px}
}

/* ===== 手書き入力パッド ===== */
.hw-ico-btn{
  flex-shrink:0;background:var(--paper-2);border:1px solid var(--border);
  border-radius:6px;width:30px;height:30px;cursor:pointer;color:var(--muted);
  font-size:15px;display:inline-flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.hw-ico-btn:hover{color:var(--accent);border-color:var(--accent)}
.hw-input-wrap{display:flex;gap:6px;align-items:center;width:100%}
.hw-input-wrap input{flex:1;min-width:0}
.practice-row .hw-ico-btn{width:28px;height:28px;font-size:14px}
.hw-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:99990;
  display:none;align-items:center;justify-content:center;
}
.hw-overlay.show{display:flex}
.hw-pad{
  background:var(--paper);border:1px solid var(--border);border-radius:14px;
  padding:16px;box-shadow:0 12px 48px var(--shadow);width:360px;max-width:92vw;
}
.hw-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hw-title{font-size:13px;font-weight:600;color:var(--muted)}
.hw-preview{
  flex:1;font-size:20px;font-weight:600;color:var(--accent);min-height:26px;
  letter-spacing:0.05em;word-break:break-all;
}
.hw-close{
  background:transparent;border:none;color:var(--muted);font-size:20px;cursor:pointer;
  width:28px;height:28px;border-radius:6px;flex-shrink:0;
}
.hw-close:hover{color:var(--ink);background:var(--paper-2)}
#hwCanvas{
  width:100%;height:240px;background:#fff;border:2px dashed var(--border);
  border-radius:10px;cursor:crosshair;touch-action:none;display:block;
}
.hw-candidates{
  display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;min-height:40px;
  align-content:flex-start;
}
.hw-cand{
  padding:6px 12px;background:var(--paper-2);border:1px solid var(--border);
  border-radius:8px;cursor:pointer;font-size:20px;font-weight:600;
  transition:all .12s;line-height:1;
}
.hw-cand:hover{border-color:var(--accent);background:rgba(68,104,255,0.1);color:var(--accent)}
.hw-cand.loading{font-size:12px;color:var(--muted);font-weight:400;border-style:dashed}
.hw-controls{display:flex;gap:8px}
.hw-controls .btn{flex:1}
.hw-hint{font-size:11px;color:var(--muted);text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="panel-ctrl">
  <button onclick="toggleTheme()" title="テーマ切替">◐</button>
  <button onclick="closeLearnPanel()" title="閉じる">×</button>
</div>

<div id="root">
  <div class="hdr">
    <div class="hdr-left">
      <div class="eyebrow" id="hdrEyebrow">LEARN / Jr.High 1 — 1学期 中間テスト</div>
      <div class="title" id="hdrTitle">学習<em>中1 中間テスト対策</em></div>
    </div>
    <div class="roadmap" id="roadmap"></div>
  </div>

  <div class="subj-row">
    <div class="subj-tabs" id="subjTabs"></div>
    <div class="status-band">
      <div class="hdr-coin" id="coinMeter" title="勉強するほどゲーム時間が増える！">
        <span class="coin-ico">🎮</span>
        <span class="coin-label">ゲーム時間</span>
        <span class="coin-val" id="coinAmount">0分</span>
      </div>
      <div class="hdr-right">
        <div class="hdr-stat"><b id="statScore">0</b><span>Total</span></div>
        <div class="hdr-stat"><b id="statStreak">0</b><span>Streak</span></div>
        <div class="hdr-stat"><b id="statDone">0</b><span>Done</span></div>
      </div>
    </div>
  </div>
  <div class="mode-toggle" id="modeToggle">
    <button class="mode-btn mode-home" data-mode="daily">🏠 毎日1時間</button>
    <button class="guide-start-btn" id="guideStart">📋 今日のおすすめ順</button>
    <div class="mode-group">
      <span class="mode-group-label">① おぼえる</span>
      <button class="mode-btn active" data-mode="learn">LEARN</button>
      <button class="mode-btn" data-mode="summary">要点✓</button>
      <button class="mode-btn" data-mode="cards">暗記</button>
    </div>
    <div class="mode-group">
      <span class="mode-group-label">② れんしゅう</span>
      <button class="mode-btn mode-train" data-mode="train">🔥 これでいくぞ！</button>
      <button class="mode-btn mode-yomatsu" data-mode="yomatsu">📒 期末つみあげ</button>
    </div>
    <div class="mode-group">

      <div class="main" id="main"></div>

<div id="sidePanel">
  <div class="side-tabs">
    <button class="side-tab active" data-pane="lens">LENS</button>
    <button class="side-tab" data-pane="browser">BROWSER</button>

  <div class="side-content">
    <div class="side-pane active" id="paneLens">
      <div id="sideLens">
        <div class="lens-intro">わからないことがあったら聞いてね。問題の解説から質問を送ることもできるよ。</div>
        <div class="lens-input-bar">
          <input type="text" id="lensInput" placeholder="質問を入力...">

        </div>

  </div>
  </div>
  </div><!-- /rootWrap -->
</div><!-- /root -->

<div class="test-modal-overlay" id="testModal">

  </div>
</div>

<div class="hw-overlay" id="hwOverlay">
  <div class="hw-pad">

      <span class="hw-title">✍ 手書き入力</span>

      <button class="hw-close" id="hwClose">×</button>

      <button class="btn" id="hwClear">消す</button>

      <button class="btn primary" id="hwDone">完了</button>
    </div>

  </div>

<script>
// ============ Question Bank ============
// 中1 1学期中間テスト範囲。Lv1=入門、Lv5=応用。
// 各問題: {q, choices, a:正解index, expl?:解説, search?:画像/検索ワード}

var SUBJECTS = {
  en: {
    name: '英語', glyph: '✦',
    levels: [
      {
        name:'Lv1 be動詞 am/is/are',
        intro:'be動詞は英語の基本。主語によって am / is / are を使い分けよう。TEST Set 1-2 対応。',

// ============ State ============
var STORAGE_KEY = 'cignal_learn_progress';
var state = {
  subj: 'en',
  lv: 0,
  qi: 0,
  answered: false,
  results: [],
  selectedChoice: -1,
  totalScore: 0,
  streak: 0,
  bestStreak: 0,
  doneLevels: {},
  shuffle: null,      // 選択肢の表示順（元indexの配列）
  wrongThisQ: false,  // この問題で一度でも間違えたか
  correct: false,     // 直近の解答が正解か
  lvEarned: 0         // このレベル挑戦で得たゲーム時間（やり直しで減算）
};

// 0..n-1 をシャッフルした配列を返す（選択肢の位置ランダム化）
function makeShuffle(n){
  var a = [];
  for(var i=0;i<n;i++) a.push(i);
  for(var i=n-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

function loadProgress(){
  try{
    var s = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if(s){
      state.totalScore = s.totalScore || 0;
      state.bestStreak = s.bestStreak || 0;
      state.doneLevels = s.doneLevels || {};
      state.subj = s.subj || 'en';
      state.lv = s.lv || 0;
    }
  } catch(e){}
}
function saveProgress(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      totalScore: state.totalScore,
      bestStreak: state.bestStreak,
      doneLevels: state.doneLevels,
      subj: state.subj,
      lv: state.lv
    }));
  } catch(e){}
}

// ============ Side Panel (LENS + Browser) ============
function switchSideTab(pane){
  document.querySelectorAll('.side-tab').forEach(function(t){ t.classList.toggle('active', t.dataset.pane === pane); });
  document.querySelectorAll('.side-pane').forEach(function(p){ p.classList.toggle('active', p.id === 'pane'+pane.charAt(0).toUpperCase()+pane.slice(1)); });
}

document.querySelectorAll('.side-tab').forEach(function(t){
  t.onclick = function(){ switchSideTab(t.dataset.pane); };
});

function sideNavigate(url){
  switchSideTab('browser');
  document.getElementById('sideUrlInput').value = url;
  document.getElementById('sideBrowser').src = url;
}

document.getElementById('sideBrowserGo').onclick = function(){

function lensAddMessage(text, role){
  var el = document.getElementById('lensMessages');

// 設定済みのAPIキーを優先順で全て返す（Settingsの hub_apikeys を共有）
function lensGetAllProviders(){
  var keys = {};
  try { keys = JSON.parse(localStorage.getItem('hub_apikeys') || '{}'); } catch(e){}
  var order = ['claude','grok','gemini','groq','openrouter'];
  var arr = [];
  for(var i=0;i<order.length;i++){ if(keys[order[i]]) arr.push({provider:order[i], apiKey:keys[order[i]]}); }
  return arr;
}

// エラー文からAPIキーやURLを隠す
function lensSanitizeError(err){
  var msg = (err && err.message) ? err.message : (typeof err === 'string' ? err : JSON.stringify(err));
  msg = msg.replace(/key=[\w\-]+/gi, 'key=***');
  msg = msg.replace(/https?:\/\/[^\s]+/g, function(u){ return u.split('?')[0]; });
  return msg;
}

// 混雑・一時エラーなら次のプロバイダーへ切替（429/5xx/認証）
function lensShouldFallback(errStr){
  if(/\b429\b|rate.?limit|quota|exceeded/i.test(errStr)) return true;
  if(/\b5\d\d\b|timeout|timed.?out|network/i.test(errStr)) return true;
  if(/\b401\b|\b403\b|invalid.?api.?key|unauthorized/i.test(errStr)) return true;
  return false;
}

function lensAsk(text){
  var invoke = window.__TAURI__ && window.__TAURI__.core ? window.__TAURI__.core.invoke : null;
  if(!invoke){
    lensAddMessage('この環境ではAI機能を利用できません。', 'ai');
    return;
  }
  var providers = lensGetAllProviders();
  if(!providers.length){
    lensAddMessage('AIのAPIキーが未設定です。設定（Settings）でAPIキーを登録すると会話できます。', 'ai');
    return;
  }
  var loadingDiv = lensAddMessage('考え中...', 'ai loading');
  var idx = 0;
  function tryNext(lastErr){
    if(idx >= providers.length){
      loadingDiv.remove();
      lensAddMessage('AIが混雑中（または利用できません）でした。少し待ってからもう一度試してね。' + (lastErr ? '\n（' + lastErr + '）' : ''), 'ai');
      return;
    }
    var cfg = providers[idx++];
    loadingDiv.textContent = '考え中... (' + cfg.provider + ')';
    invoke('ai_chat', { provider: cfg.provider, apiKey: cfg.apiKey, message: text }).then(function(res){
      loadingDiv.remove();
      lensAddMessage(res || '回答を取得できませんでした。', 'ai');
    }).catch(function(err){
      var msg = lensSanitizeError(err);
      if(lensShouldFallback(msg) && idx < providers.length){
        tryNext(msg); // 次のプロバイダーへ自動切替
      } else {
        loadingDiv.remove();
        lensAddMessage('エラー: ' + msg, 'ai');
      }
    });
  }
  tryNext();
}

  Object.keys(SUBJECTS).forEach(function(k){
    var s = SUBJECTS[k];
    var act = (k === state.subj) ? 'active' : '';

  });
  el.innerHTML = html;
  el.querySelectorAll('.subj-tab').forEach(function(b){
    b.onclick = function(){ currentSubj = b.dataset.k; state.subj = b.dataset.k; state.lv = 0; resetLevel(); saveProgress(); render(); };
  });
}

function renderLvBar(){
  var el = document.getElementById('lvBar');
  var levels = SUBJECTS[state.subj].levels;
  var html = '<span class="lv-label">Level</span>';
  for(var i=0;i<levels.length;i++){
    var act = (i === state.lv) ? 'active' : '';
    var done = state.doneLevels[state.subj+'-'+i] ? 'done' : '';
    html += '<button class="lv-btn '+act+' '+done+'" data-i="'+i+'"><span>Lv'+(i+1)+(done?' ✓':'')+'</span><small>'+levels[i].questions.length+'問</small></button>';
  }
